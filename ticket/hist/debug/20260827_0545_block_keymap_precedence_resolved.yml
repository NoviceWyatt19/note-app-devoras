# ━━━
bug_report:
  symptom: "블록의 마지막 줄 끝에서 ArrowDown 을 눌러도 다음 블록으로 포커스가 이동하지 않는다 (첫 줄 시작에서 ArrowUp 도 동일). 블록 내부에서의 일반적인 방향키 이동은 정상 동작한다."
  cause: >
    CodeMirrorBlock 생성 이펙트의 extensions 배열에서
    keymap.of([...defaultKeymap, ...historyKeymap]) 가 blockKeymap 보다 먼저
    나열되어 있었다. CodeMirror 6 의 keymap facet 은 먼저 등록된 바인딩을
    우선 시도하며, @codemirror/commands 의 cursorDown/cursorUp 커맨드는
    문서 경계(더 이상 이동할 곳이 없는 지점)에서도 이동 자체를 "처리했다"는
    의미로 true 를 반환한다. 따라서 blockKeymap 의 경계 감지 핸들러
    (from === 0 / from === doc.length 조건)는 항상 defaultKeymap 에 선점당해
    한 번도 실행되지 못했다.
  location:
    - "project/src/widgets/BlockEditor/ui/BlockEditor.tsx (extensions 배열의 keymap 순서)"
  impact:
    - "R2: 블록 간 ArrowUp/ArrowDown 키보드 탐색 전면 불가 (마우스 클릭으로만 블록 전환 가능)"
# ━━━
reproduction:
  - "T3(WKWebView)에서 한 블록의 마지막 위치(doc.length)에 커서를 두고 ArrowDown 입력"
  - "포커스가 다음 블록으로 넘어가지 않고 같은 블록에 그대로 머무름을 확인"
  - "동일 블록 중간 지점에서 ArrowDown 입력 시에는 줄바꿈 이동이 정상 동작함을 대조 확인 (defaultKeymap 이 항상 승리한다는 증거)"
# ━━━
fix:
  - "extensions 배열에서 blockKeymap 을 keymap.of([...defaultKeymap, ...historyKeymap]) 보다 먼저 배치"
  - "blockKeymap 은 경계가 아닐 때 false 를 반환해 defaultKeymap 으로 정상 위임하므로 일반 이동 동작에는 회귀 없음"
# ━━━
verification:
