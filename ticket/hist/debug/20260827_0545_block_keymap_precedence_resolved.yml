subject: "defaultKeymap 이 blockKeymap 보다 먼저 등록되어 블록 경계에서 ArrowUp/ArrowDown 블록 간 이동이 절대 발동하지 않음"
status: "Done"
severity: "P1"
review_ref: "DEBUG_PLAN.md G2 R2 실기 검증 (T3, tauri-plugin-mcp-bridge)"
