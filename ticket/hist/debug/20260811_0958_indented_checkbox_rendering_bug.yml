# ━━━
update: "2026-08-11 09:58"
project_ref: "PRJ-DEVORAS-MVP"
subject: "들여쓰기된 리스트 내 체크박스([ ], [x]) 미렌더링 버그 수정"
status: "Todo"
# ━━━
bug_report:
  symptom: "하위 항목 작성을 위해 에디터에서 공백(Space) 또는 탭(Tab)으로 들여쓰기(Indentation)를 적용한 리스트 체크박스(예: '  - [ ]')는 마크다운 체크박스 위젯으로 렌더링되지 않고 일반 텍스트 상태로 남는 현상 발생."
  cause: "`CheckboxDecorator.ts`의 정규식 `CHECKBOX_RE = /^(- \\[([ x])\\] ?)/`가 라인의 시작 위치(`^`) 바로 다음에 바로 `- [ ]` 기호가 오는 케이스만 매칭하도록 엄격하게 고정되어 있어, 앞쪽에 들여쓰기 공백이 존재하는 경우 검사식 매칭에 실패함."
# ━━━
resolution_steps:
  - "정규식 수정: 앞선 들여쓰기 공백을 허용하고 매칭 그룹으로 분할하도록 정규식을 개편한다. (예: `CHECKBOX_RE = /^([ \\t]*)(- \\[([ x])\\] ?)/`)"
  - "인덱스 역산 로직 수정: `CheckboxDecorator.ts` 내에서 데코레이션 치환 범위를 지정할 때, 들여쓰기 공백을 보존하기 위해 치환 시작 위치를 `line.from + 들여쓰기길이(match[1].length)`로 가변 오프셋 계산하도록 변경한다."
  - "bracketFrom 및 matchEnd 보정: 체크박스 클릭 핸들러 동작을 위해 `bracketFrom`을 `line.from + match[1].length + 2`로 수정하고, `matchEnd` 역시 `line.from + match[1].length + match[2].length`로 보정하여 오버플로우나 범위 이탈을 차단한다."
# ━━━
target_files:
  - "shared/lib/editor/decorators/impl/CheckboxDecorator.ts"
