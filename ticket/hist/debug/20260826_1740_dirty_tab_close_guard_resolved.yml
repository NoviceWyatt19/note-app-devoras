  method_note: >
    confirmDiscardIfDirty 는 Tauri 의 ask 를 직접 import 한다. Node 에는 window 가 없어
    **ask 에 도달하면 ReferenceError 가 난다.** 이를 관측 수단으로 그대로 썼다 —
    던지지 않고 true 면 "확인 창을 띄우지 않았다", 던지면 "띄우려 했다"는 증거다.
    목(mock) 없이 게이트 동작을 증명할 수 있다.
  found_and_fixed:
    - id: "openTab 스냅샷 유실 (BUG-20260826-02 의 잔여 구멍)"
      detail: >
        C6 이 최초 실행에서 실패했다. openTab 이 _snapshotActiveTab() 을 계산해 놓고
        **커밋하지 않은 채** await 뒤에 get().panes 를 다시 읽어, 디스크 로드 경로에서
        떠나는 탭의 미저장 편집이 통째로 버려졌다. BUG-20260826-02 는 캐시 복원 분기만
        고치고 로드 분기를 놓쳤다. 스냅샷을 즉시 커밋하도록 수정 → C6 통과.
  capabilities_question_resolved: >
    세션 티켓이 "31a5283 이 capabilities/default.json 을 +4줄 수정 — B1 범위 밖" 이라고
    남긴 항목을 확인했다. 4건 중 3건은 **B1 이 실제로 요구하는 권한**이다:
      - dialog:allow-ask        → confirmClose.ts / App.tsx 의 ask() 가 사용
      - core:window:allow-destroy → App.tsx:74 의 getCurrentWindow().destroy() 가 사용
      - core:window:allow-close   → onCloseRequested 로 닫기를 가로채므로 필요
    남은 1건 **dialog:allow-message 는 코드 전체에서 사용처가 없다.**
    최소권한 원칙상 제거 대상이며 BUG-20260826-01(scope 축소) 작업에 함께 넣을 것을 권한다.
    (제거는 Rust 재빌드가 필요해 이번 세션에서는 확인 불가 — 그래서 건드리지 않았다.)
