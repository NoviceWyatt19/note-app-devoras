bug_report:
  symptom: "폴더 /w/plan 을 /w/roadmap 으로 이름 변경하면 열려 있던 /w/plan_v2.md 탭까지 /w/roadmap_v2.md 로 잘못 바뀐다. 폴더 /w/doc 삭제 시 /w/document.md 탭이 함께 닫힌다."
  cause: "경로를 path 경계가 아닌 단순 문자열 접두사로 비교한다. 치환 역시 String.replace(oldPath, newPath) 라 앵커링되지 않는다."
  location:
    - "project/src/entities/document/model/store.ts:416 (handleFileRenamed — filePath.startsWith(oldPath))"
    - "project/src/entities/document/model/store.ts:433 (activeTabId.startsWith(oldPath))"
    - "project/src/entities/document/model/store.ts:450 (handleFileDeleted — filePath.startsWith(path))"
# ━━━
architecture_guidelines:
  - "Path Is Not String: 경로 비교는 반드시 구분자 경계를 포함한다 (target === base || target.startsWith(base + '/'))."
  - "Single Source: 경로 유틸을 shared/lib/path.ts 한 곳에 두고 document store 전 호출부가 이를 사용한다."
  - "Anchored Rebase: 치환은 replace() 가 아니라 newBase + target.slice(oldBase.length) 로 접두사 위치를 고정한다."
# ━━━
