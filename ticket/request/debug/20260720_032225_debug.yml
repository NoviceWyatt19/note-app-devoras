type: "DEBUG_TICKET"
id: "DBG-20260724-02"
# ━━━
update: "2026-07-24 17:00"
# ━━━
subject: "블록 간 방향키(ArrowUp, ArrowDown) 이동 시 가로 컬럼(Column) 위치 미보존"
# ━━━
symptom:
  situation: "방향키로 위/아래 블록 전이 시 기존 가로 컬럼 위치가 보존되지 않고 이전 블록 끝(length) 또는 다음 블록 처음(0)으로 리셋됨"
  repro_steps:
    - "블록의 N번째 글자 위치에 커서 배치"
    - "ArrowUp 또는 ArrowDown 눌러 인접 블록으로 이동"
    - "커서가 0 또는 length 위치로 강제 고정되는 현상 확인"
  expected: "인접 블록 전이 시 이전/다음 행의 가용 길이 내에서 기존 가로 컬럼 위치 유지"
# ━━━
analysis:
  hypotheses:
    - "BlockEditor.tsx onFocusPrev/onFocusNext에 content.length 및 0 오프셋이 하드코딩되어 있음"
    - "CodeMirror keymap run(view) 핸들러에서 line.number 확인 후 컬럼 정보 없이 콜백 호출"
  root_cause: "블록 전이 시 현재 행의 가로 오프셋(컬럼)을 계산하여 타깃 행에 매핑하지 않고 오프셋을 리셋하는 설계 결함"
# ━━━
resolution:
  direction: "Keymap 핸들러에서 이동 직전 가로 컬럼 오프셋을 계산하여 focusBlock 매핑 인자로 전달"
  action:
    - "run(view) 핸들러에서 from - line.from으로 컬럼 오프셋 계산 후 onFocusPrev(col)/onFocusNext(col) 전달"
    - "BlockEditor.tsx에서 타깃 블록의 행 길이와 col을 Math.min으로 보정하여 focusBlock 호출"
# ━━━
prevention:
  verification: "임의의 가로 컬럼 위치에서 ArrowUp/ArrowDown 입력 시 타깃 블록의 동일 컬럼 위치 보정 이동 확인"
  action_plan: "다중 블록 에디터 포커스 체인 구성 시 행 전이 및 컬럼 위치 보정 로직 단위 검증 표준화"