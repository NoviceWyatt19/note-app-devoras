architecture_guidelines:
  - "Controlled vs Uncontrolled: `ErdDesigner` 컴포넌트가 부모로부터 받는 `document` props와 내부 로컬 상태 간의 동기화 충돌을 막아야 함. 탭이 바뀔 때(ID 변경 시)만 `selection`을 초기화하도록 `useEffect` 의존성을 교정할 것."
  - "Unidirectional Data Flow: 노드 위치 변경, 테이블 생성 등 `updateDocument`가 호출될 때마다 갱신된 JSON을 부모의 `onChange` (또는 `useDocumentStore().updateContent`) 콜백으로 즉시 넘겨주어 스토어 상태가 항상 최신을 유지하도록 연결할 것."
  - "Tailwind Design System: 상단 툴바 버튼(`Add table`, `Layout`, `SVG` 등)에 `px-3 py-1.5 bg-darkPanel border border-darkBorder hover:bg-darkHover rounded-md text-sm text-slate-200` 등의 Tailwind 클래스를 적용하여 미니멀한 다크 톤으로 통일할 것."
