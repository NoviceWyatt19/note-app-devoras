architecture_guidelines:
  - "Strict Measurement Control: `.cm-line`의 높이를 브라우저나 외부 CSS가 멋대로 바꾸지 못하도록, `lineHeight: '1.6em'`과 `minHeight: '1.6em'`을 명시적으로 고정하여 캐시 오염을 원천 차단할 것."
  - "Event Delegation (Tell, Don't Ask): 커스텀 `ArrowUp`, `ArrowDown` 로직에서 `line.number === 1` 같은 불완전한 예측 기반의 상태 판단(Ask)을 제거하고, 커서가 완벽하게 블록의 끝(`from === 0` 또는 `from === view.state.doc.length`)에 도달했을 때만 블록을 넘나들도록 단순화(Tell)할 것."
# ━━━
