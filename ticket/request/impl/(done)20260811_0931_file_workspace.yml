architecture_guidelines:
  - "Recursive Component: 하위 디렉터리를 렌더링할 때 재귀적(Recursive) 컴포넌트 호출 패턴을 사용하여 N-Depth 폴더 트리를 유연하게 지원할 것."
  - "State Synchronization (Tell, Don't Ask): 파일/폴더의 이름 변경(Rename)이나 삭제(Delete) 시, 뷰가 직접 탭 상태를 조작하지 말고 스토어 액션에 위임하여 열려있는 탭(`openedTabs`) 상태와 안전하게 동기화할 것."
  - "Design System: 미니멀하고 현대적인 어두운 테마를 유지하며, 폴더의 뎁스(Depth)를 나타내는 인덴트(Indent) 라인을 깔끔하게 렌더링할 것."
