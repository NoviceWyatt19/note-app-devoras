# 🗂️ FEATURE TICKET
type: "FEATURE_TICKET"
id: "FEAT-20260831-01"
# ━━━
update: "2026-08-31 07:00"
project_ref: "PRJ-DEVORAS-MVP"
subject: "마인드뷰를 사이드 패널이 아닌 메인 뷰로 볼 수 있게 한다 (기존 '전역 마인드맵'의 의도 정정)"
status: "Backlog — 기록만. 사용자 판단: 지금 중요하지 않으며 추후 구현 검토"
priority: "낮음 (기능 결손 아님 — 기존 기능이 다르게 구현돼 있을 뿐)"
origin: "사용자 확인 (2026-08-31)"
# ━━━
background:
  what_was_asked: >
    마인드뷰를 **사이드 탭에서만이 아니라 하나의 메인 뷰로도** 볼 수 있게 해달라는 요청이었다.
    즉 '어디에 띄우는가'(배치·표시 방식)에 대한 요청이다.
  what_was_built: >
    이전 에이전트가 이를 **'전역(global) 마인드맵'** 으로 해석해, `mindmap-global` 이라는
    새 탭 타입을 만들었다. 즉 '무엇을 그리는가'(범위)를 바꾼 것으로 오해했다.
  user_words: "마인드뷰를 사이드 탭에서만이 아닌 하나의 메인뷰로 볼 수 있었으면 한다고 구현을 요청했는데 전역 마인드맵으로 이해한 것같아"
# ━━━
current_behavior:
  note: "2026-08-31 코드 대조로 확인한 실제 동작. 이름과 동작이 어긋나 있다."
  facts:
    - "탭 제목은 '전역 마인드맵' 이지만 실제로는 **현재 문서 하나**만 비춘다. 워크스페이스 전체 범위가 아니다."
    - "`openTab` 의 mindmap-global 분기(entities/document/model/store.ts:137-158)는 고정 싱글턴 id `'global-mindmap'` 으로 탭을 만들고, 그 탭에는 path·fileEntry·cache 가 없다."
    - "`_activateTabContent`(:281)는 type 이 markdown·erd 이고 fileEntry 가 있을 때만 내용을 채우므로, 이 탭은 두 조건 모두 불충족이라 **자기 내용을 갖지 않는다.**"
    - "결과적으로 화면에 보이는 것은 **마지막으로 활성화된 실제 문서**의 rawContent 를 실시간으로 비추는 것이다."
  critical_finding:
    label: "⚠️ 이 기능은 **한 번도 동작한 적이 없다** (2026-08-31 확인, project-b8 지적)"
    detail: >
      위 사실들에 더해 결정적인 것이 하나 더 있다. `getCurrentFile()`(store.ts:108)은
      activeTab.type 이 markdown 또는 erd 일 때만 값을 반환하고 **mindmap-global 에는
      무조건 null 을 준다.** 그런데 독립 탭은 activeTab.type 이 정확히 mindmap-global 일 때만
      렌더된다(PaneContainer 삼항식). 따라서 이 렌더 경로에서 currentFile 은 **항상 null** 이고,
      MindView 의 `if (!currentFile)` 조기 반환이 **항상** 발화한다.
    consequence: >
      '전역 마인드맵' 탭은 마인드맵 대신 **'마인드 맵 로드 대기' 빈 상태만** 보여준다.
      내용이 그려진 적이 없다.
    predates_everything: >
      7-C 착수 이전 커밋(777097e)에서 대조 확인 — getCurrentFile 의 타입 가드와
      MindView:354 의 조기 반환이 **동일한 형태로 이미 존재**했다. REF-20260831-01 이
      만든 것이 아니며 C-3 는 이 동작을 bug-for-bug 로 보존했다.
  assessment: >
    **앞선 판단을 정정한다.** 이 티켓의 최초 판은 '동작은 원 요청과 가깝고 어긋난 것은
    주로 이름'이라고 적었으나 **사실이 아니다.** rawContent 가 마지막 실제 문서를 들고 있는
    것은 맞지만, MindView 가 그것을 그리는 데까지 도달하지 못한다. 이름만의 문제가 아니라
    **기능이 존재하지 않는다.**
# ━━━
implementation_notes:
  - id: "이름 정리로는 해결되지 않는다 (정정)"
    detail: >
      최초 판은 '이름만 바꾸면 상당 부분 충족'이라고 적었으나 위 critical_finding 으로
      **철회한다.** 빈 상태만 나오는 화면의 이름을 바꿔도 여전히 빈 상태다.
      실제 구현이 필요하다 — 최소한 이 렌더 경로가 어떤 문서를 그릴지 결정하고,
      currentFile 게이트를 그에 맞게 바꿔야 한다.
  - id: "구현의 핵심 결정: 이 뷰는 어떤 문서를 그리는가"
    detail: >
      독립 탭이 활성일 때는 정의상 '활성 탭 = 마인드뷰 자신' 이라 '현재 문서' 라는 개념이
      순환한다. 따라서 무엇을 그릴지 명시적으로 정해야 한다. 후보 —
      (a) 이 탭이 열리기 직전에 활성이던 문서를 기억해 고정,
      (b) 같은 패널의 다른 탭 중 마지막 마크다운 탭,
      (c) 다른 패널의 활성 마크다운 탭,
      (d) 탭 생성 시 대상 문서를 사용자가 선택.
      원 요청('메인 뷰로 보고 싶다')에 가장 가까운 것은 (a) 또는 (d) 로 보이나 **사용자 판단 사항**이다.
  - id: "진짜 '전역' 을 원하는지는 별개 질문"
    detail: >
      워크스페이스 전체 문서를 하나의 마인드맵으로 묶는 기능은 **원 요청에 없었다.**
      필요하다면 별도 티켓으로 분리할 것. 두 기능을 하나로 뭉치지 말 것.
  - id: "Step 7-C 이후에 착수할 것"
    detail: >
      마인드뷰의 상태 소스는 7-C(탭 스코프 스토어)에서 활성 탭 해석 방식으로 바뀐다
      (REF-20260831-01 D-2·D-6). 그 착지 전에 손대면 두 번 고치게 된다.
  - id: "탭이라고 해서 문서를 소유하지는 않는다"
    detail: >
      7-C 에서 얻은 교훈. mindmap-global 은 탭 UI 를 빌린 뷰포트에 가깝다. 이 기능을
      다시 설계할 때도 '이 뷰가 자기 내용을 갖는가, 남의 내용을 비추는가' 를 먼저 정할 것.
# ━━━
design_direction:
  decided_by: "사용자 (2026-08-31)"
  user_words: >
    "마인드 맵을 사이드탭 관점에서 아니라 근본적으로 일반 탭처럼 관리되어도 되고
    특수적으로 사이드 탭에서 바로 연결해 볼 수 있는 숏컷이 존재한다는 관점으로
    시점을 바꾸는게 좋다"
  core_diagnosis:
    user_words: "현재 전역 마인드 맵의 큰 문제는 띄울 노트와 연결되는 로직이 없다는 거지"
    detail: >
      위 critical_finding 과 같은 것을 가리킨다. currentFile 이 항상 null 인 이유의 본질은
      **이 탭에 '어떤 노트를 그릴지' 를 담는 자리가 없기 때문**이다. 마크다운 탭이 fileEntry 를
      갖는 것과 달리 mindmap-global 탭은 `{ id, type, title }` 뿐이다. 게이트를 우회해도
      그릴 대상이 없으므로, 게이트 수정이 아니라 **원천(source) 개념 도입**이 해법이다.
  principle: >
    **마인드뷰는 일반 탭이다.** 사이드 패널이 본체이고 탭이 파생인 것이 아니라, 그 반대다.
    사이드 패널은 '현재 문서의 마인드뷰를 바로 열어보는 **숏컷**' 이라는 특수 표현일 뿐이다.
  consequences:
    - id: "탭이 원천을 갖는다"
      detail: >
        마크다운 탭이 fileEntry 를 갖듯 마인드뷰 탭도 대상 문서를 갖는다.
        `{ type: 'mindmap', fileEntry }` 형태가 자연스럽다.
    - id: "고정 싱글턴 id 를 버린다"
      detail: >
        `'global-mindmap'` 이라는 단일 id 는 '일반 탭' 관점과 양립하지 않는다.
        문서마다 하나씩 열릴 수 있어야 하므로 id 는 원천에서 파생한다(예: `mindmap:{path}`).
        '전역(global)' 이라는 개념 자체가 이 시점에서 소멸한다.
    - id: "메인/사이드 동시 표시 문제는 사라진다 (열린 질문 1 해소)"
      user_answer: "메인뷰와 사이드 패널뷰를 굳이 동시에 띄울 일이 없다"
      detail: "동시 표시를 설계 목표로 삼지 않는다. 일반 탭으로 보면 애초에 제기되지 않는 질문이다."
    - id: "스플릿 뷰는 자동으로 따라온다 (열린 질문 2 해소)"
      user_answer: "일반 탭처럼 바라본다면 가능해도 좋지 않을까"
      detail: >
        일반 탭이면 어느 패널에든 놓을 수 있고 분할 한쪽에 둘 수도 있다. 별도 기능이 아니라
        '일반 탭' 결정의 부수 효과다. BlockEditor 와 나란히 두는 사용도 자연스럽게 성립한다.
    - id: "getCurrentFile 가드는 결과이지 원인이 아니다"
      detail: >
        원천이 생기면 `getCurrentFile()`(store.ts:108)의 타입 가드에 마인드뷰 타입을 더하는
        수정이 따라온다. 다만 **가드부터 고치지 말 것** — 그릴 대상이 없는 상태에서 게이트만
        열면 빈 화면이 다른 이유로 빈 채 남는다.
    - id: "7-C 와의 관계가 뒤집힌다"
      detail: >
        D-6 은 'mindmap-global 은 자기 내용을 갖지 않으므로 탭 스코프 스토어 대상이 아니다'
        라고 판단했고 **현재 구현 기준으로는 여전히 옳다.** 그러나 이 설계 방향대로 원천을
        가지면 마인드뷰 탭은 **자기 문서를 소유**하게 되므로, 그때는 일반 탭과 동일하게
        탭 스코프 스토어를 갖는 것이 맞다. D-6 의 교훈('탭이라고 다 문서를 소유하진 않는다')은
        유지되되, 이 탭에 대한 답만 뒤집힌다. 구현 시 이 점을 반드시 재평가할 것.
# ━━━
open_questions:
  - "사이드 패널 숏컷의 동작 정의: 현재 문서의 마인드뷰 탭을 '여는' 것인가, 탭을 만들지 않고 패널에서만 보여주는 것인가."
  - "원천 문서가 닫히거나 삭제·이름 변경될 때 마인드뷰 탭의 거동 (handleFileRenamed/handleFileDeleted 연동)."
