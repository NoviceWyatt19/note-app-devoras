architecture_guidelines:
  - "Cursor-aware Pattern: 안정화된 `DecorationOrchestrator`를 활용하여, 커서가 요소 내부에 진입할 때만 원시 마크다운 마커를 노출하고 밖에서는 UI로 치환할 것."
