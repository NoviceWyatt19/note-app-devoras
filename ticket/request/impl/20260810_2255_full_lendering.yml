  - "Design System: 미니멀한 어두운 배경을 유지하되, 인용구(Blockquote) 보더 라인이나 활성화된 리스트 불릿 요소에 은은한 네온/LED 감성의 포인트 스타일(Glow Effect)을 적용할 것."
