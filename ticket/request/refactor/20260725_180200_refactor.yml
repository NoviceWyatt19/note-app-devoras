  inner_heading_rendering: "H3 이하 헤딩은 BlockEditor 내부 CodeMirror의 SyntaxDecorator로 시각적 헤딩 스타일 적용"
  config_model:
    title_level: "H1"
    main_block_levels: ["H2"]
