architecture_decisions:
  dependency: "Markdown semantics -> decorator registry -> CodeMirror extension -> BlockEditor"
  rendering: "SyntaxDecorator 구현체 기반 등록 및 IME 조합 중 Decoration.replace 강제 차단"
  style_config: "토큰 기본값/사용자 정의값 병합 후 CSS 변수 또는 CodeMirror theme 전달"
# ━━━
action_plan:
  - "H태그·인용문·목록 데코레이터 및 테마 토큰 인터페이스 설계"
  - "선택 감싸기 및 Tab/Shift+Tab 명령 구현"
  - "IME 조합 상태 반영 마커 가시성 정책 적용"
  - "한글·영문·선택 편집 회귀 테스트 작성"