problem:
  symptom: "패널을 좌우로 분할하고 각 패널에서 서로 다른 탭을 활성화해도, 두 패널이 모두 '활성 패널의 문서'를 렌더링한다. 탭 바 표시와 실제 내용이 불일치한다."
  cause: "PaneContainer 가 패널마다 <BlockEditor> 를 마운트하지만, BlockEditor 는 파일을 getCurrentFile()(활성 패널의 탭)에서, 내용을 전역 useBlockStore.blocks / useDocumentStore.rawContent 에서 읽는다. 즉 인스턴스는 N개지만 데이터 소스는 1개다."
  location:
    - "project/src/pages/WorkspacePage/WorkspacePage.tsx:353 (<BlockEditor key={activeTab.id} /> — 탭 주입 없음)"
    - "project/src/widgets/BlockEditor/ui/BlockEditor.tsx:355 (useDocumentStore(s => s.getCurrentFile()))"
    - "project/src/entities/document/model/store.ts (rawContent/nodes/isDirty/viewMode 전역 단일 필드)"
# ━━━
already_mitigated:
  note: "0.8.4(843ff42)에서 교차 오염 '피해'는 상당 부분 차단됨. 본 티켓은 남은 '표시 정확성' 문제를 다룬다."
  done:
    - "blockStore.ownerTabId 도입 — 다른 탭 소유 블록으로는 쓰기 차단 (block/model/store.ts:13)"
    - "saveFile(paneId?, tabId?) 로 저장 대상 명시화 + ownerTabId 일치 검사 (document/model/store.ts:473)"
    - "updateContentForTab(tabId, content) 로 탭 지정 갱신 경로 분리"
# ━━━
architecture_guidelines:
  - "Explicit Ownership: 컴포넌트는 자신이 그리는 탭을 prop 으로 명시적으로 받는다. 전역 '활성 탭' 조회로 자기 데이터를 유추하지 않는다."
  - "Lifecycle-Bound State: 문서 상태는 탭 언마운트와 함께 소멸해야 한다. Context Provider 스코프 스토어가 최종 목표다."
  - "Incremental Migration: 1단계(prop 주입)만으로도 표시 불일치는 해소된다. 2단계(스코프 스토어)는 별도 배치로 분리 가능하다."
  - "Snapshot Interface Reuse: advanced_rendering_optimization.md Phase 1(상태 스냅샷)과 동일 지점을 건드리므로 인터페이스를 한 번만 설계한다."
# ━━━
