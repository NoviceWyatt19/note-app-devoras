staging:
  rationale: >
    본 작업은 계획서가 '되돌리기 비싸다'고 명시한 유일한 항목이다. 따라서 되돌릴 수 없는
    단계(전역 싱글턴 제거)를 맨 뒤로 몰고, 그 앞의 모든 단계를 독립적으로 되돌릴 수 있게 쪼갠다.
    각 단계는 개별 커밋으로 하고, 단계 사이에 T1 전량과 R1~R6 을 통과시킨 뒤 다음으로 넘어간다.
  stages:
    - id: "C-1 — 스토어 팩토리와 Provider 신설 (동작 변화 0)"
      detail: >
        createTabStore(tabId) 팩토리와 TabDocumentProvider(React Context)를 만든다.
        아직 어떤 소비자도 연결하지 않는다. 전역 스토어가 계속 권위를 갖는다.
      gate: "빌드·타입 통과. 런타임 동작 변화가 0건인 것을 확인(회귀 테스트 전량 그대로 통과)."
      reversible: true
    - id: "C-2 — BlockEditor 를 Context 소비자로 전환"
      detail: >
        BlockEditor 가 Context 에서 상태를 읽도록 바꾼다. Provider 가 없으면 전역으로
        폴백하게 두어 이 단계에서도 되돌릴 수 있게 한다.
      gate: "test:paneownership 전량 + R1·R2·R3·R5·R6. 특히 R3(한글 연속 입력)."
      reversible: true
    - id: "C-3 — 나머지 소비자 전환"
      detail: "ReadView · MindView · ErdDesignerMainView 를 Provider 소비자로 전환."
      gate: "각 뷰 전환 후 해당 뷰의 표시 회귀 0건. MindView 는 헤딩 링크가 살아 있는지 확인(A7 과 같은 축)."
      reversible: true
    - id: "C-4 — 전역 싱글턴 제거 + ownerTabId 소멸 ⚠️ 되돌리기 지점"
      detail: >
        useBlockStore 전역 싱글턴과 ownerTabId 가드를 제거한다. 폴백 경로도 함께 제거한다.
        **C-1~C-3 이 전부 green 인 뒤에만 착수한다.**
      gate: "T1 전량 + R1~R6 + 소스 트리에서 ownerTabId 검색 결과 0건."
      reversible: false
    - id: "C-5 — serialize()/hydrate() 계약 확정 및 문서화"
      detail: >
        탭 스토어의 직렬화 계약을 확정하고 문서에 남긴다.
        advanced_rendering_optimization.md Phase 2(TTL 언마운터)가 이 계약을 그대로 쓴다.
      gate: "계약이 문서화되고, Phase 2 가 참조할 수 있는 형태인지 확인."
      reversible: true
