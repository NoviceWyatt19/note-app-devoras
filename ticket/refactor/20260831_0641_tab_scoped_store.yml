constraints:
  - id: "스냅샷 인터페이스를 두 번 설계하지 말 것"
    detail: >
      advanced_rendering_optimization.md Phase 1(상태 스냅샷)과 **동일 지점**이다. 분리해서
      진행하면 인터페이스를 두 번 설계하게 된다. serialize()/hydrate() 를 Phase 2 TTL
      언마운터의 계약으로 확정할 것. 이 계약이 확정되면 그것이 곧 architecture_stages.md
      Stage 2 Thin Client 의 IPC 경계(getBlockTree(tabId), updateBlock(tabId, blockId, content)) 초안이 된다.
  - id: "IME 이중 가드를 잃지 말 것"
    detail: >
      Step 5 의 조정자가 isImeComposingRef + view.composing 이중 가드와 external 트랜잭션
      배제를 들고 있다. 상태 소스를 Context 로 바꾸는 과정에서 이 판정이 누락되면
      dd52e32·13a7f7e 가 막 닫은 한글 입력 붕괴가 되살아난다. test:ime 를 단계마다 돌릴 것.
  - id: "직렬화의 위치 의존성"
    detail: >
      블록의 직렬화 형태는 문서 내 위치에 따라 다르다 — 마지막 블록만 후행 개행을 갖지 않는다
      (join 순서 아티팩트, Step 4 에서 발견). serialize() 가 콘텐츠 해시나 동등 비교를 쓰면
      같은 함정을 밟는다. 정규화 없이 비교하지 말 것.
  - id: "커밋 규칙"
    detail: >
      단계 1건 = 커밋 1건. 코드 커밋은 패치 버전업(package.json · Cargo.toml · tauri.conf.json
      + Cargo.lock 동시). 문서만 바꾼 커밋은 버전을 올리지 않는다(.agents/AGENTS.md 버전업 예외).
  - id: "공유 워킹 트리"
    detail: "여러 세션이 같은 트리를 쓴다. git add -A 대신 경로를 명시해 스테이징하고, 커밋 직전 git status 로 확인할 것."
