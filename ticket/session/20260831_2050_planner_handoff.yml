verification_tiers:
  T1: "`pnpm test:t1` — 14종 하네스. 순수 로직만"
  T2: "`pnpm dev` + Chromium. `MockFileSystem` 폴백(`shared/api/fs.ts:403`)으로 앱이 그대로 구동"
  T2_critical_caveat: >
    **기능 검증에는 유효하지만 타이밍 측정에는 무효다.** 브라우저 페인이 백그라운드면
    `visibilityState: hidden` 이 되어 **rAF 가 아예 발화하지 않는다**(성장 지수가 내용과 무관하게
    1.65~1.85 로 수렴). 합성 키 이벤트·DOM 판독은 정상이므로 기능 검증은 유효하다.
    **타이밍을 재려면**: 사용자가 브라우저 페인을 표시 → `tabs_select` 로 대상 탭 활성화 →
    `visibilityState === 'visible'` 과 rAF 60fps 를 **먼저 확인한 뒤** 측정한다.
  T3: "`pnpm tauri:dev` — 실기. 사람 손 필요"
  measurement_discipline: "조건별 워밍업 1회 폐기 · 3회 반복 중앙값 · 조건 인터리브로 순서 효과 제거. 이걸 안 하면 N=25 편차가 지수를 통째로 왜곡한다"
