lessons_that_cost_time_to_learn:
  - "**처방을 측정보다 먼저 쓰지 말 것.** Step 6 은 계획서가 예상한 두 갈래 중 어느 쪽도 아니었고, 그 판정마저 §3-A-2 에서 뒤집혔다. 가설 → 판별 실험 → 판정 순서를 지킨다"
  - "**계획서에서 빠지는 것과 테스트가 없는 것은 같은 집합이다.** 7-C 의 C-3 대상 목록에서 FormatToolbar·WorkspacePage 가 빠졌는데, 둘 다 어떤 하네스도 덮지 않는 곳이었다. 목록을 세지 말고 **grep 으로 전수 확인**할 것"
  - "**불변식은 위치가 곧 사정거리다.** R3 는 캐럿 결함을 잡으라고 만들었는데 분기 하나 안쪽에 있어 타이핑 경로를 영원히 못 잡았다"
  - "**명령을 상태로 저장하면 반복 발화한다.** `focusOffset` 이 그랬다. `activeBlockId` 에 같은 형태가 있는지 점검할 가치가 있다"
  - "**탭이라고 해서 전부 문서를 소유하지는 않는다.** mindmap-global 은 탭 UI 를 빌린 뷰포트였다(D-6)"
  - "**되돌릴 수 없는 단계는 맨 뒤로.** 7-C 를 C-1~C-5 로 쪼개고 싱글턴 제거를 C-4 에 둔 것이 실패 시 전량 롤백을 막았다"
