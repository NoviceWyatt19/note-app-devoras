    - "**문서만 바꾼 커밋은 버전을 올리지 않는다** — AGENTS.md 「버전업 예외」"
    - "**공유 워킹 트리다.** `git commit` 은 인덱스 전체를 커밋하므로 경로 명시 스테이징만으로 부족하다. 커밋 직전 `git status --short` 확인, 또는 `git commit -F - -- <경로>` 사용. 실제 사고: f04abc0 이전의 f48b88c(캐럿 수정 코드가 로드맵 문서 커밋에 흡수됨, project/DEBUG_PLAN.md §5.1)"
