lessons_this_cycle:
  - id: "테스트가 검사하는 계층과 결함이 사는 계층이 다르면 **통과는 정보가 아니다**"
    detail: >
      `caret_stability_harness` 는 `decideCaretAction` 이 「**새 명령일 때만** 적용하는가」를 본다.
      F1 은 **새 명령이 낡은 값을 싣고 오는** 것이라, 조정자로서는 정확히 적용하는 것이 옳은 동작이다.
      하네스는 상류를 안 보므로 구조적으로 못 잡는다. **`code_review.md` §0 의 「심각한 결함 3건이
      전부 자동 테스트를 통과했다」에 대해 기전이 하나 특정됐다.**
  - id: "**파일 경로는 소유 레인을 식별하기에 충분하지 않다** — 같은 파일을 두 레인이 겨눈다"
    detail: >
      계획 세션이 `scope_note` 에서 `src-tauri/` 를 보고 R3 혼입이라 판정했다가 철회했고(`814b132`),
      PM 이 나흘 뒤 `BlockEditor.tsx` 에서 **똑같은 실수**를 하고 철회했다(`29b3b46`).
      **둘 다 diff 를 안 봤다.** 규칙이 규칙을 만든 사람에게도 걸린다.
  - id: "**답이 이미 문서에 있는데 코드·이름으로 재구성하려 한다**"
    detail: >
      PM 의 `erd.css` 중복 오판은 사양서 §4 「출처」 열에 답이 있었다. 계획 세션의
      `--text-on-accent` 첫 판단(「의미가 반대」)은 **사용처 한 줄**(`erd.css:60`)을 열면 바로 뒤집혔다.
      **값·이름으로 추론하기 전에 사용처를 연다.**
  - id: "**개수와 diff 는 증명의 종류가 다르다**"
    detail: >
      개수는 「얼마나 많이 안 고쳤나」의 **정황**, `git show --name-only` 0건은 「하나도 안 고쳤다」의
      **직접 증거**다. 규모 산정처럼 정황이 필요한 자리에서는 개수가 맞는 도구이나 **세는 방법을 같이 적어야 한다** —
      R5-a 범위가 9 → 17 → 14 로 세 번 바뀐 것이 그 예다.
