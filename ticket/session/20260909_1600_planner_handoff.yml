  - id: "**자진 철회가 안 되면 외부 지적이 두 번 필요하다**"
    detail: >
      이번 사이클의 오판은 대부분 **자진 철회로 닫혔다**(계획 세션 `scope_note`·`--text-on-accent`,
      PM ORDER_VIOLATION). 예외는 PM 의 `erd.css` 건인데, **Impl 레인이 두 번 정정했고 첫 번째가 흘려졌다.**
      자진 철회 경로가 막히면 비용이 두 배가 된다.
    ref: "`3157156` §recurring_pattern_final"
  - id: "**초점은 「볼 곳」을 정하는 것이지 「볼 곳의 전부」를 정하는 게 아니다** → R1-c 신설"
    detail: >
      S1 초점 3건 중 **앞의 둘(A7·2-패스)이 통과**했다. 그 둘만 보고 「통과」로 닫았어도
      초점 지시는 전부 이행한 셈이 된다 — F1 이 나온 건 세 번째 축이 마침 거기 있었기 때문이다.
      **판정 세션은 초점을 성실히 따를수록 초점 설계자의 누락을 그대로 물려받는다.**
      → **R1-c**: 초점을 전부 통과시킨 뒤에도 「이 초점이 이 변경의 위험을 다 덮는가」를 한 번 더 묻는다.
  - id: "**검사의 크기와 검사자의 독립성은 별개 축이다**"
    detail: >
      N1 은 PM 이 직접 닫았다(`b952927`·`3157156` §n1_closed_by_pm). 검사 자체는 정확했으나
      **검사자가 하나다.** 「한 번의 diff 로 닫히니 아까웠다」는 **크기** 근거이지 독립성 근거가 아니다 —
      **크기가 큰 판정에 같은 논리를 적용하면 안 된다.** 이 예외를 선례로 삼지 말 것.
