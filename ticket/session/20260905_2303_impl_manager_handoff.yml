three_corrections_to_sprint3:
  items:
    - id: "C1"
      where: "`implementation_plan.md` §3.12 step 3"
      problem: "「모든 컴포넌트의 하드코딩 hex 교체」가 실제 작업량을 감춘다 — 위 `understated_cost` 182곳"
      fix: "팔레트→토큰 매핑표 확정 + 파일 단위 Step (초안의 T3)"
    - id: "C2"
      where: "`implementation_plan.md` §3.12 step 2 — 「`erd.css` 의 `:root` 하드코딩 변수를 ThemeTokens 와 통합」"
      problem: >
        한 줄로 적혀 있으나 실제로는 **이름이 다른 두 변수 체계의 충돌**이다.
        `app/styles/erd.css:1-9` 가 Obsidian 계열 이름(`--background-primary` · `--background-secondary` ·
        `--background-modifier-border` · `--text-normal` · `--text-muted` · `--text-accent` ·
        `--background-modifier-error` · `--text-on-accent` · `--font-monospace`)을 쓰고,
        `.erd-*` 셀렉터가 **259줄에 걸쳐** 그 이름을 참조한다.
        Sprint 3 토큰명은 `--bg-primary` · `--text-primary` 계열로 **전부 다르다**
      fix: "**별칭 매핑 권장** — `--background-primary: var(--bg-primary)` 식으로 얹는다. erd.css 본문 무수정, 롤백 가능. 일괄 개명은 비용 대비 값이 없다"
    - id: "C3"
      where: "`entities/erd/lib/staticRenderer.ts`"
      problem: >
        hex 11개로 두 번째로 많아 「이관 대상」으로 보이지만, 전부 **ERD SVG 내보내기 산출물의
        고정 라이트 팔레트**다(`:26` `fill="#f8fafc"` · `:79` `#ffffff` · `:80-81` `#0f172a` ·
        `:92` `#101828` · `:93` `#667085` 등). 앱 테마를 따라가게 만들면
        **다크 테마 사용자가 내보낸 SVG 가 검은 배경으로 나온다**
      fix: "**스코프에서 명시적 제외.** 내보내기는 테마 무관하게 라이트 고정을 유지한다 — 사양에 박을 것"
