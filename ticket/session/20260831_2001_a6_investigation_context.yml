rules:
  - "**처방을 먼저 적지 말 것.** Step 6 은 계획서가 미리 적어둔 두 갈래 중 어느 쪽도 아니었다(세 번째 갈래였다). 가설 → 판별 실험 → 판정 순서를 지킨다."
  - "**§S.4 중재 계층(priority/claims)을 원인 특정 전에 설계하지 말 것.** 그것은 정확성·결합도 문제를 푸는 수단이고 비용 문제를 푼다는 보장이 없다. 우아한 체인을 만들고도 지수가 1.97 로 남을 수 있다."
  - "계측은 `import.meta.env.DEV` 가드, 실패는 console.error, 편집을 중단시키지 않는다(A5 규칙)."
  - "합성 리그를 새로 만들지 말 것 — 데코레이션·위젯을 싣지 않으면 비용을 과소평가한다. 기존 하네스를 확장한다."
  - "**판정 없이 다음 단계로 넘어가지 말 것.** 판정을 문서에 기록하는 것이 이 조사의 산출물이다."
