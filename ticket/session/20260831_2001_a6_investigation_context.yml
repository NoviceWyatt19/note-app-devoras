hypotheses:
  - id: "H1 — 이분 탐색의 귀속 오류 (**최우선**)"
    detail: >
      `codeBlockInteractionPlugin` 과 `CodeBlockDecorator` 는 **같은 모듈**(`impl/CodeBlockDecorator.ts`)에서
      나온다. 플러그인 본체는 생성자에서 DOM 리스너 하나를 다는 게 전부라(`:188-204`) 그 자체로
      초선형을 만들 수 없다. Step 6 의 "플러그인 제외" 조건이 실제로는 **위젯 `toDOM` 으로 DOM 을
      만드는 데코레이터까지** 제외했을 가능성이 있다.
    test: "플러그인만 제외 / 데코레이터만 제외를 **분리해** 각각 측정. 참이면 나머지 가설의 전제가 통째로 바뀐다."
  - id: "H2 — buildAll 이 selection 변경에도 재실행"
    detail: >
      `orchestrator.ts` 의 StateField update 가 `tr.docChanged || tr.selection` 에 재빌드한다.
      **캐럿 이동 한 번에 그 블록의 모든 데코레이터가 문서 전체를 다시 훑는다.**
      마운트 중 셀렉션 트랜잭션이 인스턴스 수에 비례해 발생하면 N² 형태가 된다.
      참고: `HeadingDecorator` 는 커서 인식형이라(커서가 그 줄에 있으면 마커를 숨기지 않는다)
      selection 재빌드가 실제로 결과를 바꾼다 — 최적화로 건너뛸 수 없는 구조다.
    test: "`buildAll` 에 호출 카운터 + 트리거별(docChanged/selection/ime) 소요시간 계측. N=25 와 N=200 에서 호출 횟수 비율이 선형인지 확인."
  - id: "H3 — 위젯 toDOM 의 DOM 생성 비용 누적"
    test: "코드블록 0개 문서 vs 코드블록 N개 문서를 같은 N 에서 비교."
  - id: "H4 — protectedRegions 를 각 데코레이터가 독립 호출"
    detail: "데코레이터 수 × 문서 길이. Open Q #5 의 N² 부채(문서 **길이** 축)와 같은 뿌리인지 미확인."
    test: "데코레이터 수를 1→13 으로 늘리며 **N 을 고정**하고 측정. 인스턴스 수 축과 데코레이터 수 축을 분리한다."
# ━━━
include_in_same_instrumentation:
  id: "R-2 (신규 코드 리뷰 발견) — updateBlockContent 가 키 입력마다 트리 전체를 재생성"
  location: "project/src/entities/document/model/tabStore.ts:108-116"
  detail: >
    `updateNode` 는 자식이 있는 블록을 **대상이 그 서브트리 안에 있든 없든** 무조건 새 객체로
    만든다(`{ ...block, children: updateNode(...) }`). `.map()` 도 항상 새 배열을 만든다.
    결과적으로 키 입력 한 번에 **자식을 가진 모든 블록(=모든 헤딩)의 정체성이 바뀌어**
    `BlockNode` 의 `React.memo` 가 무력화되고 헤딩 척추 전체가 리렌더된다.
  why_here: >
    축은 다르지만(입력당 비용 vs 인스턴스 수 축) **같은 컴포넌트 트리를 건드리고 N 이 커질수록
    함께 커진다.** 분리해서 재지 않으면 서로의 노이즈가 된다. 같은 계측에 포함할 것.
  reference: "code_review.md §3"
