  - "이것이 열려 있는 동안 implementation_plan 의 신규 Sprint 착수를 미루기로 했다 — 같은 계층의 소비자를 늘리면 나중 수정이 비싸진다."
  - "가상화(E7)의 조건이 '선형 회복 후 재평가'에서 **'데코레이터 계층 수정 후 재평가'** 로 바뀌었다."
# ━━━
step_zero_do_this_first:
  label: "§3-A-0 측정 간극 — H1 보다 먼저"
  problem: >
    두 측정이 같은 것을 재고 있지 않다. 원래 A6 관측은 N=200 에서 **7,024~17,423ms**("마운트 완료",
    React 포함)인데, Step 6 판별 실험은 **1,363ms**(EditorView+데코레이터, React 마운트 오버헤드를
    **의도적으로 배제**)다. 판별 실험이 재현하는 것은 원래 관측의 **약 8~19%** 뿐이고, 나머지
    80~92% 가 무엇인지 확인된 바 없다.
  consequence: >
    데코레이터 초선형(지수 1.97)을 완전히 없애도 **사용자가 겪는 지연은 대부분 남을 수 있다.**
    이걸 확인하지 않고 조치에 들어가면 고치고 나서 "여전히 느리다"를 만난다.
  todo:
    - "두 수치의 측정 범위를 일치시킨다 — 원래 관측의 '마운트 완료'가 정확히 무엇을 포함하는지 확인하고 같은 정의로 다시 잰다."
    - "일치시킨 뒤에도 간극이 남으면 **그 간극 자체를 별도 조사 축으로** 기록한다. 데코레이터 축과 섞지 말 것."
    - "간극이 측정 정의 차이로 설명되면 → 데코레이터 축이 본체가 맞다. H1 로 진행."
# ━━━
strongest_existing_clue:
  fact: >
    Step 6 이 이미 얻은 값 — 순수 CodeMirror 조건에서 **생성 즉시 파괴를 N 회 반복**(동시에
    살아있는 인스턴스를 늘리지 않음)하면 성장 지수가 **1.017**(사실상 완벽한 선형)이다.
  reading: >
    초선형이 **생성 횟수가 아니라 동시 생존 인스턴스 수**에 걸려 있다는 강한 단서다.
    살아남는 가설은 이 성질을 설명할 수 있어야 한다.
  action: "**데코레이터를 켠 조건에서 같은 create-destroy 변형을 돌려볼 것.** 하네스에 순수 버전이 이미 있어 비용이 싸고, 현재 가능한 가장 강한 판별 실험이다."
