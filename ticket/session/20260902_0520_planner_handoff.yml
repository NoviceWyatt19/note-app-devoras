  - "**판정의 근거와 판정을 분리해서 읽을 것.** §0.1 은 '생성 비용의 무죄'를 '설계의 무죄'로 확대했다. 같은 형태의 오류가 다른 게이트에도 있을 수 있다"
  - "**소스 주석이 전제를 밝혀 둔 곳을 찾을 것.** `orchestrator.ts:29` 의 한 줄이 단일 CM 안건의 최대 블로커를 드러냈다 — 제안 문서는 그 파일을 읽지 않았다"
  - "**계획서에서 빠지는 것과 테스트가 없는 것은 같은 집합이다.** 목록을 세지 말고 grep 으로 전수 확인할 것"
  - "**불변식은 위치가 곧 사정거리다** · **명령을 상태로 저장하면 반복 발화한다** · **되돌릴 수 없는 단계는 맨 뒤로**"
