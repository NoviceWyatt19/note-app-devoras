the_core_finding:
  headline: "**§0.1 아키텍처 게이트의 근거가 무효였다. 게이트를 다시 열었다.**"
  detail: >
    §0.1 은 "순수 CodeMirror 코어는 선형이고 38배 싸다 → 블록당 인스턴스 설계는 무죄"로 닫혀 있었다.
    그런데 §3-A-2 가 귀속을 뒤집었다 — 그 "선형" 관측은 **동시 생존 수를 늘리지 않은 조건**
    (생성 즉시 파괴)에서 나온 것이었다. 누적 조건은 지수 1.763(N=100, 737ms), 즉시파괴는
    0.938(92ms). **"생성 행위는 싸다"는 참이지만 "N개를 동시에 살려 두는 설계는 무죄"는 거짓이다.**
  third_record: >
    **문서 정리 중 세 번째 기각 기록을 발견했다** — `architecture_stages.md:56` (2026-08-27),
    "Option A(문서 전체 단일 CM)를 택하지 않은 이유: 중첩 라운드 카드를 평면 라인 목록으로는
    표현할 수 없다". **측정된 적이 없는 단언이다.** 이 프로젝트가 §3-C 에 스스로 적어둔 규칙
    ("처방을 측정보다 먼저 쓰지 말 것")을 어긴 사례이며, **SPIKE-20260902-A 가 그 부채를 갚는다.**
  two_blockers_found:
    - >
      **오케스트레이터가 문서 전체를 훑는다** (`orchestrator.ts:27-46`, `:331`). `buildAll` 이
      `0~doc.length` 를 12개 데코레이터로 스캔하고 **`docChanged` 뿐 아니라 `tr.selection` 에서도**
      전량 재실행된다. 소스 주석이 스스로 전제를 밝혀 뒀다 — *"Devoras splits blocks into separate
      CodeMirror instances, doc.length is small enough"*. **단일 CM 이 그 전제를 직접 파괴한다.**
      구조적 어려움: 뷰포트 빌드는 `ViewPlugin` 을 요구하는데 다중 라인 `Decoration.replace` 는
      `StateField` 를 요구하고(`LatexDecorator.ts:161-172` KaTeX 펜스), 데코레이터가 커서를 읽으므로
      (`:164` `cursorInside`) 셀렉션 재빌드를 끌 수도 없다. → **SPIKE-20260902-B**
    - >
      **중첩 카드가 실제 중첩 DOM 이다** (`BlockEditor.tsx:398-459` 재귀 `BlockNode`).
      `Decoration.line()` 은 평면 형제 `.cm-line` 을 만든다. → **SPIKE-20260902-A**
