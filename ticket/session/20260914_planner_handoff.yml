  status: "**미처분. PM 판단 필요.**"
  how_found: "`ticket/project/20260904_1800_release_lane_hold.yml` 전수 검색 — `U1`/`U2`/`U3` 항목 없음. D22 는 F1~F4 와 S1형 위험만 다룬다"
  why_it_matters: >
    **이것이 R1-c 가 막으려던 형태가 한 층 위에서 재현된 것이다.**
    R1-c 는 「판정 세션이 초점만 보고 닫는 것」을 막는 규칙인데, 여기서는
    **처분 단계가 초점 4건만 보고 닫았다.** 초점 밖 산출물은 처분표에 자리가 없었다.
    → **판정에 R1-c 가 있으면 처분에도 그에 대응하는 자리가 필요하다.** 규칙 보완 후보.
  items:
    U2:
      severity: "🔴 **셋 중 유일하게 새로운 손상 가능성.** 가장 먼저 판단할 것"
      what: "`saveFile` 이 매번 `readSpatialMetadata` → 병합 → `writeSpatialMetadata` 를 **무조건** 수행한다(`store.ts:648-650`). 좌표가 안 바뀌어도 돈다"
      amplified_by_r2: >
        기본값 `high` 면 **편집 중 ~1.5초마다** 워크스페이스 **전체** 메타데이터 읽기+쓰기가 일어난다.
        R2 전에는 사용자가 저장할 때만이었다 — **R2 가 만든 코드는 아니나 노출 빈도를 사용자 손에서 빼앗아 자동화했다.**
      risk: "`spatial.json` 하나에 **전 파일의 좌표**가 들어 있다. 쓰기 도중 앱이 죽으면 **한 문서 편집 때문에 워크스페이스 전체 좌표**가 날아갈 수 있다. 실패는 `console.warn('...ignoring')` 으로 삼켜진다"
    U1:
      severity: "🟠 표시 결함 (기존 결함을 R2 가 상시화)"
      what: >
        `tabId = file.path`(`store.ts:172`)라 같은 파일을 두 패널에 열면 **같은 tabId 가 두 패널에** 있다.
        `saveFile` 은 `targetPaneId` 패널만 갱신하고(`store.ts:668-678`), `scheduleAutosave` 는
        **첫 번째로 발견된 패널** id 로 예약한다(`store.ts:582-588` 의 `break`).
      consequence: "패널 B 에서 편집해도 dirty 가 꺼지는 건 패널 A 뿐 — **편집 중인 패널의 점이 안 꺼지고**, 이미 저장된 탭에 **거짓 확인창**이 뜬다"
    U3:
      severity: "🟡 관측성"
      what: "지속성 기능의 실패가 세 겹 다 조용하다(spatial `warn...ignoring` · `saveFile` `error` · 자동 저장 `.catch`). UI 신호는 「dirty 점이 안 꺼진다」뿐인데 사용자는 자동 저장을 믿으므로 볼 이유가 없다"
      relation: "`code_review.md` **I-2**(`settings/store.ts:79` 빈 catch)와 같은 계열. 지속성 기능이라 비용이 더 크다"
