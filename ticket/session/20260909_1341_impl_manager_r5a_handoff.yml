process_lesson:
  id: "R9 — 착수 승인 후에는 사양을 바꾸지 않는다"
  what_happened: >
    **T1d 가 폐기된 26개 안으로 착지했다.** 착수 승인을 보낸 직후 ΔE 재판정으로 사양을 바꿨고
    메시지가 몇 분 차이로 엇갈렸다. **실행 세션 잘못이 아니라 계획 측 잘못이다.**
  rule: "바꿔야 하면 **다음 단계로 미룬다**(이번엔 T1d-2 가 그 역할을 했다). 정정을 보낼 때는 「지금 멈추고 반영」인지 「다음 단계에 반영」인지 **명시한다**"
  why_it_did_not_get_worse: "**실행 세션이 `git log` 를 보고 스스로 멈췄다.** 지시 체계가 어긋났을 때 남은 방어선은 실행자가 자기 입력을 의심하는 것뿐이었다"
