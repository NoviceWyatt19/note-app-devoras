key_decisions_do_not_relitigate:
  items:
    - id: "토큰 36개 — 개수가 아니라 ΔE 로 정했다"
      detail: >
        32(전수 추출) → 26(명도대비 기준 통합) → **35(ΔE 재판정, 통합 절반 철회)** → 36(accent-deep 부활).
        **명도대비(WCAG)는 색 근접성 척도가 아니다** — 텍스트 가독성 지표이고 어두운 색끼리는 1.0x 로 뭉개진다.
        `surface-4+5` 는 대비 1.05:1 인데 **ΔE 4.71** 이었다. 병합은 **ΔE < 2.3(JND)** 인 2쌍만 했다
    - id: "척도는 용도별로 갈라 쓴다"
      detail: "**색이 같은가 → ΔE(CIE76). 텍스트가 읽히는가 → WCAG 명도대비.** 하나로 통일하지 않는다"
    - id: "대비는 **실제 배경** 위에서 잰다"
      detail: >
        인라인 코드·하이라이트는 배경도 함께 밝아진다. `surface-base` 기준으로만 재면 2.94·2.98 로
        「경계」처럼 보이지만 **실제 배경(12%·18% 틴트) 위에서는 2.49·2.46 으로 명백한 실패**다.
        이 실수를 두 번 했다(§4.9 의 `--warning` 도 흰 바탕 3.19 만 보고 통과시켰다가 패널 위 2.91 로 재정정)
    - id: "레거시 이름이 정본이다"
      detail: >
        같은 토큰에 새 Tailwind 키를 덧붙이지 않는다. `colors` 는 JS 객체라 키가 하나뿐이고,
        중복하면 **나중에 쓴 쪽이 조용히 이긴다**. indigo 강조의 이름은 `primary`(87곳)이고
        `accent` 는 **teal** 이다 — 헷갈리기 쉬운 지점
    - id: "라이트에서 사다리 방향이 뒤집힌다"
      detail: >
        다크는 밝을수록 약함(accent→soft→subtle, node hue 400 > tint 500),
        라이트는 **어두울수록 약함**(indigo 600→700→800, node hue 800 < tint 600).
        하나만 고치면 값이 겹치므로 **세 개를 함께** 옮겨야 한다
