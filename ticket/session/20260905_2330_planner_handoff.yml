    `git commit --amend --only -F -` 로 되돌릴 수 있으나 **권한 정책에 막혔고 사용자에게 올렸다.**
    **주의: 그 위에 새 커밋이 쌓이면 amend 로는 못 고친다** — 그때는 복구를 포기하고 기록으로 남긴다.
    계획 세션 권고는 **복구를 시도하지 않는 것**이다(같은 레이스가 재발할 수 있다).
