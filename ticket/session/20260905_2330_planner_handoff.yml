new_rule_proposed:
  rule: "**공유 워킹 트리에서 `git commit --amend` · `rebase` 금지.**"
  why: >
    이 세션은 내내 다른 세션에 「경로 지정 커밋」을 요구해 왔는데, **`--amend` 는 경로 지정으로
    보호되지 않는 연산**이다. `git commit -- <경로>` 는 남의 변경을 안 쓸어담지만 `--amend` 는
    **HEAD 자체를 갈아치우므로** 그 보호가 통하지 않는다. 「HEAD 가 내 것인지 먼저 확인」도
    **레이스를 못 막는다** — 확인과 실행 사이가 원자적이지 않다.
  instead: "메시지 오타는 고치지 말고 **후속 커밋 메시지에 정정을 적는다.** 지저분한 히스토리가 남의 커밋을 덮어쓰는 것보다 훨씬 싸다"
  where: "`.agents/AGENTS.md` §2 「공유 워킹 트리에서의 커밋」에 추가 제안"
