# ━━━
why_now: >
  `DEBUG_STEP_PLAN.md` §0.1 은 "블록당 CodeMirror 설계는 무죄 — 이 결정은 재개봉되지 않는다"로
  닫혀 있다. 그 근거는 Step 6 의 "순수 CodeMirror 코어는 선형이고 38배 싸다"였다.
  **§3-A-2(2026-08-31)가 이 귀속을 뒤집었다** — 데코레이터가 하나도 없는 베어 조건도 **누적**
  마운트 시 지수 1.763(N=100, 737ms)이고, **생성 횟수는 같고 누적만 없앤** 조건은 0.938(92ms)이다.
  즉 "생성 행위는 싸다"는 참이지만 "**동시에 N개 살려 두는 설계**는 무죄"는 거짓이다.
  게이트의 근거가 소멸했으므로 게이트도 무효다.
