decisions_made:
  date: "2026-09-02"
  - id: "D-1"
    q: "§0.1 게이트를 다시 여는가"
    decision: "**(a) 연다** — 단일 CM 을 E7 의 경쟁 안건으로 정식 개봉"
    applied: "DEBUG_STEP_PLAN.md §0.1 에 재개봉 블록 삽입, 원 판정은 <details> 로 보존"
  - id: "D-2"
    q: "스파이크를 먼저 재는가 / 순서"
    decision: "**(a) 잰다. 순서는 A → B.**"
    rationale: >
      A 가 실패하면 B 를 잰 비용이 통째로 버려진다. A 는 CSS·데코레이션 실험이라 B(오케스트레이터
      재설계)보다 싸고 판정이 육안으로 즉시 난다. **비싼 쪽을 뒤에 둔다.**
      A 가 2026-08-27 Option A 기각 사유를 정면으로 재는 실험이기도 하다.
    applied: "SPIKE-20260902-A (Todo) · SPIKE-20260902-B (Blocked, A 대기)"
  - id: "D-3"
    q: "R-1 (@testing-library/react + jsdom)"
    decision: "**(a) 단일 CM 결정 이전에 도입** — 게이트 0"
    rationale: "React 계층 테스트 인프라 자체는 단일 CM 과 독립이다. 어느 경로든 구조 변경이 크므로 회귀망을 먼저 세운다"
    caveat: >
      **인프라는 독립이지만 테스트 대상은 아니다.** 블록 경계 동작(포커스 이동·병합) 테스트는
      단일 CM 채택 시 소멸한다. 따라서 티켓은 first_targets 를 **어느 경로에서도 살아남는 표면**
      (저장/dirty · viewMode 토글 · 탭·패널 전환 · FileExplorer)으로 한정하고, 블록 경계 테스트는
      게이트 판정 후로 미룬다.
    applied: "REF-20260902-01"
