verified_facts:
  proposal_is_right_about:
    - "겨눈 축이 정확하다 — 단일 CM 은 동시 생존 EditorView 수를 N→1 로 **구조적으로 고정**한다"
    - "높이 맵 관리를 CodeMirror 라이브러리가 진다 — E7 의 필수 동반 항목인 **높이 캐시를 우리가 구현하지 않아도 된다**(BUG-20260828-01 재생산 위험 회피)"
    - "MindView 는 blocks 에 의존하지 않는다 — 코드로 확인"
  proposal_is_wrong_about:
    - >
      **메모리 전제가 틀렸다.** 문서는 "인스턴스당 ~600KB · 문서당 18MB · 90% 절감"을 근거로 든다.
      실측은 `ARCHITECTURE_FINDINGS.md:205` — **블록당 42~98KB, 예산(150KB) 이내**. 6~14배 과장이며,
      **메모리는 이 프로젝트에서 한 번도 실패한 예산이 아니다.** 실패한 것은 오직 시간
      (N=200 에서 7,024~17,423ms vs 예산 300ms). 제목·§1·§8 프레이밍은 정정 대상.
    - >
      **"기존 12개 데코레이터 전부 재사용(그대로 동작)"이 코드와 어긋난다.** `orchestrator.ts:27-46`
      의 `buildAll` 은 문서 전체(`0 ~ doc.length`)를 12개 데코레이터로 훑고, `:331` 에서
      **`docChanged` 뿐 아니라 `tr.selection` 에서도 전량 재실행**된다. 소스 주석이 스스로
      *"Devoras splits blocks into separate CodeMirror instances, doc.length is small enough"* 라고
      전제를 밝혀 두었다 — **단일 CM 이 그 전제를 직접 파괴한다.**
    - >
      **제거 목록이 과장됐다.** ReadView 의 블록 드래그 재정렬이 `flattenTree` ·
      `resolveBlocksFromContent` · 2-패스 매칭을 계속 쓴다(`ReadView.tsx:302,345,352,358`).
      "제거"가 아니라 "쓰기 경로에서 소비자 소멸, ReadView 전용으로 축소"가 정확하다.
      Step 4(A7)의 성과물은 전부 살아남는다.
  proposal_omits:
    - >
      **중첩 카드가 실제 중첩 DOM 이다.** `BlockEditor.tsx:398-459` 의 `BlockNode` 는 재귀이고
      L2(`p-5 rounded-2xl`) 안에 L3(`p-4 rounded-xl`)가 들어앉는다. `Decoration.line()` 이 만드는
      것은 평면 형제 `.cm-line` 이다. 문서가 선례로 든 `CodeBlockDecorator` 는 **중첩 없는 단일
      레벨**이므로 이 패턴을 증명하지 않는다. 문서 §7 의 "위험 중간 / 이미 증명됨"은 근거가 약하다.
    - >
      **CM6 구조 제약.** 뷰포트 한정 빌드는 `ViewPlugin`(`view.visibleRanges`)을 요구하는데,
      다중 라인 `Decoration.replace` 는 `StateField` 를 요구한다. 현행이 `StateField` 인 이유가
      정확히 그것이고(`orchestrator.ts:317` 주석), 그 다중 라인 replace 는 **실재한다**
      (`LatexDecorator.ts:161-172`, KaTeX 블록 펜스가 여는 펜스~닫는 펜스를 replace).
      게다가 데코레이터들이 **커서 위치를 읽으므로**(`LatexDecorator.ts:164` `cursorInside` —
      마크업 노출/은닉 UX 의 본질) 셀렉션 재빌드를 그냥 끌 수도 없다.
      → 선행 작업은 "뷰포트로 감싸기"가 아니라 **오케스트레이터 2계층 분리 또는 증분화**라는 설계 과제다.
    - "T1 하네스 13종 중 최소 5종(blockkey·caretstability·tabstore·diff·vertical_motion)이 현행 아키텍처 불변식을 인코딩한다 — 재작성 대상"
    - "IME 3중 래치(ImeLatchPlugin·ImeIsolation·useImeInputManager)는 블록당 뷰 전제로 조립됐다. 문서는 '그대로 사용'이라 적었으나 검증된 바 없고 BUG-20260828-05 가 열려 있다"
    - "R-1(React 테스팅 라이브러리 부재)이 미해결인 시점 — 회귀망이 가장 약할 때 최대 구조 변경을 하는 형태가 된다"
