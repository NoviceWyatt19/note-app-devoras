what_changed_the_frame:
  new_document: "single_cm_transition.md (구 project/MEMORY_OPTIMIZATION.md — D-5 로 승격·정정됨)"
  proposal: "문서 1개 = CodeMirror 1개. 블록 카드는 Decoration.line 으로 시각화만. rawContent 가 유일한 진실"
  distinct_from_0_1: >
    **§0.1 이 기각한 안건이 아니다.** §0.1 이 검토한 것은 "Notion 형태" = **블록 트리를 진실로**
    삼는 구조였고, 그래서 "마크다운이 디스크의 진실"이라는 전제를 깬다는 반박이 성립했다.
    이 제안은 정반대로 **rawContent 를 유일한 진실**로 삼으므로 그 전제를 **더 충실히** 만족한다.
    MindView 가 `blocks` 를 전혀 참조하지 않고 `parseMarkdown(rawContent)` 만 쓴다는 사실이 뒷받침한다.
    **§0.1 을 근거로 이 안건을 다시 닫으면 안 된다 — 다른 안건이다.**
  third_rejection_record_found:
    note: "**2026-09-02 문서 정리 중 발견.** 앞선 분석에도 없던 기록이다"
    where: "architecture_stages.md:56 (2026-08-27)"
    quote: >
      | **Option A(문서 전체 단일 CM) 를 택하지 않은 이유** | H2/H3 를 중첩 라운드 카드로 렌더하는
      현재 시각 디자인을 **평면 라인 목록으로는 표현할 수 없다** |
    significance: >
      즉 이 구조는 **두 번 기각됐다** — 2026-08-27 Option A, 2026-08-30 §0.1. 그러나 두 근거의
      성격이 다르다: §0.1 은 **측정에 기반했으나 그 측정이 무효화**됐고, Option A 는 **애초에
      측정된 적이 없는 단언**이다. 이 프로젝트의 규칙("처방을 측정보다 먼저 쓰지 말 것")을 어긴
      사례이며, **SPIKE-20260902-A 가 그 부채를 갚는다.**
      단언이 맞는 것으로 나오면 그것도 유효한 결과다 — 안건이 근거를 갖고 종결된다.
