if_single_cm_is_adopted:
  note: "**확정 순서다** (D-2·D-3 반영). single_cm_transition.md §6 에 같은 내용이 게이트 다이어그램으로 있다"
  - "0. **게이트 0 — R-1** (`REF-20260902-01`). 착수 승인됨"
  - >
    1. **스파이크 A — 중첩 카드 시각 재현.** 라인 데코레이션만으로 L2 안의 L3 카드와 관통 테두리가
    나오는가. 판정: 현행 스크린샷과 육안 동등. **실패하면 안건 전체가 무너지므로 가장 먼저 한다**
  - >
    2. **스파이크 B — 오케스트레이터 증분화 설계.** StateField(다중 라인 replace) / ViewPlugin(뷰포트)
    분리 또는 증분 패치. 판정: N=200 문서에서 키 입력 1회·화살표 1회의 데코레이션 재빌드 비용이
    N 에 비례하지 않을 것
  - "3. 그 다음에야 MEMORY_OPTIMIZATION §6 Step 1 프로토타입"
  fallback: >
    A 가 실패하면 **B 는 취소**되고 E7 로 복귀한다(두 스파이크는 독립이 아니라 A→B 직렬이다 — D-2).
    B 가 실패해도 E7 로 복귀한다. 어느 쪽이든 그 판정을 architecture_stages.md:56 과
    single_cm_transition.md §0.1 양쪽에 기록한다.
  reusable_pattern: >
    7-C 를 C-1~C-5 로 쪼개 싱글턴 제거를 C-4 에 둔 것(되돌릴 수 없는 단계를 맨 뒤로)이 그대로
    재사용 가능하다 — 단일 CM 은 `viewMode === 'write'` 분기 교체로 시작하므로 읽기 모드와
    기존 쓰기 경로를 남긴 채 병행할 수 있다
