    q: "R-6 를 독립 배치로 하는가, Sprint 3 에 묶는가"
    decision: "**(b) Sprint 3(YAML 테마)에 병합**"
    applied: "implementation_plan.md Sprint 3 에 편입 블록 삽입 · BUG-20260831-02 티켓에 merged_into_sprint3 추가 · function_roadmap Phase 3.5 표기"
