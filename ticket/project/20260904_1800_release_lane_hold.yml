    다만 나중에 **「T1a 도 통과했는데 왜」가 나오면 그 통과가 덮은 범위가 T1a 까지였다**는 것을
    여기서 확인할 수 있게 남긴다.
  note: "계획 세션이 「막자는 게 아니다」로 명시하고 정보로만 올렸다 — R0 귀속·R5 에스컬레이션 규칙을 지킨 형태다"
