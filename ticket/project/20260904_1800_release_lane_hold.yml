D21_r6_closed:
  update: "2026-09-09 — **R-6(`BUG-20260831-02`) 종결 판정. D-4 「같은 물건이다」는 옳았다**"
  question: "사용자 결정 D-4 가 R-6 을 Sprint 3 에 병합한 근거 — 「`createEditorTheme()` 상수화와 CSS 변수 토큰 시스템이 같은 물건이다」 — 가 맞았는가"
  original_defect:
    subject: "「`createEditorTheme()` 이 `EditorView` 마다 새 `StyleModule` 을 만들고 파괴 시 회수되지 않는다」"
    measured_then: "인스턴스당 `<style>` **+525자, 단조 증가**. 누적 360 create-destroy 사이클까지 증가 확인"
    note: "**결함의 정의는 누수다.** 아래 M4 가 대조하는 「마운트 50% 증가」는 A6 판별 측정에서 나온 **부수 관측**이지 결함 정의가 아니다"
  measurements:
    M1: "블록 10→100개 `styleBytes` 증가 — OLD **+26,240 bytes** → NEW **+0**"
    M2: "create-destroy 20회 — OLD 114,094 → 139,079(**+24,985, 단조 증가**) → NEW **20회 전부 139,079 고정**"
    M3: "폰트 실시간 반영 — `reconfigure()` **호출 없이** `.cm-scroller` 실측 `fontSize` 16px→24px 즉시 반영"
    M4: "마운트 N=100(참고) — 114~126ms → **87~89ms (−28~30%)**"
    contamination_note: >
      **M4 에 오염이 있었다.** 같은 페이지에서 OLD→NEW 를 연속 실행하면 OLD 가 남긴 `<style>` 이
      NEW 를 오염시켜 **처음엔 결과가 반대로 나왔다.** 실행 세션이 알아채고 페이지를 분리해 재측정했다.
      **누수를 고치는 실험이 누수 때문에 오염된 형태** — 위 수치는 재측정분이다
  verdict: "✅ **R-6 종결. D-4 판정은 옳았다**"
  reasoning:
    - "**결함(누수)은 M1·M2 로 완전 소멸했다.** +26,240 → **+0**, 단조 증가 → **고정**. 「인스턴스당 +525자」가 0 이 됐다"
    - "**M3 이 부수 예측까지 확인했다** — `BlockEditor.tsx:144` 의 `reconfigure` 경로가 함께 소멸한다는 D-4 의 예측이 맞았다. 설정 변경이 `reconfigure` 없이 CSS 변수로 흐른다"
    - "**즉 「같은 물건이다」가 참이었다.** CSS 변수 토큰 시스템이 `createEditorTheme()` 를 상수화했고, 그것이 곧 R-6 의 근본 처방이었다. 별건으로 지었으면 같은 것을 두 번 지었을 것이다"
  m4_caveat:
    fact: "원 티켓의 「테마 조건 마운트 약 50% 증가(N=100 에서 614→903ms)」에 대해 M4 는 **−28~30%** 다"
    judgment: >
      **이것으로 R-6 판정이 흔들리지 않는다.** ① 「50% 증가」는 결함 정의가 아니라 부수 관측이다.
      ② **원 측정(614→903ms)과 이번 측정(114~126ms)은 절대치 자릿수가 다르다** — 환경이 다르므로
      **비율만 비교 가능**하고, 「28~30%가 50%의 얼마를 상쇄했는가」는 답할 수 없는 질문이다.
      ③ 마운트 비용은 이미 §5.11 에서 **예산 대비 27배 여유**로 실측 통과했다 — 추적 대상이 아니다
    disposition: "**추가 조사 없음.** M4 는 개선으로 기록만 한다"
  release_impact: "**R-6 이 출시 스코프에서 닫혔다.** 별건으로 남지 않는다"
