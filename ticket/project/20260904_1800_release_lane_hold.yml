r1_closeout:
  update: "2026-09-05 — PM 판정. 실행 `aff36f5`(v0.9.2) · 교차검증 `828b2a0`(BUG-20260905-01)"
  verdict: "✅ **R1 통과. P0 해제.** 「읽기 실패가 쓰기로 이어지는 경로」가 끊겼다"
  pm_verified:
    - "실패 경로에서 `setRawContent`/`updateContentForTab` 제거, `setParseError(rawContent)` 로 원본 보존 후 에러 UI 만 렌더 — diff 직접 확인"
    - "죽은 코드였던 중간 재시도(같은 문자열로 `parseErdDocument` 재호출) 제거로 3단 폴백 자체가 소멸"
    - "버전업 4파일 동시(`package.json`·`Cargo.toml`·`Cargo.lock`·`tauri.conf.json`) v0.9.1 → **v0.9.2** — 규약 준수 확인"
    - "T1.5 하네스 신규(`test:erdparsefailure`) `test:t15` 편입 확인"
  D11:
    q: "교차검증 `scope_note` — src-tauri 3파일이 R1 과 무관한 R3 이므로 분리 커밋해야 하는가"
    a: "**기각.** 실행 세션이 옳고 교차검증이 틀렸다"
    grounds: >
      `.agents/AGENTS.md` §2 「업데이트 대상 파일」이 `project/package.json` ·
      `project/src-tauri/Cargo.toml` · `project/src-tauri/tauri.conf.json` 을 **명시하고**,
      「모든 커밋을 수행하기 전에」 버전을 올리라고 규정한다. 즉 **코드 커밋과 같은 커밋에 들어가는 것이
      규약이 요구하는 형태**다. 분리하면 규약 위반이고 「4파일 동시」가 깨진다.
    misread: "**`src-tauri/` 경로를 R3(출시 엔지니어링)로 읽은 것이 오류다.** R3 는 서명·CI·Releases 파이프라인이지 버전 번호가 아니다"
    why_recorded: >
      기각만 하고 넘기면 다음 교차검증이 같은 지적을 반복하고, 실행 세션이 그걸 받아 **버전업을 코드에서
      분리하기 시작하면 규약이 조용히 무너진다.** 판정을 남긴다.
  D12:
    q: "잔여 2 — 빈 입력 분기가 여전히 쓰기를 한다. 두 방어선이 모두 못 잡는다. 어느 쪽을 고치는가"
    finding: >
      교차검증이 정확히 짚었다. 빈 입력 시 쓰이는 값은 **유효한 ERD 스켈레톤 JSON** 이라
      「비었거나 파싱 실패 산출물이면 건너뛴다」(`FEAT-20260904-01` 안전장치)에 걸리지 않고,
      R1 은 파싱 실패만 다루므로 여기도 안 걸린다. **두 방어선 사이로 빠져나간다**
    a: "**R1 쪽을 고친다 — 빈 입력 시 쓰기를 미룬다.** 사용자가 실제로 편집할 때 쓴다"
    rejected: "`FEAT-20260904-01` 에 「빈 스켈레톤이면 건너뛴다」 조건 추가"
    rationale:
      - "**불변식을 구조로 세운다.** 「열기만으로 디스크에 쓰지 않는다」가 이 티켓 전체의 불변식인데, 빈 입력 분기는 그 불변식의 **마지막 예외**다. 없애면 이 컴포넌트에서 「상태 → 쓰기」 경로가 **0 이 된다** — 특례를 추가하는 것보다 강하다"
      - "**내용 모양 검사는 드리프트한다.** 「빈 스켈레톤」 판정은 ERD 스키마가 바뀌면 조용히 무력해진다. 경로를 없애면 스키마와 무관해진다"
      - "**부수 이득**: 지금은 빈 `.erd` 를 열기만 해도 탭이 dirty 가 된다 — 사용자가 하지 않은 변경이 dirty 로 표시되는 것 자체가 결함이다. 이 수정이 그것도 함께 없앤다"
      - "렌더에는 지장이 없다 — `createEmptyErdDocument()` 를 **로컬 상태로만** 두면 캔버스는 그대로 그려진다. 쓰기만 미룬다"
  D13:
    q: "잔여 1 — `WorkspacePage.tsx:369` `initialContent` 가 `savedContent` 를 무시한다(도달 경로 미확정)"
    a: "**고친다.** 단, **결함 확정이 아니라 방어 배선**으로 기록한다"
    fix: "`initialContent={activeTab.cache?.rawContent ?? activeTab.savedContent ?? ''}`"
    rationale: >
      교차검증이 도달 경로를 못 찾았고 **결함으로 확정하지 않은 판단이 옳다**(모르는 것을 결함으로 적지 않는다).
      그럼에도 고치는 이유는 **막지 못한 비용이 파일 소실이고 막는 비용이 한 줄**이며,
      `savedContent` 라는 정확한 폴백이 **이미 그 자리에 있는데 안 쓰이고 있기** 때문이다 —
      방어를 새로 짓는 게 아니라 있는 것을 연결한다.
    record: "커밋 메시지에 **「도달 경로 미확인 — 방어적 배선」**을 명시할 것. 나중에 이것이 실제 버그 수정으로 오독되면 도달 경로가 있었다는 잘못된 기록이 된다"
  D14:
