decisions_resolved_2:
  update: "2026-09-04 19:10 (사용자 결정 3건 + 운영 지시)"
  D5:
    q: "Apple Developer 계정 보유 여부 (서명 경로)"
    a: "**확인 불가 → 당장 보류.**"
    effect: >
      `REL-20260904-01` E3 는 **(a) 무서명(ad-hoc) 확정**. README 에 첫 실행 안내(우클릭→열기)를 넣는다.
      **E6(자체 Homebrew tap)도 함께 보류** — cask 는 기본적으로 격리 속성을 붙이므로 무서명 상태로
      등록하면 사용자가 `--no-quarantine` 을 써야 한다. 개인 배포로 먼저 검증하고,
      계정 확인이 되면 그때 E3(b)+E6 를 함께 판단한다.
    not_blocked: "E1(Releases)·E2(CI)·E4(번들 검증)·E5(버전 정책)는 서명과 무관하다 — **그대로 진행한다**"
  D6:
    q: "자동 저장 기본값"
    a: "**`high` 기본.**"
    consequence_critical: >
      **`BUG-20260902-01` 이 선행 권고에서 하드 게이트로 승격된다.** 기본값이 `high`(짧은 지연)이면
      손상된 `.erd` 를 여는 것만으로 **사용자 조작 없이 원본이 디스크에서 사라진다.**
      그 티켓이 P1 로 계산된 근거(「자동 저장이 없어서 Cmd+S 를 눌러야 성립」)가 완전히 소멸한다 → **P0.**
      `FEAT-20260904-01` 은 **R1 이 착지·검증된 뒤에만 머지한다.**
    added_requirement: >
      R1 과 별개로 **자동 저장 자체에 안전장치를 넣는다**(방어 심층화):
      직전 내용이 비어 있지 않은데 새 내용이 비었거나 파싱 실패 산출물이면 **자동 저장을 건너뛴다.**
      ERD 뿐 아니라 앞으로 생길 모든 「읽기 실패 → 쓰기」 경로를 한 겹 막는다.
  D7:
    q: "버전 정책 — 0.9.x 완료를 1.0 으로 볼 것인가"
    a: "**0.9.x 유지. 기존 버전 규약(`.agents/AGENTS.md` §2)을 그대로 지킨다.**"
    rules_restated:
      - "코드 커밋 = 패치 버전업, **4파일 동시**(`package.json` · `Cargo.toml` · `tauri.conf.json` · `Cargo.lock`)"
      - "문서 전용 커밋은 **버전을 올리지 않는다** — 괄호 안에는 유지된 현재 버전을 그대로 적는다"
      - "코드가 **한 줄이라도 섞이면** 문서 전용 예외가 아니다"
      - "1.0 승격은 사용자 직접 명령 사항. **이번 스코프에서 판단하지 않는다**"
    effect: "`REL-20260904-01` E5 를 「규약 유지, 1.0 판단 보류」로 닫는다"
