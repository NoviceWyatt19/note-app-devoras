  rule: >
    **R1-c — 판정 세션은 초점 항목을 전부 통과시킨 뒤에도
    「이 초점이 이 변경의 위험을 다 덮는가」를 한 번 더 묻는다.**
  why:
    incident: >
      S1·S2 교차검증에서 PM 이 준 초점은 **A7 헤딩 정체성 · 2-패스 매칭 · 캐럿 논거** 셋이었고,
      **앞의 둘은 통과했다.** 계획 세션이 그 둘만 보고 「통과」로 닫았어도
      **초점 지시는 전부 이행한 셈**이 된다. F1(캐럿 회귀)이 나온 것은
      **세 번째 축이 마침 거기 있었기 때문**이지 초점 밖을 봐서가 아니다.
    generalization: >
      **초점은 「볼 곳」을 정하는 것이지 「볼 곳의 전부」를 정하는 게 아니다.**
      초점을 설계하는 것은 PM 이고, PM 이 축을 하나 빠뜨리면
      판정 세션은 지시를 완벽히 이행하고도 결함을 놓친다 — 그리고 **그 실패는 기록상 「통과」로 남는다.**
    cost: "**질문 하나.** 초점 설계 실수를 한 겹 흡수한다"
  pm_note: >
    이 규칙은 **PM 을 겨냥한 것**이다. 판정 세션의 성실함이 아니라
    **초점 설계자의 누락**을 잡는 장치다. 이번 사이클에 PM 이 낸 오류
