      name: "YAML 커스텀 테마 (사용자 정의 + 핫 리로드)"
      in_release: false
      when: "출시 후. R5-a 가 세운 토큰 계층 위에 얹는 일이라 **나중에 해도 R5-a 가 매몰되지 않는다**"
      note: "`functions/6_theme_yaml_custom.md` 의 YAML 부분은 그대로 유효하다 — 전제만 R5-a 가 만든다"
  D9:
    q: "R6 전역 검색 — Rust 엔진 vs JS 유틸 (두 문서가 갈린다)"
    conflict:
      - "`functions/4_global_search.md` §3 — **Shared Layer JS 유틸** `searchWorkspace()`. Rust 는 체크리스트 마지막 **성능 대비책**으로만 언급"
      - "`implementation_plan.md` §4A.3 — **Rust 엔진(BufReader)을 기본 설계로 확정**"
    a: "**JS 우선. Rust 는 성능이 실측으로 문제가 될 때.** (PM 판정, 사용자 확인 대상)"
    rationale:
      - "**Rust 이관은 Phase 4 Tier 1 이고 출시 후로 미뤄져 있다.** 전역 검색을 Rust 로 지으면 Phase 4 를 출시 앞으로 당기는 것이 된다 — 스코프 확대다"
      - "R4 우선순위 축: **출시 차단 > 내부 품질.** 아직 존재하지 않는 기능의 성능 최적화는 출시를 막지 않는다"
      - "**이 프로젝트가 방금 그 실수로 8일을 썼다** — 재지 않은 성능 우려로 아키텍처를 먼저 골랐고(A6), 실측에서 예산 27배 여유가 나왔다(§5.11). 같은 형태를 반복하지 않는다"
      - "기능 사양서(`functions/`)가 제품 사양의 원본이고, 그쪽 순서가 JS → 필요 시 Rust 다"
      - "**`architecture_stages.md` 자신이 그 방식을 금한다** — `:244` 가 「Rust 이관은 Big Bang 이 아니라 **도메인 하나씩 점진적으로**」를 원칙으로 못 박는다. 아직 JS 구현조차 없는 도메인을 첫 이관 대상으로 삼는 것은 이 원칙에 정면으로 어긋난다. (계획 세션 확인, 2026-09-04 — 스코프 논거와 **독립적인 두 번째 근거**다)"
      - "**반대 논거였던 「architecture_stages.md 준수」는 과장이다** — 두 번째 벌 `4A.3` 이 `[!IMPORTANT]` 로 준수 요구처럼 제시하지만, Stage 2 항목(`architecture_stages.md:89`)은 「파일 검색 **인덱싱**을 Rust 로 구현(향후 전체 텍스트 검색 **대비**)」이고 **아직 체크되지 않은 향후 항목**이다. Phase 3.5 의 전역 검색을 Rust 로 지으라고 요구하지 않는다 — 실제 논거는 준수가 아니라 「지금 지으면 Stage 2 가 싸진다」는 **최적화**다"
    action: >
      **완료 (`09b98fb`) — 단, 한 곳이 아니라 세 곳이었다.**
      Rust 설계가 두 벌에 걸쳐 **세 절**에 흩어져 있었고 **절 번호가 1:1 대응하지 않는다**:
      `:1133` 첫 벌 `4A.3`(Rust 엔진 구현) · `:1640` 둘째 벌 `4A.3`(아키텍처 결정) ·
      `:1673` 둘째 벌 `4A.4`(Rust 엔진 구현). `4A.3` 만 고쳤으면 **둘째 벌 `4A.4` 가 표기 없이 남고
      거기만 읽은 세션이 Rust 로 착수한다.** 세 곳 모두 표기했다.
  accepted_without_change:
    - "**§4A 경고 상향** — 기존 경고가 `:1595`(두 번째 벌 시작점)에만 있어 위에서부터 읽는 사람은 두 벌의 존재를 몰랐고, 「아키텍처 결정: Rust vs JS」가 **두 번째 벌에만** 있어 정직하게 읽은 사람이 정확히 그 결정을 놓쳤다. `:1089` 로 상향 완료. 두 벌 해소 자체는 사용자 판단 대기 유지, **그전까지 두 벌 모두 읽고 채택한 쪽을 명시**하는 조건 유지"
    - "`code_review.md` §9.0 R2 서술 정정 완료 (D6 반영)"
    - "`injector.ts` 를 계획 경로로 표기 — D-4 결정 자체는 유효"
