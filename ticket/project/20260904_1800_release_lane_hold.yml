    why: "`indigo-900` 이 `primary`(indigo-500)와 **색상각이 다르다**"
    disposition: "**T3 마지막에 처리 후 재보고.** 토큰 1개 추가가 답일 수 있다 — 그때 판단"
  user_facing_note:
