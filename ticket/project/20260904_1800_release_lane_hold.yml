accent_collision_caught:
  update: "2026-09-09 — Impl 워커 발견, 착지 전 해소"
  what: "사양서 §5 매핑표가 indigo 를 `*-accent` 로 치환하라고 적었는데 **레거시 `accent` 는 teal**(`#14b8a6`)이다"
  why_dangerous: >
    `tailwind.config.js` 의 `colors` 는 **JS 객체라 키가 하나뿐**이다.
    그대로 갔으면 **나중에 쓴 쪽이 조용히 이기고**, 259~266곳 중 한쪽이
    **육안 없이는 안 잡히게** 깨졌을 것이다. 컴파일도 통과하고 타입도 통과한다.
  resolution: "indigo 의 이름은 이미 **`primary`**(87곳)다. 새 키를 만들지 않는다"
  new_rule: "**「레거시 이름이 있으면 그것이 정본이고, 같은 토큰에 새 키를 덧붙이지 않는다」** — 사양서에 명문화됨"
  verification: "`colors` 블록 전체(키 26 ↔ 토큰 26, 1:1)를 실제 컴파일해 **24개 클래스가 전부 기대한 이름으로 생성**되는 것 확인"
  pm_note: >
    **P1(있는 것을 보존하면서 「있어야 하는가」를 안 묻는다)의 반대 사례다.**
    여기서는 「새 이름을 만들 것인가」를 물었고 **레거시가 정본이라는 답이 나왔다.**
    앞선 네 건과 달리 **착지 전에** 잡혔다 — 토큰 건에 이어 두 번째다.
