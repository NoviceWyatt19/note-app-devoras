  - "§5.11 — 현행(출시) 아키텍처의 마운트 비용이 N=200 에서 10.9ms, 예산 300ms 대비 **27배 여유**. 게이트를 연 A6 위기(7,024~17,423ms)가 실측에서 재현되지 않았다"
  - "§5.15 — 하네스가 실제 비용의 1~19% 만 재고 있었을 가능성. 그렇다면 A6 근본 원인 귀속(동시 생존 EditorView 수)은 하네스 안에서만 성립한 이야기이고, 단일 CM 은 소수 지분을 겨냥한 처방이 된다"
