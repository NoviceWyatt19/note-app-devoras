      **검사의 크기와 검사자의 독립성은 별개 축이다.** 이 건은 단일 `git diff` 로 닫히고
      판정 기준이 기계적이라(3개 수치 대조) 독립성을 포기해도 되는 쪽이라고 봤다.
      **크기가 큰 판정에 같은 논리를 적용하면 안 된다.**
    raised_by: "계획 세션 (대기 중 자진 제기)"
