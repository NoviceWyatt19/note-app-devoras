    execution_constraints:
      - "**R1 교차검증이 우선.** R1 은 P0 이고 산출물 대기 중이다. 4A 통합이 그것을 미루면 R4 우선순위 축(데이터 유실 > 출시 차단) 위반이다"
      - "**절 번호 기준 자동 병합 금지.** `4A.3` 끼리 합치면 Rust 엔진과 아키텍처 결정이 뒤섞인다. 대응은 **절 제목·내용**으로 잡는다"
      - "**반드시 살릴 것** — bulk1: `4A.1` 목표·검색범위분리 · `4A.5` 파일 내 검색(SearchCursor) · `4A.6` EditorViewRegistry / bulk2: 키보드 단축키"
      - "**Rust 엔진 절 2개**(bulk1 `4A.3` · bulk2 `4A.4`)는 보존하되 **Phase 4 참고 자료로 강등** — D9 으로 출시 스코프의 R6 은 JS 다"
      - "**문서 전용 커밋** — 버전 미상승. 코드가 한 줄이라도 섞이면 예외 아님"
      - "`DOCUMENTS.md` §4 의 「사양이 두 벌 존재」 항목을 **해소로 갱신**하고, §4.5 대응표는 **통합 이력으로 보존**한다 — 다음 세션이 왜 이런 구조였는지 알아야 한다"
    highest_risk: >
      **`4A.6` EditorViewRegistry 소실.** 계획이 아니라 기존 구현(`shared/lib/editorViewRegistry.ts`)의
      설명이고 소비자가 셋이다(`FormatToolbar.tsx:3` · `BlockEditor.tsx:30` 구 경로 ·
      `SingleDocEditor.tsx:15` 단일 CM). 이 절이 사라지면 **Sprint 4B 가 이미 있는 것을 다시 만들고,
      동결된 8-D 를 재개하는 세션도 같은 함정에 빠진다** — 8-D 의 「산출물 보존, 재개 시 그대로 이어받는다」가
      부분적으로 이 절에 걸려 있다. **통합 후 이 절의 존재를 별도로 확인할 것.**
