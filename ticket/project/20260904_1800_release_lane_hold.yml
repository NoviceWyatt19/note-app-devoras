incident_20260905_amend:
  what: "공유 워킹 트리에서 `--amend` 로 다른 세션의 커밋 메시지를 덮어썼다"
  reported_by: "Debug_Manager_v2 (자진 신고)"
  damage: "**내용 손실 없음.** `0b2ebd5` 의 파일(S1·S2 티켓 `20260905_1500_...yml`)은 온전하다. 잘못된 것은 **메시지뿐**이다"
  correct_message_of_0b2ebd5:
    should_be: "`docs: S1·S2 티켓 사후 발행 및 완료 처리 (commit f4d5d69)`"
    currently_says: "`chore(0.9.3): §3.9 Tailwind 연동 처방 정정 — var() 직접 사용은 불투명도 수식어를 죽인다`"
    note: "**§3.9 정정의 실제 내용은 `5a766a5`(`implementation_plan.md`)에 정상 착지했다.** 두 커밋이 같은 메시지를 달고 있고, 내용을 가진 쪽은 `5a766a5` 다"
  D16:
    q: "복구할 것인가"
    a: "**복구하지 않는다. 기록으로 남긴다.**"
    grounds:
      - "**커밋 5개가 이미 위에 쌓였다**(`29b3b46`·`b38e8a1`·`d057d62`·`4854acc`·`64f64c8`). amend 로는 못 고치고 `rebase` 가 필요하다"
      - "**`rebase` 는 같은 사고의 더 큰 판이다.** 공유 트리에서 히스토리를 다시 쓰면 다른 세션이 들고 있는 기준선이 전부 어긋난다"
      - "**피해가 메시지 한 줄이고 여기 정정이 남는다.** 고치는 비용이 사고 위험보다 크다"
    action: "이 절이 정정 기록이다. `git log` 에서 `0b2ebd5` 를 만나는 사람은 여기를 본다"
  R7_new_rule:
    rule: "**공유 워킹 트리에서 `--amend` · `rebase` 금지.** 메시지 오타는 고치지 말고 후속 커밋에 정정을 적는다"
    why: >
      **경로 지정 커밋이 `--amend` 를 보호하지 못한다.** `git commit -- <경로>` 는 남의 변경을
      인덱스에서 쓸어담지 않지만 `--amend` 는 **HEAD 자체를 갈아치우므로** 그 보호가 통하지 않는다.
      그리고 **HEAD 확인과 amend 사이에는 원자성이 없다** — 확인해도 안전해지지 않는다.
    proposed_by: "Debug_Manager_v2 (사고 당사자의 자진 규칙 제안)"
    landed: "`.agents/AGENTS.md` §2 「공유 워킹 트리에서의 커밋」에 편입"
  assessment: >
    **자진 신고가 옳았고 빨랐다.** 피해 범위를 스스로 정확히 좁혔고(내용 무사, 메시지만),
    복구가 막히자 임의로 우회하지 않고 올렸으며, **자기 잘못의 구조를 정확히 진단했다**
    (「경로 지정으로 보호되지 않는 연산을 썼다」). 규칙 제안까지 붙였다.
    이 사고의 실질 비용은 커밋 메시지 한 줄이고, 산출물은 **규칙 하나**다 — 남는 장사다.
