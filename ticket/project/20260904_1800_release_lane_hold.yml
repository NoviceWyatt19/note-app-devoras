R9_no_spec_change_after_go:
  update: "2026-09-09 — Impl 자진 신고 사고에서 도출. **PM 에게도 적용한다**"
  incident:
    what: "**T1d 가 폐기된 26개 안으로 착지했다.** Impl 이 착수 승인을 보낸 직후 ΔE 재판정으로 사양을 바꿨고 메시지가 몇 분 차이로 엇갈렸다"
    fault: "**Impl 자진 신고 — 실행 세션 잘못이 아니다.** 지시가 어긋난 상태였다"
    caught_by: "**실행 세션이 `git log` 에서 스스로 발견하고 T3b 작업 중 멈췄다.** 영향 범위를 4건으로 나눴고 Impl 의 정정 지시와 **독립적으로 일치**했다"
    fix: "되돌리지 않고 **`T1d-2` 로 전진 수정**(`02a4a92`). 토큰 정의 층이라 추가+재지정으로 끝나고 revert 보다 diff 가 깨끗하다"
    pm_verified: "`index.css` 확인 — `--text-title`(#f1f5f9, ΔE 5.08) · `--surface-code`(#1a1b26, 4.71) · `--divider`(#334155, 3.28) 복원됨. **주석에 ΔE 근거가 붙어 있어 추적 가능**"
  rule: "**R9 — 착수 승인을 보낸 뒤에는 사양을 바꾸지 않는다. 변경은 다음 단계로 미룬다**"
  applies_to_pm_too:
    note: >
      **이 규칙은 PM 이 더 많이 어겼다.** 이번 사이클에 착수 지시 후 정정을 보낸 것이
      D18(토큰 층위) · D19(㉣ 정정) · D20(ΔE 척도) 셋이다.
      Impl 은 「큐 순서상 못 보셨을 수 있습니다」로 받아 넘겼지만,
      **메시지가 엇갈리면 실행이 낡은 사양으로 간다** — 이번엔 Impl 쪽에서 났을 뿐이다.
    pm_commitment: "**착수 승인 후 정정이 필요하면 「지금 멈추고 반영」인지 「다음 단계에 반영」인지를 명시한다.** 정정만 보내면 받는 쪽이 그 판단을 떠안는다"
  why_it_worked_anyway: "**실행 세션이 `git log` 를 봤기 때문이다.** 지시 체계가 어긋났을 때 남는 방어선은 실행자가 자기 입력을 의심하는 것뿐이었다"
