coordination_rule:
  update: "2026-09-04 19:10 — 사용자 지시: 「디버그가 기능 구현을 방해하지 않는 선에서 유지, PM 판단으로 조율」"
  status: "**상시 적용 규칙.** 디버그를 끄지 않는다 — 값이 나는 곳에만 쓴다"
  R0_attribution:
    rule: "모든 디버그 작업은 **출시 스코프 항목 1개에 귀속**되어야 착수한다"
    rationale: "귀속 없는 탐색적 조사가 §5.12~§5.17 을 만들었다. 조사 자체는 훌륭했으나 겨냥이 없었다"
    queue: "귀속 없는 발견은 **티켓으로 적재만 하고 착수하지 않는다**"
  R1_two_round_cap:
    rule: "하나의 가설에 대한 판별 실험은 **2라운드까지.** 3라운드가 필요하면 PM 판정을 받는다"
    rationale: "§5.12 → §5.14 → §5.15 → §5.16 → §5.17 이 24시간 5라운드였고, 매 라운드가 가설을 하나씩 늘렸다"
  R1b_precondition:
    rule: >
      **1라운드 착수 전에 「이 관측이 어느 조건에서 나왔는가」를 확정해 기록한다.**
      플래그 상태 · 빌드 모드 · 페인 가시성 · 워크스페이스 규모 — 판별에 영향을 주는 조건은 전부.
    added_by: "계획 세션 제안 수용 (2026-09-04)"
    rationale: >
      **R1 을 보완하는 것이 아니라 R1 이 놓친 진짜 원인이다.** §5.12→§5.17 이 5라운드로 늘어난 실제
      원인은 라운드 수가 아니라 **전제 미확인**이었다 — §5.11 이 IME 관측을 적으면서
      「⚠️ 단, 어느 플래그 상태에서 관측했는지 확인이 필요하다」를 스스로 남겼고, 그 미확정이
      뒤 라운드 전부를 오염시켰다. **조건이 안 적힌 관측은 라운드를 소비할 자격이 없다.**
    enforcement: "조건이 기록되지 않은 관측으로는 판별 실험을 시작하지 않는다. R1 카운터는 조건 확정 이후부터 센다"
  R2_environment:
    rule: "「이 환경에서 못 잰다」가 **한 번 확인된 축은 재시도하지 않는다**"
    action: "포어그라운드·사람이 필요한 항목은 `VERIFY_BY_HUMAN.md` 로 보내고 큐에 넣는다. 세션이 재시도하지 않는다"
    rationale: "§5.14 `frameCount:0` · §5.16 「이 환경에서 못 잼」 · §8 T2 주의 — 같은 벽을 세 번 쳤다"
  R3_file_disjoint:
    rule: "구현 세션이 점유한 파일을 디버그 세션이 동시에 만지지 않는다"
    how: "착수 전 `git status --short` 확인 · 커밋은 경로 지정 · 커밋 형식은 `속성(현재버전): 설명`"
    rationale: "공유 워킹 트리. 실제 사고 `f48b88c`"
  R4_tiebreak:
    rule: "**데이터 유실 > 출시 차단 > 사용자 가시 결함 > 내부 품질 > 미출시 경로**"
    note: "**플래그 off 경로는 항상 최하위다.** 아무리 큰 수치가 나와도 이 순서를 넘지 않는다"
  R5_escalation:
    rule: "디버그가 구현을 막으면 **구현이 이긴다.** 즉시 PM 에 보고하고 디버그는 큐로 내린다"
  R6_deliverable:
    rule: "디버그 세션의 산출물은 **결함 티켓 또는 판정**이다"
    note: "새 가설 문서는 산출물이 아니다. 라운드를 늘리는 서술로 세션을 닫지 않는다"
