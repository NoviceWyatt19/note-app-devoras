s1_revert_decision:
  update: "2026-09-09 — 교차검증 `BUG-20260909-01`(`1d2739c`) 판정. PM 실측 확인"
  verdict: "🔴 **S1 디바운스를 되돌린다. S2 는 유지한다.**"
  pm_verified:
    - "`useDebouncedCallback.ts:34` — `argsRef.current = args` 로 덮고 발화 때 **마지막 인자**를 쓴다. **재호출되지 않으면 예약 시점 인자가 그대로 언다**"
    - "`BlockEditor.tsx:683` — `debouncedResplit(id, cursorOffset, blocksBeforeUpdate)` 로 **캐럿 인자를 예약 시점에 넘긴다.** 콜백은 발화 시점 `getMergedContent()` 를 읽는다 → **한 함수가 두 세대의 상태를 읽는다**"
    - "`BlockEditor.tsx:670` — `/^#{1,3} /` 라 **공백을 칠 때** 헤딩 수가 0→1 로 바뀐다. 예약 트리거가 사용자 타이핑 도중에 걸린다"
    - "`BlockEditor.tsx:689` `handleMerge` — `mergeBlockWithPrevious` + `syncContent()` 만 부르고 **`debouncedResplit` 를 재호출하지 않는다.** 150ms 창 안에서 형제가 사라져도 얼어붙은 스냅샷에는 남는다(F2)"
  D17:
    q: "F1·F2 를 가드로 고칠 것인가, S1 을 되돌릴 것인가"
    a: "**되돌린다.** 가드를 얹지 않는다"
    rationale:
      - "**S1 이 겨냥한 비용은 측정된 적이 없다.** §5.16 이 잰 것은 **단일 붙여넣기**이고 D15 가 이미 「디바운스는 그 축을 못 돕는다」로 확정했다. S1 이 실제로 돕는 것(타이핑 중 버스트 재분할)은 **아무도 문제라고 측정한 적이 없다.** 이 프로젝트 자신의 규칙 — **「처방을 측정보다 먼저 쓰지 말 것」(§3-C)** — 을 내가 어긴 지시였다"
      - "**바꾼 대가는 측정된 회귀다.** 사용자 가시 캐럿 이탈이고 **이미 `main`(v0.9.3)에 있다.** 간헐적이라 재현이 어렵고, §5.13 이 기록한 「의도된 동작처럼 보이는 결함은 영원히 신고되지 않는다」 부류다"
      - "**가드는 같은 축의 네 번째 문이다.** BUG-20260831-01 이 캐럿 방어를 세웠고(「새 명령일 때만 적용」), S1 이 `focusBlock` 으로 focusToken 을 **정당하게** 올려 그 문을 우회했다. 교차검증의 표현 그대로 **「막은 문이 아니라 옆문으로 같은 실패가 들어왔다」** — 문을 하나 더 다는 것은 같은 형태를 한 번 더 초대하는 것이다"
      - "**출시 레인이다.** 측정되지 않은 최적화를 지키려고 회귀를 안고 가지 않는다. R4 축: **사용자 가시 결함 제거 > 내부 품질**"
    keep_s2: >
      **S2 는 유지한다.** 교차검증이 S2 의 이득이 커밋 메시지보다 크다는 것을 밝혔다 —
      두 번째 `setContent(merged)` 는 갱신된 blocks 상대로 2-패스를 다시 돌아
      **`nextFlatBlocks` 에서 뽑아 둔 `targetId` 를 무효화할 수 있었다**(그러면 `focusBlock` 이 없는 블록을 겨눈다).
      **잠재 결함까지 닫은 수정이다.**
    pm_accountability: >
      **S1 은 내 지시였고 근거가 틀렸다.** D15 에서 정당화 오류를 이미 기록했고
      이 결정이 그 정정을 완결한다. 「헤딩 10~20개 붙여넣기는 일상」이라는 내 근거는
      단일 붙여넣기 시나리오였고 디바운스가 겨냥하는 축이 아니었다 — **처방과 근거가 어긋난 채로
      지시가 나갔고, 그 처방이 회귀를 만들었다.**
  if_redone_later:
    condition: "**타이핑 중 버스트 재분할이 실제로 문제라는 측정이 먼저 나올 때만** 재시도한다"
    how: >
      교차검증 권고대로 **순수 함수로 뽑아서** 한다 — `(얼어붙은 캐럿 인자, 발화 시점 블록 목록)
      → (targetId, targetOffset)`. **이 저장소에 선례가 있다**: `decideCaretAction` 이
      **정확히 이 컴포넌트에서 정확히 이 이유로** 뽑혀 나갔다(`caretCoordinator.ts`).
      뽑으면 T1 에서 바로 검사된다 — **멀티 블록 렌더 하네스는 필요 없다.**
  harness_finding_recorded:
    what: "`caret_stability_harness` 전량 통과는 **이 변경의 근거가 되지 않는다**"
    why: >
      그 하네스는 「**새 명령일 때만** 적용하는가」를 검사한다. F1 은 **새 명령이 낡은 값을 싣고 오는 것**이라
      조정자로서는 정확히 적용하는 것이 옳은 동작이다. **하네스는 상류를 보지 않는다.**
    lesson: "`code_review.md` §0(「전부 자동 테스트를 통과했다」)의 **기전이 하나 특정됐다** — 테스트가 검사하는 계층과 결함이 사는 계층이 다르면 통과는 정보가 아니다"
  followups:
    - id: "빈 배열 크래시"
      what: "`nextFlatBlocks[nextFlatBlocks.length - 1].id` 가 빈 배열에서 터진다"
      note: "**S1 이 만든 것이 아니라 옮겨온 기존 결함.** 되돌리면 원위치로 돌아간다 — **별도 티켓으로 기록만** 하고 이번에 고치지 않는다"
    - id: "F2 자연 소멸"
      what: "F1 과 뿌리가 같아 되돌리면 함께 닫힌다. 별도 조치 불필요"
