    q: "Sprint 4A 두 벌 통합 — 실행할 것인가, 누가, 언제"
    a: "**실행한다. 담당은 계획 세션(`Debug_Manager_v2`). 기한은 R6 착수 전.**"
    decided_by: "사용자 (2026-09-05, 원문: 「계획 세션에 맡기고 R6 착수 전에 통합해줘」)"
    status: "`§open_decision_4a_merge` 의 「사용자 결정 필요」 해제. 권고 → **실행 지시**"
