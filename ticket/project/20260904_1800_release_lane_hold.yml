decisions_resolved:
  update: "2026-09-04 (사용자 결정 4건)"
  D1:
    q: "보류 승인 여부"
    a: "**승인.** 실행 세션은 현재 작업을 **이후 진행에 영향을 주지 않는 선에서 마무리**하고 중단"
    delivered: "`Debug_Manager_v2`·`Debug_worker_v2` 두 세션에 전달 완료 (2026-09-04)"
    wrap_up_rule: >
      임시 계측 원복(`git diff` 클린)이 최우선. 얻은 결과는 `DEBUG_PLAN.md` 에 **결과만** 기록하고
      새 가설·새 실험 제안은 쓰지 않는다. §5.17 말미에 "PM-20260904-01 로 동결, D2·D3 미착수" 명시.
  D2:
    q: "`autosaveDelay` — 배선 vs 제거"
    a: "**슬라이더 제거 + `off` / `low` / `high` 3단계로 재설계하고 실제 배선.**"
    ticket: "ticket/impl/20260904_1830_autosave_levels.yml (FEAT-20260904-01)"
    order: "**R1(ERD) 선행 필수** — 자동 저장이 붙는 순간 BUG-20260902-01 이 P1 → P0"
  D3:
    q: "배포 대상"
    a: "**당장은 macOS 개인 배포. 추후 Homebrew 등록이 목표.**"
    ticket: "ticket/project/20260904_1840_release_engineering.yml (REL-20260904-01)"
    consequence: >
      Homebrew 가 목표면 **자체 업데이터(`tauri-plugin-updater`)의 우선순위가 내려간다** — `brew upgrade`
      가 그 역할을 한다. R3 비용이 당초 추정보다 낮아진다. 대신 **버전 태그 + 안정적 다운로드 URL +
      체크섬**이 전제가 되므로 GitHub Releases 파이프라인이 먼저다.
  D4:
    q: "0.9.x 출시 스코프"
    a: "**Phase 3.5 전부 포함이 이상적.**"
    finding: >
      **스코프 조사 결과 Phase 3.5 잔여가 로드맵 표기보다 훨씬 적다.** 아래 `phase35_actual_state` 참조 —
      로드맵 체크박스 3개가 낡았다. 실제 잔여는 4건이고, 그중 하나(Sprint 3 의 CM 통합/가상화)는
      이 티켓이 방금 동결한 항목이라 **스코프에서 빼야 한다.**
