    q: "S1 디바운스가 「대량 붙여넣기」를 풀지 못한다는 실행 세션 보고를 어떻게 처분하는가"
    reported_limitation: >
      실행 세션 자진 보고: **한 번의 붙여넣기는 한 번의 호출이므로 디바운스가 그 안의 비용(200개 마운트)을
      줄이지 못한다.** 실제로 돕는 것은 **연속된 개별 헤딩 변경 편집**의 반복 재분할을 1회로 합치는 것뿐이다.
    pm_correction: >
      **보고가 옳고 PM 의 정당화가 틀렸다.** 내가 S1 을 지시하며 쓴 근거는
      「**헤딩 10~20개 붙여넣기는 일상이다**」였는데, 그건 **단일 붙여넣기 시나리오**다 —
      디바운스가 겨냥하는 축이 아니다. 처방과 근거가 어긋난 채로 지시가 나갔다.
    a: "**그럼에도 추가 작업을 지시하지 않는다.** S1 은 수용하고 붙여넣기 축은 **큐로 내린다**"
    rationale:
      - "**마운트 비용이 실측에서 문제가 아니다.** §5.11 이 N=200 attached **10.9ms**(예산 300ms 대비 27배 여유)를 쟀다. 「200개 재마운트 = 폭발」은 A6 의 옛 수치(7,024~17,423ms)에서 온 **추론**이었고, 재측정이 그 전제를 무너뜨렸다. 헤딩 20개면 더더욱 문제가 아니다"
      - "**남은 미상은 §5.12 의 ~3,760ms 인데 그건 동결된 8-D 영역이다.** 여기를 더 파면 내가 멈춘 포렌식을 재개하는 것이 된다 — R4 우선순위 축에서 **미출시 경로(최하위)**이고, 그 경로의 원인 규명은 출시를 막지 않는다"
      - "**S1 이 실제로 준 것은 작지만 진짜다** — 타이핑 중 헤딩 경계를 넘나들 때마다 돌던 **문서 전체 2-패스 재매칭**이 버스트당 1회로 합쳐졌다. S2(중복 `setContent` 제거)는 헤딩 수가 바뀌는 모든 편집에서 일을 절반으로 줄인다. 둘 다 출시 경로의 실이득이다"
    queued: "단일 대량 붙여넣기의 정량 재측정 — **8-D 재개 시 §5.21 G-BULK 와 함께.** 단독 착수하지 않는다"
  test_gap:
    what: "S1·S2 를 겨냥한 **신규 자동 테스트 없음.** 멀티 블록 렌더 하네스가 필요해 범위 밖으로 판단, 실 브라우저 수동 검증으로 대체(티켓에 사유 기록)"
    pm_assessment: >
      **수용한다.** 가장 위험한 축(캐럿)은 `caret_stability_harness`(T1, 기존)가 덮고 통과했다.
      실행 세션이 캐럿 안전성 논거를 코드로 제시했고(`absoluteCursorPos` 는 **앞 형제 블록 길이 합**에만
      의존하며 형제는 이 편집으로 바뀌지 않는다) 실기로 확인했다(`cursorPos: 31` 일치).
    but: >
      **교차검증이 이 논거를 독립 확인해야 한다.** 이 프로젝트의 심각한 결함 3건이 전부 리팩터가 만들었고
      전부 자동 테스트를 통과했다(`code_review.md` §0). 여기는 **테스트가 아예 없는** 경우라 더 무겁다.
    cross_check_focus:
      - "**A7 헤딩 정체성** — 재분할이 150ms 늦어지는 동안 `headingId` 가 다른 블록에 붙을 수 있는가"
