# ━━━
why_now: >
  §5.12~§5.17 이 24시간 동안 5라운드를 돌았다(H1 기각 → D1 판별력 없음 → 구 경로 대조 폐기 →
  H4 신설 → D2·D3 제안). 각 라운드가 가설을 하나씩 늘렸고 제품은 한 줄도 움직이지 않았다.
  아래 3가지가 동시에 성립하므로 **이 조사는 지금 값을 만들지 않는다.**
# ━━━
hold_grounds:
  - id: "G1 — 대상 경로가 출시되지 않았다"
    fact: "`src/widgets/BlockEditor/singleDocEditorFlag.ts:15` `DEFAULT_ENABLED = false`"
    meaning: >
      §5.12 의 INP ~3,800ms·CLS 3.80 은 **사용자가 실행하지 않는 경로**의 수치다.
      플래그 off 가 기본이고 `localStorage` 로만 켜진다. 출시 차단도, 사용자 영향도 0 이다.
      "Step 2 진입 게이트"로서는 유효하나, **Step 2 자체를 지금 할 이유가 없다면 게이트도 지금 설 이유가 없다.**
  - id: "G2 — 시나리오가 실사용이 아니다"
    fact: "재현 입력 = `mount_cost_n200.md` — 1,013행 / 36KB / 헤딩 201개. 팀이 계측용으로 만든 픽스처"
    meaning: >
      한 번에 헤딩 201개짜리 문서를 붙여넣는 것은 이 제품의 상용 동작이 아니다.
      제품 자신의 스펙(`function_roadmap.md` 퀵 캡처 §)이 핵심 사용을 **「적기」 한 단계**로 규정한다.
      실사용 상한을 대표하지 않는 입력으로 게이트를 세우면 **영원히 안 닫힌다.**
  - id: "G3 — 이 환경에서 답이 안 나온다는 것이 이미 두 번 기록됐다"
    fact: "§5.14 `frameCount: 0` · §5.16 「이 환경에서 못 잼」 · §8 T2 주의(숨겨진 페인 → rAF 미발화)"
    meaning: >
      D2·D3 는 문서 자신이 **「어디를 볼지 좁히는 것」**이라고 적었다 — 판정 도구가 아니다.
      절대 INP 는 여전히 포어그라운드(사람)가 필요하다. 즉 D2·D3 를 다 해도 🔴 는 안 내려간다.
      **사람 시간을 여기 쓰지 않는다**(§5.17 이 구 경로 대조에 대해 내린 결론과 같은 논리를 D2·D3 에도 적용).
# ━━━
premise_erosion:
