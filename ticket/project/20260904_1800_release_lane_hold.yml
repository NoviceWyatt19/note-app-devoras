    correct_metric: "**CIE76 ΔE.** 2.3 미만이 JND(사람이 구분 못 하는 경계)"
    evidence:
      - "surface-0+1 — 대비 1.03:1 · **ΔE 1.56** → 병합 유지"
      - "surface-2+3 — 대비 1.02:1 · **ΔE 2.06** → 병합 유지"
      - "surface-4+5 — 대비 1.05:1 · **ΔE 4.71** → **철회**"
      - "text-0+1 — 대비 1.13:1 · **ΔE 5.08** → **철회.** 35px H1 에 직접 적용되는 색이다"
      - "text-5→border-2 — **ΔE 3.28** → **철회**, 이름만 `--divider`(값 불변)"
    key_number: "**대비 1.05:1 과 1.02:1 이 ΔE 로는 4.71 대 2.06 이다.** 대비만 보고 둘 다 「감지 불가」로 묶으면 틀린다"
  node_hue: >
    노드를 hue 하나로 합치려던 것도 철회. **ΔE 2.76~10.40** 이고 알파를 ΔE 기준으로 최적화해도
    amber·pink·purple 은 못 맞춘다 — **밝기가 아니라 색상각이 다르기 때문**이다.
    hue 5 + tint 5 로 나누니 **뱃지 배경·테두리가 ΔE 0**(원본 값 그대로)이 된다
  net_change: "**+5** 노드 tint · **+1** `--highlight-bg`(`.rv-content mark` 배경, 현재 하드코딩 rgba 라 라이트 모드에 반응 못 함) · **−1** `--accent-deep`(죽은 토큰, 유일 용처가 `relations.ts:157` 의 발화하지 않는 폴백) · **−2** 표면 병합 2쌍"
  verdict: "✅ **승인.** 「필요한 것만 나눈다」의 기준은 개수가 아니라 **「이 둘이 실제로 다른 색인가」**이고, 제대로 재보니 줄일 수 없었다"
  rule_worked: >
    Impl 보고: **「PM 이 이 규칙(쌍별 실측 후 임계 밖 제외)을 걸어두지 않았으면 제 26개 안이 그대로 갔을 겁니다.」**
    제약이 **제안자 자신의 안을 잡았다.** 다만 그 제약이 가리킨 지표가 틀렸고, 그건 Impl 이 고쳤다
  changed_screen_points:
    count: "**8 → 4 로 감소**"
    list:
      - "① 스크롤바 트랙·`erd secondary`·`bg-[#111216]` 2곳 → `#0d0e12` (ΔE 1.56)"
      - "② `bg-[#141520]` 7곳(카드·코드블록 헤더) → `#161821` (ΔE 2.06)"
      - "③ 마인드뷰 카드 배경 node3·node5 (**ΔE 2.71·2.82 — JND 근소 초과**)"
      - "④ 같은 곳 node1·2·4·indigo (ΔE 0.63~2.05)"
    assessment: "**①②④ 는 JND 미만. ③ 만 근소 초과**이고 근흑색 카드 배경이라 절대 영향은 작다. **수용**"
