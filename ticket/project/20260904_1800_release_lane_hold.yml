D19_t1d_ordering:
  update: "2026-09-09 — Impl 보고 수용. **PM 의 ㉣ 판단 정정**"
  pm_error:
    what: "「T3 는 토큰 **이름**을 가리키므로 통합해도 자동으로 따라온다 — 되돌릴 필요 없다」(㉣)"
    verdict: "🟠 **절반만 맞다**"
    why: >
      통합이 **「합치기」와 「이름 바꾸기」를 동시에** 한다. 합치기만이면 ㉣ 가 맞지만,
      이름이 바뀌는 쪽은 호출부가 **낡은 이름을 가리킨 채 남는다.**
      `text-t0`·`text-t1`→`text-strong`, `bg-surface0`·`surface1`→`bg-darkBg`,
      `*-accent0`→`*-primary` 등 **T3 가 실제로 건드리는 층에서 이름이 바뀐다.**
    consequence_if_uncorrected: >
      **T3b~T3g 를 먼저 돌리면 곧 없어질 이름으로 6개 파일을 고치고 전부 두 번 편집한다.**
      T3a(`500b602`) 는 이미 5개 이름을 쓰고 있어 rename 이 필요하다(한 파일, 0.25h).
  decision: "**T1d(토큰 통합 코드 적용)를 T3b 보다 먼저.** Impl 판단이 옳다"
  order: "T1d → T3a rename → T3b~T3g → T2 → T6"
  size: "**9.5~12h** — 이전 10~13h 에서 실질 동일. T1d 가 추가됐으나 T6 의 라이트 값이 32→26 으로 줄어 상쇄"
