constraints:  
  - "Markdown 원본을 유일 원본(SSOT)으로 보존하며, 공간 좌표는 <!-- devoras:spatial --> 주석으로 저장한다."  
  - "H1은 최상위 루트 블록, H2는 실질적 카드 메인 에디터 블록, H3~H6은 마인드뷰 하위 노드로 계층화한다."  
  - "성능 및 가독성을 위해 티켓은 YAML(.yml) 형식을 지키며 하네스 엔지니어링을 점진적으로 도입한다."
