# ━━━
conclusion: >
  **조건부 통과.** 디스크를 잘못 덮거나 내용을 교차 오염시키는 경로는 없다 —
  가장 우려됐던 S1 형 세대 혼합은 `saveFile` 이 tabId 로 라이브 상태를 읽기 때문에 **성립하지 않는다.**
  안전장치·마이그레이션·죽은 코드 제거는 전부 깨끗하다.
  남는 것은 **「켜져 있다고 믿는데 안 도는」 두 경로(F1·F2)** 와 **R2 가 만들지 않았으나 상시화한 세 축(U1·U2·U3)** 이다.
  **U2 가 가장 값이 크다** — 유일하게 새로운 **손상 가능성**을 여는 항목이고, 나머지는 미이행·표시 결함이다.
