# R1-c — 초점 넷을 통과시킨 뒤 「이 초점이 위험을 다 덮는가」를 다시 물었다
r1c_uncovered:
  - id: "U1 — 🟠 **같은 파일을 두 패널에 열면 저장 후에도 한쪽이 dirty 로 남는다**"
    mechanism: >
      `tabId = file.path`(`store.ts:172`)이므로 **같은 파일을 두 패널에 열면 두 패널에 같은 tabId 가 존재**한다
      (`closePane` 주석도 *「두 패널이 같은 탭을 복사해 갖고 있는 경우」*를 명시한다).
      그런데 `saveFile` 의 마무리는 **`targetPaneId` 패널만** 갱신한다(`store.ts:668-678`
      `if (p.id !== targetPaneId) return p`) — 다른 패널의 사본은 `isDirty: true` 와
      **낡은 `savedContent`** 를 그대로 유지한다.
      그리고 `scheduleAutosave` 는 **첫 번째로 발견된 패널**의 id 로 예약한다(`store.ts:582-588` 의 `break`).
      → **패널 B 에서 편집해도 예약은 패널 A 로 나가고, 저장 후 dirty 가 꺼지는 것도 패널 A 뿐이다.**
    consequence: "파일은 정확히 써진다. 그러나 **편집 중인 패널의 dirty 점이 영원히 안 꺼지고**, 탭을 닫을 때 이미 저장된 탭에 대해 **거짓 확인창**이 뜬다"
    preexisting: "**`saveFile` 의 기존 결함이다.** R2 가 만든 것이 아니라 **저장을 자동화해 상시 노출시켰다** — 전에는 명시적 저장 때만 드러났다"
  - id: "U2 — 🟠 **spatial.json 재작성이 편집 주기마다 일어난다**"
    mechanism: >
      `saveFile` 은 매번 `readSpatialMetadata(workspace)` → 병합 → `writeSpatialMetadata(workspace)`
      를 **무조건** 수행한다(`store.ts:648-650`). 좌표가 안 바뀌어도 돈다.
      자동 저장 `high` 기본값이면 이 **워크스페이스 전체 메타데이터 파일**의 읽기+쓰기가
      **편집 중 ~1.5초마다** 발생한다. 전에는 사용자가 저장할 때만이었다.
    consequence: >
      ① I/O 증폭 ② **손상 창(corruption window)** — `spatial.json` 하나에 **전 파일의 좌표**가 들어 있는데,
      쓰기 도중 앱이 죽으면 **한 문서 편집 때문에 워크스페이스 전체 좌표**가 날아갈 수 있다.
      쓰기 실패는 `console.warn('...ignoring')` 으로 삼켜진다.
    note: "**R2 전에는 이 노출 빈도가 사용자 손에 있었다.** 기본값 켜짐이 그것을 자동화했다"
  - id: "U3 — 🟡 지속성 기능의 실패가 조용하다"
    mechanism: >
      쓰기 실패 경로가 세 겹 다 삼킨다 — spatial 은 `console.warn(...ignoring)`,
      `saveFile` 바깥은 `console.error`, 자동 저장은 `.catch(console.error)`.
      **UI 신호는 「dirty 점이 안 꺼진다」뿐**이고, 사용자는 자동 저장을 믿으므로 그 점을 볼 이유가 없다.
    relation: "`code_review.md` 의 **I-2(`settings/store.ts:79` 빈 catch)** 와 같은 계열이다. 자동 저장은 **지속성 기능**이라 같은 패턴의 비용이 더 크다"
    note: "실패 시 `set({panes})` 에 도달하지 못해 dirty 가 유지되는 것은 **설계상 옳다** — 문제는 그 신호가 사용자에게 닿지 않는다는 것이다"
