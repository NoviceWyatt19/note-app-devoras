headline: >
  **디스크를 잘못 덮는 경로는 찾지 못했다.** 발견된 것은 전부 「켜져 있다고 믿는데 안 도는」 축이다.
  자동 저장은 **데이터를 지키는 기능**이므로, 안 도는 것은 안전하지만 **약속 미이행**이다.
# ━━━
F1:
  q: "`updateContentForTab` 이 정말 유일한 편집 진입점인가"
  verdict: "🟠 **아니다. 구멍 1건**"
  gap: >
    **마인드맵 노드 좌표 드래그**가 이 진입점을 거치지 않는다.
    `useActiveTabStore.ts:60-66` 의 `updateNodeCoordinate` 는 탭 스코프 `isDirty` 를 켜고
    `markTabDirty(activeTabId)` 로 **탭 바 점만** 켠다 — `updateContentForTab` 을 부르지 않는다.
    주석이 그 사실을 명시하고 있다: *「좌표만 바뀐 경우 `updateContentForTab` 을 거치지 않으므로
    탭 바 점(dot)은 별도로 켜야 한다」*.
  consequence: >
    자동 저장 `high` 인데 **노드를 아무리 옮겨도 저장되지 않는다.** dirty 는 켜지므로 유실은 아니다
    (탭 닫기 `confirmDiscardIfDirty` · 종료 `onCloseRequested` 가 잡는다).
    그러나 좌표는 `saveFile` 이 `.devoras/spatial.json` 에 쓰는 **저장 대상**이고,
    사용자는 자동 저장이 켜져 있다고 본다.
  note: "`markTabDirty` 는 이 한 곳에서만 호출된다(`grep` 확인) — 구멍은 이 경로 하나다"
F2:
  q: "flush 생략 판단 — 세 가드가 대기 중 예약을 덮는가. S1 F1 과 같은 모양의 위험이 있는가"
  verdict: "✅ **내용 축은 안전.** 🟠 **`paneId` 축에 구멍 1건**"
  s1_style_risk_absent: >
    **S1 의 세대 혼합은 여기서 재현되지 않는다.** `scheduleAutosave(paneId, tabId, prev, new)` 의
    `prev`/`new` 는 **예약 시점의 skip 판정에만** 쓰이고 **쓰기에는 실리지 않는다.**
    타이머 콜백은 `saveFile(paneId, tabId)` 만 부르고, `saveFile` 은 `getTabStore(targetTabId)`
    (`store.ts:630`)로 **발화 시점의 라이브 내용**을 읽는다.
    → **다른 탭의 내용이 이 예약에 실려 쓰이는 경로는 없다.** 스토어가 tabId 로 키잉돼 있기 때문이다.
  gap: >
    **그러나 `paneId` 는 얼어 있다.** `saveFile` 은 `panes.find(p => p.id === targetPaneId)` 로
    시작하고 **못 찾으면 조용히 early return** 한다(`store.ts:611-612`).
    `closePane` 은 닫히는 패널의 탭을 **병합 대상 패널로 옮긴다** — 그러면 얼어붙은 `paneId` 의 패널이
    사라진다. 그리고 **`cancelAutosave` 는 `closeTab` 에만 배선돼 있고 `closePane` 에는 없다.**
    → 예약이 살아서 발화하고, **아무 일도 하지 않고 끝난다.**
  reachability: "분할 패널에서 편집한 뒤 지연 안에 그 패널을 닫으면 된다. `high` 1500ms 는 촉박하지만 `low` 5000ms 는 쉽다"
  consequence: >
    유실은 아니다(탭은 병합 대상에 살아남고 dirty 도 유지된다). 다만 **그 뒤로 사용자가 편집을 멈추면
    자동 저장이 켜진 채로 영원히 저장되지 않는다** — 다음 `updateContentForTab` 이 있어야 재예약된다.
  fix_direction: "`saveFile` 이 주어진 paneId 에서 못 찾으면 전 패널을 훑거나, `scheduleAutosave` 가 paneId 를 얼리지 않는 방향. **처방은 확정하지 않는다**"
F3:
  q: "마이그레이션 역방향 — 구버전 앱으로 되돌아가면"
  verdict: "✅ **안전. 조치 불필요**"
  reasoning: >
    구버전 파서는 `editor: { ...DEFAULT_SETTINGS.editor, ...parsed.editor }` 였다.
    새 앱이 `autosaveDelay` 를 결과 객체에서 빼므로 구버전은 그 키가 **없는** 파일을 읽는데,
    스프레드가 **구버전 기본값 3000ms 로 자연히 폴백**한다 — 크래시도 undefined 도 없다.
    그리고 **구버전에는 `autosaveDelay` 소비자가 애초에 0건이었다**(R2 의 존재 이유가 그것이다) —
    값이 무엇이든 아무 동작도 하지 않는다.
    역으로 새 키 `autosaveLevel` 은 구버전의 `...parsed.editor` 스프레드에 실려 **왕복 보존**된다.
F4:
  q: "`erd/model/settings.ts` 삭제 — 소비자 0 과 부수 영향"
