spinoff_defects:
  - id: "미부여 (신규)"
    symptom: "`---`(수평선) 라인을 ArrowUp 으로 통과할 때 그 줄을 건너뛴다. ArrowDown 은 정상."
    evidence: >
      헤딩이 전혀 없어 drift 가 0 인 문서(alpha/beta/---/gamma/delta)에서도 재현:
      down = 1->2->3->4->5 정상, up = 5->4->2 (line3 '---' 건너뜀).
      즉 height map 불일치와는 다른 축이며 본 수정으로 생긴 것이 아니다.
    likely_cause: >
      `posAtCoords()` 의 라인 패딩 회피 루프(view/dist §3786)가
      `coordsAt(block.from, 1)` 로 얻은 위젯 렌더 박스를 본다.
      `.cm-hr-widget`(inline-block) 안의 `.cm-hr-line` 은 height 1px 라
      rect.top 이 라인 박스 위쪽보다 한참 아래에 있어 "패딩에 착지했다"고 오판하고
      그 블록을 통째로 건너뛴다.
