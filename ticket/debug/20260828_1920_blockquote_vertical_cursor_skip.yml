# ━━━
root_cause_hypotheses:
  - id: "H3 (최우선)"
    claim: "커서 위치 의존 데코레이션 — BlockquoteDecorator.ts:50 이 '커서가 있는 줄에만 > 마커를 노출'한다. 따라서 수직 이동 1회마다 출발 줄은 마커가 숨겨지고(-2자) 도착 줄은 드러나(+2자) 양쪽 줄의 가시 콘텐츠가 동시에 변한다. CodeMirror 의 goal column 은 이동 직전 좌표로 측정되는데, 그 좌표계가 같은 업데이트 사이클에서 무효화된다."
    fits_asymmetry: "도착 줄이 위쪽에서 2자 늘어나면 이미 측정된 기준이 함께 밀리므로 ArrowUp 이 더 취약하다는 보고와 부합한다."
  - id: "H1"
    claim: "위젯 없는 라인 선두 치환 — BlockquoteDecorator.ts:6 의 Decoration.replace({}) 는 폭 0 치환이며 위치가 정확히 column 0~2, 즉 수직 이동이 캐럿을 놓는 자리와 겹친다. 2026-08-11 파동은 '위젯을 가진' 데코레이터만 교정했고 위젯 없는 치환은 대상이 아니었다."
  - id: "H2"
    claim: "bidiIsolate: false 미지정 — BUG-20260811-08 이 'Y축 측정 오류' 해결책으로 지정한 옵션이 블록쿼트에만 누락되어 있다. Heading/List/Checkbox 는 모두 명시하고 있다."
  - id: "H4 (보조)"
    claim: "'>' 단독 줄은 markerEnd == line.to 이므로 줄 전체가 치환되어 시각적 빈 줄이 된다(BlockquoteDecorator.ts:51). 빈 줄 통과 시 스킵이 발생하는 고전적 케이스."
  - id: "공통"
    claim: "orchestrator 에 EditorView.atomicRanges 등록이 없어 캐럿이 숨겨진 치환 구간 내부에 머무를 수 있다."
