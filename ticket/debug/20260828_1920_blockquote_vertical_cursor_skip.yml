architecture_guidelines:
  - "Measurement Stability: 캐럿 이동 중에 가시 콘텐츠 길이가 변하는 데코레이션은 수직 이동을 깨뜨린다. 마커 노출 정책은 '커서 라인' 단위가 아니라 최소한 '블록쿼트 구간' 단위여야 한다."
  - "Consistent Replace Options: 라인 선두를 치환하는 모든 데코레이터는 bidiIsolate:false 를 명시한다(2026-08-11 규약)."
  - "Atomic Hidden Ranges: 숨긴 구간은 EditorView.atomicRanges 로 캐럿 진입을 막는다."
  - "No Silent Regression: 수정 후 리스트·체크박스·헤딩·코드블록의 수직 이동에도 회귀가 없는지 함께 확인한다."
