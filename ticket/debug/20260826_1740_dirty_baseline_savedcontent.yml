bug_report:
  symptom: "① 동일 내용을 다시 방출하는 경로가 실행되면 디스크는 여전히 옛 내용인데 dirty 점이 사라진다. ② 편집 후 Undo 로 저장 시점 텍스트로 되돌려도 dirty 가 해제되지 않는다."
  cause: "hasChanged = content !== rawContent 로, 비교 대상이 '마지막으로 저장된 내용'이 아니라 '직전 인메모리 값'이다. 저장 기준선(savedContent)이 어디에도 보관되지 않는다."
  location:
    - "project/src/entities/document/model/store.ts:523 (updateContentForTab)"
    - "project/src/entities/document/model/store.ts:568 (updateContent)"
    - "project/src/entities/document/model/store.ts:updateNodeCoordinate (전역 isDirty 만 갱신, 탭 isDirty 미갱신)"
# ━━━
architecture_guidelines:
  - "Baseline, Not Delta: dirty 판정 기준은 항상 '마지막 디스크 반영 내용'이다. TabItem 이 그 기준선을 보유한다."
  - "One Writer: 패널/탭 dirty 플래그 갱신은 _setTabDirty(tabId, dirty) 단일 헬퍼를 통해서만 수행한다."
  - "Coordinate Drag Parity: 마인드맵 좌표 변경도 문서 변경과 동일하게 탭 dirty 마커를 켠다."
# ━━━
