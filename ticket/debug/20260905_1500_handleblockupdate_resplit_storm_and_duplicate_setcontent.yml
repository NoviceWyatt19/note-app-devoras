related:
  - id: "자동 테스트 커버리지 갭"
    detail: >
      `handleBlockUpdate` 는 `BlockEditor` 컴포넌트 클로저 안에 있고 여러 실 CodeMirror
      인스턴스가 얽혀 있어, 이 경로만 겨냥한 T1.5/T2 통합 테스트를 새로 만들려면 멀티 블록
      렌더 하네스가 필요하다(비용이 이 티켓 범위를 넘는다고 판단). 대신 실 브라우저 수동
      검증 + 기존 회귀 스위트 무회귀로 대체했다. 향후 멀티 블록 편집 경로에 자동 테스트가
      쌓이면 이 지점도 자연히 커버될 것.
  - id: "정량 재측정 미실시"
    detail: >
      8-D 조사(§5.16)가 관측한 200-블록 폭주 자체는 이 디바운스로 "줄어들지" 않는다 —
      한 번의 대량 붙여넣기는 여전히 한 번의 호출이라 디바운스가 그 안의 비용을 줄이지
      못한다. 이 수정이 실질적으로 돕는 것은 **연속된 개별 헤딩 변경 편집**(타이핑 도중
      여러 번 헤딩을 넘나드는 경우)의 반복 재분할을 1회로 합치는 것이다. 8-D 게이트
      자체는 동결 상태(PM-20260904-01)라 이 차이를 정량적으로 다시 재는 것은 이 티켓
      범위 밖으로 판단했다.
