problem:
  location: "project/src/widgets/BlockEditor/ui/BlockEditor.tsx:601-675 (수정 전 라인 번호)"
  s1_root_cause: >
    `handleBlockUpdate` 가 헤딩 개수 변화(`oldHeadingCount !== newHeadingCount`)를 감지하면
    디바운스 없이 그 자리에서 `resolveBlocksFromContent`(O(N) 2-패스 재매칭)를 태우고,
    새로 생긴 헤딩마다 React 가 새 `CodeMirrorBlock`(=새 `EditorView`)을 마운트했다.
    8-D 조사(§5.16)가 N=200 픽스처를 한 블록에 붙여 직접 관측: 블록 레지스트리 4→204.
    A6 원 관측("동시 생존 EditorView 개수", 지수 1.763)과 같은 기전이 파일 열 때가 아니라
    편집 도중 재현된다.
  s2_root_cause: >
    같은 함수 안에서 `setContent(merged)` 를 완전히 같은 인자로 두 번 호출(:645, :669).
    두 번째는 no-op 이 아니다 — 첫 호출이 `get().blocks` 를 이미 바꿔 놨으므로, 두 번째는
    *갱신된* blocks 상대로 2-패스 매칭을 처음부터 다시 돈다. 헤딩 수가 바뀌는 모든 편집마다
    같은 O(N) 작업이 두 배로 돈다.
  user_impact: "헤딩이 여러 개 늘어나는 붙여넣기·연속 타이핑에서 비례해 발생. 201개는 비현실적이지만 10~20개는 일상적이다."
# ━━━
fix:
  s1_approach: >
    `syncContent` 와 같은 패턴으로 새 디바운스 콜백(`debouncedResplit`, 150ms)을 추가해
    재분할(`setContent`)·캐럿 재배치(`focusBlock`)·`updateContentForTab` 을 그 안으로 옮겼다.
    `updateBlockContent(id, text)`(블록 자신의 내용 갱신)는 그대로 동기 실행 — 타이핑
    반응성은 그대로다. 바뀌는 것은 "블록이 몇 개로 쪼개져 보이는가"가 최대 150ms 늦게
    반영되는 것뿐이다. 짧은 시간 안에 헤딩이 연달아 바뀌어도(예: 붙여넣기 직후 계속 타이핑)
    재분할은 마지막 호출 기준 1회만 돈다(`useDebouncedCallback` 의 "최신 인자로 발화" 특성).
  s1_caret_safety_note: >
    디바운스로 옮겨도 캐럿 계산이 틀어지지 않는다 — `absoluteCursorPos` 계산은 대상 블록
    자신이 아니라 **그 앞의 형제 블록들** 길이 합에만 의존하는데, 형제 블록은 이 편집으로
    바뀌지 않으므로 마지막 호출의 `blocksBeforeUpdate`/`cursorOffset` 을 그대로 써도 정확하다.
    실 브라우저로 검증(헤딩 삽입 후 커서가 삽입한 텍스트 끝에 정확히 위치).
  s2_approach: "두 번째 `setContent(merged)` 호출(:669, 수정 전 라인)을 제거. 첫 호출만 유지."
  cleanup_scope_note: "리라이트가 아니다 — 디바운스 추가 + 중복 호출 제거 두 가지만. 다른 로직 변경 없음."
