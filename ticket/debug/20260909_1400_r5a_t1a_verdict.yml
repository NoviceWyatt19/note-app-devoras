pm_concern_resolved:
  concern: >
    PM `2df9a99` §scope_correction_20260909: 「`erd.css` 변수 9개가 Tailwind 와 바이트 동일 중복이라고
    두 번 썼는데 틀렸다 — **3개만 일치, 6개가 다르다**」 → **T1a 토큰 스케일이 그 6개를 포함하는가?
    안 포함하면 T1c 에서 ERD 화면 색이 바뀐다.**
  answer: "✅ **포함한다. 우려는 실현되지 않는다.**"
  why: >
    정정 자체는 맞다 — `erd.css` 값 6개는 **Tailwind 팔레트 6색과** 다르다.
    그러나 **T1a 의 토큰 스케일은 Tailwind 팔레트가 아니라 그보다 넓다**(32개 대 6개).
    Tailwind 와 다른 값들이 별도 토큰으로 이미 들어와 있다.
  mapping:
    - "`--background-primary` #0d0e12 → `--surface-0-rgb`"
    - "`--background-secondary` #111216 → `--surface-1-rgb`  ← Tailwind 에 없던 값"
    - "`--background-modifier-border` #272a37 → `--border-1-rgb`"
    - "`--text-normal` #e2e8f0 → `--text-1-rgb`  ← Tailwind 에 없던 값"
    - "`--text-muted` #64748b → `--text-4-rgb`  ← Tailwind 에 없던 값"
    - "`--text-accent` #6366f1 → `--accent-0-rgb`"
    - "`--background-modifier-error` rgba(239,68,68,.15) → `--danger-bg-rgb`  ← Tailwind 에 없던 값"
    - "`--text-on-accent` #f87171 → `--danger-rgb`  ← Tailwind 에 없던 값"
  extra: >
    **`--font-monospace` 는 색이 아니다** — PM 이 센 「9개」는 색 8 + 폰트 1 이다. 색 기준으로는 8종이고
    **8종 전부 토큰 대응이 있다.**
  t1c_gap_scan: >
    한 걸음 더 확인했다 — **T1a 시점 `index.css`(토큰 정의부 제외) 와 `erd.css` 의 모든 hex 를
    토큰 스케일과 대조한 결과 미포함 0건.** T1c 는 새 토큰을 만들 필요가 없다.
