new_finding:
  id: "⚠️ `--text-on-accent` 는 **이름이 틀렸다.** 값·역할은 맞다"
  where: "`erd.css:9` 정의 · `:60` 사용"
  first_read_was_wrong: >
    **계획 세션이 처음 「값은 같은데 의미가 반대다」로 적었다가 사용처를 보고 철회했다.**
    `:55-61` 의 `.erd-alert` 는 `background: var(--background-modifier-error)`(빨강 15%) 위에
    `color: var(--text-on-accent)`(#f87171 빨강)를 쓴다 — **에러 알림**이다.
    즉 이 변수의 실제 역할은 「강조 배경 위 글자색」이 아니라 **「에러 텍스트」**이고,
    T1a 가 `--danger-rgb` 로 대응시킨 것은 **값도 역할도 맞다.**
  actual_risk: >
    위험은 값이 아니라 **이름**이다. `--text-on-accent` 라는 이름만 보고 T1c·T6 에서
    **accent 계열 토큰(`--accent-0-rgb` 등)으로 매핑하면 에러 알림 글자가 보라색이 된다.**
    이름 기준 매핑이 정확히 이 변수에서 깨진다.
  recommendation: >
    T1c 의 치환 기준을 **이름이 아니라 실제 사용처의 역할**로 못 박을 것.
    가능하면 이 변수를 `--text-error` 로 개명하는 편이 낫다 — 소비자가 `:60` 한 곳뿐이라 비용이 거의 없다.
  severity: "낮음(현재 무증상) · T1c 착수 전에 한 줄 주의로 충분하다"
preexisting_defects:
  - id: "`bg-darkPanel/97` — 죽은 클래스 (Impl 보고 확인)"
    where: "`MindView.tsx:114`"
    fact: >
      Tailwind 기본 opacity 스케일에 **97 이 없어** 규칙이 생성되지 않는다. **기준선에서도 동일** —
      T1a 가 만든 것이 아니다. Impl 의 보고가 정확하다.
    impact: "그 패널에 **배경이 아예 안 깔린다.** `backdrop-blur-sm` 만 걸려 있어 육안으로는 흐릿하게 보여 눈치채기 어렵다"
    fix: "`bg-darkPanel/[.97]`(임의값 문법) 또는 스케일 내 값(`/95`)으로. **R5-a 와 무관한 별건 티켓**"
# ━━━
conclusion: >
  **T1a 는 통과다.** 「순수 리팩터 · 화면 변화 0」 주장이 두 축 모두에서 유지된다 —
  값은 hex 대조로, 무수정은 diff 로 확인했다. Impl 레인이 컴파일 출력 전문 대조까지 해 둔 것도
  이 판정을 받쳐 준다(계획 세션은 그 위에서 값·범위·경계를 봤다).
  **결함 없음.** 위 두 건은 각각 「향후 주의」와 「기존 결함」이지 이 커밋의 하자가 아니다.
