claim_1:
  claim: "「화면 변화 0 — 다크 값은 전부 현행 코드에서 추출」"
  verdict: "✅ **통과**"
  method: "토큰 블록의 RGB 트리플릿을 주석에 병기된 hex 로 각각 역산해 대조(스크립트)"
  result:
    - "토큰 **32개** — 커밋 메시지 주장과 일치"
    - "hex 가 병기된 **25개 전부 정확히 일치.** 불일치 0"
    - "기존 Tailwind 6색 매핑도 전부 **바이트 동일**: `darkBg`→`surface-0`(#0d0e12) · `darkPanel`→`surface-3`(#161821) · `darkBorder`→`border-1`(#272a37) · `primary`→`accent-0`(#6366f1) · `accent`→`accent-alt`(#14b8a6) · `mutedText`→`text-3`(#94a3b8)"
claim_2:
  claim: "「이름 유지 → 사용처 259곳 무수정 전환」"
  verdict: "✅ **통과 — 개수가 아니라 구조로 확인했다**"
  method: >
    개수 대조가 아니라 **커밋이 무엇을 건드렸는지**로 봤다.
    `git show b38e8a1 --name-only | grep -E '\.tsx?$'` → **결과 0건.**
    `.ts`/`.tsx` 를 한 줄도 안 건드렸으므로 사용처가 몇 개든 **전부 무수정**이다.
  count_note: >
    참고로 개수 실측은 **266** 이 나온다(`[a-zA-Z-]+-(darkBg|darkPanel|darkBorder|primary|accent|mutedText)(/[0-9]+)?`
    on `.ts`+`.tsx`; darkBg 29 · darkPanel 32 · darkBorder 72 · primary 87 · accent 1 · mutedText 45).
    보고된 259 와 7 차이는 정규식 범위 차이로 보인다. **판정에는 영향 없다** —
    「무수정」은 개수가 아니라 diff 로 증명되기 때문이다. 숫자를 문서에 남길 때만 어느 쪽인지 정하면 된다.
