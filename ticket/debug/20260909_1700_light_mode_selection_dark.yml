# ━━━
update: "2026-09-09 17:00"
project_ref: "PRJ-DEVORAS-MVP"
subject: "라이트 모드에서 드래그 선택 영역이 어둡게 하이라이트된다 — `color-scheme` 미선언"
status: "제기 — **사용자 실기 확인 (2026-09-09)**"
severity: "P2 — 라이트 모드 상시 노출. R5-a 산출물의 첫 실기 결함"
found_by: "사용자 (R4 실기 검증 중)"
report: "「드래그하면 해당 영역이 어둡게 하이라이트되더라. 아마 다크 모드 잔재인 것 같다」"
# ━━━
root_cause:
  what: "**`color-scheme` CSS 속성이 저장소 어디에도 선언돼 있지 않다.**"
  verified: "`grep -rn 'color-scheme' src ../index.html` → 선언 0건. 주석과 `@media (prefers-color-scheme)` 쿼리만 있다"
  mechanism: >
    `color-scheme` 이 없으면 브라우저는 **UA 가 그리는 표면**(텍스트 선택 하이라이트 · 스크롤바 ·
    폼 컨트롤)을 **OS 설정 기준**으로 렌더한다. 페이지를 라이트로 칠해도 **선택 영역만 OS 다크 기본값**이
    그대로 나온다. 「다크 모드 잔재」라는 사용자 표현이 정확하다 — 실제로 다크 잔재이고,
    **우리 CSS 가 아니라 UA 가 칠한 것**이다.
  why_not_caught: >
    **토큰 이관으로는 절대 잡히지 않는다.** 우리가 칠하지 않은 색이라 컴파일 출력 대조에도,
    값 환원 전문 비교에도 안 나온다. **실기에서만 보인다** — R4 를 사람에게 넘긴 것이 이걸 잡았다.
# ━━━
fix:
  primary:
    what: "`color-scheme` 을 테마와 함께 선언한다"
    where: "`project/src/app/styles/index.css`"
    code: |
      :root { color-scheme: dark; }
      :root[data-theme="light"] { color-scheme: light; }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]) { color-scheme: light; }
      }
    effect: "선택 하이라이트뿐 아니라 **스크롤바·폼 컨트롤**도 함께 맞는다"
  secondary:
    what: "`::selection` 을 토큰으로 명시해 UA 의존을 없앤다"
    code: |
      ::selection { background: rgb(var(--accent-rgb) / 0.30); }
    why: >
      `color-scheme` 만으로는 **UA 기본색에 맡기는 것**이라 브라우저·OS 마다 다르게 나온다.
      명시하면 양 테마에서 결정적이고, 앱 강조색과도 맞는다.
    caution: >
      CodeMirror 가 `drawSelection` 확장을 쓰면 선택이 `.cm-selectionBackground` **div** 로 그려져
      `::selection` 이 적용되지 않는다. **에디터 영역에서 실제로 먹는지 확인**하고, 안 먹으면
      `.cm-selectionBackground` 도 같은 값으로 지정할 것
