problem:
  location: "project/src/widgets/BlockEditor/ui/BlockEditor.tsx — handleBlockUpdate 의 헤딩 재분할 분기"
  code: |
    const nextFlatBlocks = flattenTree(getFreshBlocks());
    let accumulated = 0;
    let targetId = nextFlatBlocks[nextFlatBlocks.length - 1].id;  // ← 빈 배열이면 undefined.id 로 throw
  root_cause: >
    `resolveBlocksFromContent` 로 재분할한 결과(`getFreshBlocks()`)가 빈 배열이면
    `nextFlatBlocks[nextFlatBlocks.length - 1]` 이 `undefined` 이고 `.id` 접근이 TypeError.
    이 코드는 f4d5d69(S1) 이전부터 있던 형태 그대로다 — S1 이 디바운스로 옮겼을 뿐 만든 게
    아니고, 이번 되돌림으로 원래 위치(동기 경로)로 돌아갔다.
  reachability: "미확인. 정상적인 편집으로 blocks 가 빈 배열이 되는 경로를 계획 세션도 특정하지 못했다 — 그래서 이번엔 고치지 않는다."
