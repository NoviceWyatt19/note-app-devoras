# ━━━
bug_report:
  symptom: |
    코드펜스 `|title|="제목"` 의 타이틀이 블록을 편집(포커스)하는 순간 사라진다.
    블록이 포커스되지 않은 동안에는(renderBlockToHtml 경로) 정상 표시되므로
    "작업을 시작하면 타이틀이 사라진다"로 관측된다.
    실제로는 타이틀뿐 아니라 헤더의 언어 라벨과 'Copied!' 피드백도 함께 0×0 으로 렌더된다.
  cause: |
    BlockEditor 의 editorThemeCompartment 에 있는
    `'.cm-line *': { fontSize: 'inherit', lineHeight: 'inherit', verticalAlign: 'baseline' }`
    가 원인이다. CodeMirror 테마는 셀렉터에 테마 클래스를 붙여 `.ͼN .cm-line *` 로 컴파일되므로
    명시도가 (0,2,1) 이다. 위젯 내부에 붙은 일반 CSS 클래스(.cm-heading-badge 등)와
    Tailwind 유틸리티(text-[11px] 등)는 (0,1,0) 이라 **전부 패배**한다.

    피해는 두 갈래다.
    ① 0 으로 붕괴 — 코드블록 헤더가 놓이는 라인은 orchestrator 의 baseTheme 에서
       `.cm-code-block-widget-line { font-size: 0 !important; line-height: 0 !important }`
       를 받는다. `.cm-line *` 가 자손 전체를 `inherit` 으로 만들므로 위젯 서브트리가
       통째로 0px 를 상속한다 → 텍스트가 0×0. (헤더 바 자체는 padding 으로 35px 유지되어
       "빈 바"만 보인다.)
    ② 조용한 크기 덮어쓰기 — index.css 에 정의된 위젯 타이포그래피가 에디터 기본 폰트로 대체된다.

    도입 시점: `ce6b96c` (0.6.1, 2026-08-18) "normalize inline widget font sizes".
    코드블록 타이틀 기능(`9015c50`, 2026-08-13)보다 **나중**에 들어왔으므로 명백한 회귀다.
    당시 의도는 인라인 위젯이 line-height 를 흔들어 헤딩 생성 시 캐럿이 튀는 문제를 막는 것이었다.
  measured:
    - "코드블록 헤더 언어 라벨  text-[11px] → 0px (0×0)"
    - "코드블록 헤더 타이틀    text-[12px] → 0px (0×0)  ← 신고된 증상"
    - "헤딩 배지 .cm-heading-badge  0.65rem(10.4px) → 14px"
    - "이미지 캡션 .cm-image-caption 0.85em(11.9px) → 14px"
    - "H1 .cm-h1  35px → 14px  ← 0.8.8 에서 넣은 H1 디자인이 Write Mode 에서 미적용"
    - "인라인 코드 .cm-inline-code 0.88em → 12.32px  ✅ 유일한 생존자"
  variant_measurements: |
    4개 후보안을 실제 브라우저에서 격리 계측한 결과(상세: claude-history/impl/IMPL_PLAN_20260826_2349_widget_typography.md §4):
      A 현행                     — 타이틀 0px/0×0. 라인높이 평문19.6 H1 19.6 H2 19.6 체크박스19.6
      B 리셋 제거만              — 타이틀 12px 이나 rect 43×0 (line-height:0 상속) → 화면상 여전히 안 보임. 함정.
      C 리셋 제거 + 표적 정규화  — 전 항목 정상이나 H1 라인 19.6→49, H2 19.6→24.5 (0.6.1 억제 대상 재발 위험)
      D 리셋 유지 + baseTheme 재선언 — 헤더 전 항목 정상, 라인 높이 현행과 완전 동일 → 채택(Stage 1)
    ※ B 때문에 하네스는 fontSize 뿐 아니라 getBoundingClientRect().height > 0 을 반드시 검사해야 한다.
  discriminator: |
    `.cm-inline-code` 만 살아남는 이유가 해법을 가리킨다.
    이 클래스는 orchestrator 의 `EditorView.baseTheme({'&.cm-editor .cm-inline-code': …})` 로
    정의되어 `.ͼ1.cm-editor .cm-inline-code` = (0,3,0) 이 되고 `.cm-line *` (0,2,1) 을 이긴다.
    즉 **baseTheme 로 정의된 위젯 스타일은 이기고, 일반 CSS/Tailwind 클래스는 진다.**
  location:
    - "project/src/widgets/BlockEditor/ui/BlockEditor.tsx:115-119 (reconfigure 쪽 `.cm-line *`)"
    - "project/src/widgets/BlockEditor/ui/BlockEditor.tsx:225-229 (초기 생성 쪽 `.cm-line *` — 동일 리터럴 중복)"
    - "project/src/shared/lib/editor/decorators/orchestrator.ts:152-159 (.cm-code-block-widget-line font-size:0)"
    - "project/src/shared/lib/editor/decorators/impl/CodeBlockDecorator.ts:240-262 (헤더 위젯 — Tailwind 유틸로 타이포그래피 지정)"
    - "project/src/app/styles/index.css:181 (.cm-heading-badge), :192 (.cm-h1), :251 (.cm-image-caption)"
