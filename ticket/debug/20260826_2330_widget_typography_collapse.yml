architecture_guidelines:
  - "Widget Styles Belong to the Theme: CodeMirror 위젯의 타이포그래피는 index.css 나 Tailwind 유틸이 아니라 decorationBaseTheme 에 정의한다. 명시도 싸움에서 이기는 유일한 계층이다."
  - "No Blanket Selectors Inside .cm-line: `*` 리셋은 데코레이터 시스템 전체를 인질로 잡는다. 리셋 대상은 CodeMirror 가 직접 만드는 하이라이트 토큰으로 한정한다."
  - "Collapsed Lines Must Not Cascade: 라인 높이 붕괴용 font-size:0 은 위젯 루트에서 명시적 폰트 크기로 차단되어야 한다. 상속으로 새어나가면 안 된다."
  - "Single Source for the Theme: 테마 리터럴이 두 군데(초기/reconfigure) 복제되어 있다. 한쪽만 고치면 설정 변경 전까지 증상이 남는다. 상수로 추출할 것."
  - "Do Not Regress 0.6.1: 원래 목적(인라인 위젯이 line-height 를 흔들어 캐럿이 튀는 문제)은 반드시 유지되어야 한다. 리셋을 제거만 하는 수정은 금지."
