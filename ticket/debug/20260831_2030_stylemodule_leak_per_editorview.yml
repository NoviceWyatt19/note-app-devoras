# ━━━
problem:
  root_cause: >
    `@codemirror/view` 의 `EditorView.theme()` 은 **호출마다** `StyleModule.newName()` 으로 새
    프리픽스와 새 StyleModule 을 만든다(`node_modules/@codemirror/view/dist/index.js:8728` 확인).
    `BlockEditor.tsx:229` 가 `createEditorTheme(settings.editor)` 를 **EditorView 생성 이펙트 안**
    에서 호출하므로 **블록 하나당 StyleModule 하나**가 생성된다.
  location:
    - "project/src/widgets/BlockEditor/ui/BlockEditor.tsx:229 — 생성 경로"
    - "project/src/widgets/BlockEditor/ui/BlockEditor.tsx:144 — 설정 변경 시 reconfigure, 같은 문제"
    - "project/src/widgets/BlockEditor/ui/BlockEditor.tsx:86 — createEditorTheme 정의"
  measured:
    - "인스턴스당 `<style>` **+525자**, 단조 증가"
    - "`EditorView.destroy()` 후에도 줄어들지 않음 — 제거 경로가 없다"
    - "누적 360 create-destroy 사이클까지 증가 확인"
    - "N=200 이면 마운트에 200개, 설정을 한 번 바꿀 때마다 200개 추가"
  performance_impact: >
    A6 판별 측정에서 테마를 얹은 조건의 절대 비용이 **약 50% 증가**했다(N=100 에서 614→903ms).
    다만 **성장 지수는 오히려 낮았다**(1.82 → 1.54) — 즉 **상수 배수이며 A6 초선형의 원인이
    아니다.** A6 와 별개 과제로 다룬다.
  contrast: >
    같은 코드베이스의 `markdownDecorationPlugin` 과 `decorationBaseTheme` 는 **모듈 레벨에서 1회**
    생성돼 올바르게 공유된다. 한 파일 안에서 한쪽만 어긋나 있다.
# ━━━
fix:
  approach: "테마를 모듈 레벨로 호이스팅해 인스턴스 간 공유한다."
  complication: >
    `createEditorTheme(settingsEditor)` 는 **설정 의존**이다(폰트 크기·패밀리 등). 따라서 단순
    상수화가 안 된다. 두 갈래 —
    (a) 설정 조합을 키로 하는 캐시(같은 설정이면 같은 StyleModule 재사용),
    (b) 설정 의존 값을 **CSS 변수**로 빼서 테마 자체를 상수로 만들고 변수만 갱신.
  recommendation: >
    (b) 가 근본적이다 — 캐시는 설정 조합 수만큼 모듈이 쌓이는 구조를 남긴다. CSS 변수 방식이면
    설정 변경 시 `reconfigure` 자체가 불필요해져 `:144` 경로도 함께 소멸한다.
