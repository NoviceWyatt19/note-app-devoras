test_gap:
  claim: "커밋 메시지: 「`pnpm test:t1`/`test:t15`(caret_stability_harness 포함) 전량 통과」"
  why_it_proves_nothing_here: >
    `caret_stability_harness` 는 `decideCaretAction`(순수 함수)이 **「새 명령일 때만 focusOffset 을 적용한다」**
    를 검사한다. F1 은 **새 명령이 실제로 발행되고, 그 명령이 낡은 값을 싣고 있는** 것이다 —
    조정자 입장에서는 정당한 새 명령이라 **정확히 적용하는 것이 옳은 동작**이다.
    **하네스는 결함의 상류를 보지 않으므로 구조적으로 못 잡는다.** 통과는 이 변경의 근거가 되지 않는다.
    하네스 자신의 문서가 이미 적어 뒀다 — *「focusOffset 은 '지금 캐럿이 여기 있다'는 상태가 아니라
    '캐럿을 여기로 옮겨라'는 **명령**이다」*. S1 은 그 명령을 **150ms 전 값으로** 발행한다.
  recommendation:
    verdict: "**멀티 블록 렌더 하네스는 필요 없다.** 실행 세션의 「범위 밖」 판단은 결론은 맞고 이유가 틀렸다"
    cheaper_alternative: >
      F1 의 본체는 **순수 계산**이다 — `(얼어붙은 캐럿 인자, 발화 시점의 블록 목록) → (targetId, targetOffset)`.
      이걸 `caretCoordinator.ts` 처럼 **순수 함수로 추출**하면 T1(node:test)에서 바로 검사할 수 있다.
      **이 저장소에 선례가 있다** — `decideCaretAction` 이 정확히 이 컴포넌트에서 정확히 이 이유로 뽑혀 나갔다.
      필수 케이스: ①창 안에 같은 블록 추가 입력 ②창 안에 앞 형제 길이 변화 ③창 안에 앞 형제 병합/삭제
      ④`nextFlatBlocks` 빈 배열.
    note: "④는 기존 결함이다 — `nextFlatBlocks[nextFlatBlocks.length - 1].id` 가 빈 배열에서 터진다. S1 이 만든 게 아니라 옮겨온 것이라 이 티켓의 수정 대상은 아니나, 함수를 뽑는 김에 같이 막는 게 싸다"
