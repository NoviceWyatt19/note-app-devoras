passed:
  - id: "A7 헤딩 정체성 — ✅ 통과"
    reason: >
      `buildHeadingId`(`shared/lib/headingId.ts:12`)는 `(label, parentKey, siblingCountMap)` 의
      **순수 함수**이고, `parser.ts:53` 과 `entities/block/model/store.ts:59` 가 둘 다 **본문에서만** 유도한다.
      디바운스는 **언제** 계산하느냐만 바꾸지 **무엇을** 계산하느냐를 바꾸지 않는다 —
      같은 본문이면 같은 id 다. 재분할이 늦어도 헤딩 id 가 다른 블록에 붙지 않는다.
      **`.devoras/spatial.json` 오염 위험 없음.**
  - id: "2-패스 매칭 불변식 — ✅ 통과"
    reason: >
      발화 시점에 `merged = getMergedContent()` 와 `setContent(merged)` →
      `resolveBlocksFromContent(merged, get().blocks)` 가 **같은 순간의 같은 세대**를 읽는다.
      「`get().blocks` 가 한 세대 낡은 채 매칭이 도는 구간」은 **생기지 않는다.**
      깨진 불변식은 매칭이 아니라 **캐럿**이다(F1) — 초점을 정확히 분리해 기록한다.
  - id: "S2 중복 `setContent` 제거 — ✅ 통과. **잠재 결함까지 고쳤다**"
    reason: >
      옛 코드의 두 번째 `setContent(merged)`(`:669`)는 순수 낭비가 아니었다.
      `resolveBlocksFromContent(merged, get().blocks)` 인데 첫 호출로 `get().blocks` 가 이미 바뀌었으므로
      **갱신된 blocks 를 상대로 2-패스 매칭을 다시 돌았다.** 그 사이에 `nextFlatBlocks` 에서 뽑아 둔
      `targetId` 를 **두 번째 호출이 무효화할 수 있었다** — 그러면 `focusBlock` 이 존재하지 않는 블록을 겨눈다.
      제거가 옳고, 「순수 낭비였다」는 커밋 메시지의 서술보다 **이득이 크다.**
