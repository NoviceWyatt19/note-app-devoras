# ━━━
F1:
  title: "🔴 **세대 혼합** — 본문은 최신, 캐럿 인자는 150ms 전 것"
  mechanism: >
    `useDebouncedCallback`(`shared/lib/useDebouncedCallback.ts:36`)은 호출마다 `argsRef.current = args`
    로 덮어쓰고 발화 시 **마지막 인자**를 쓴다. 그래서 `debouncedResplit` 안에서:
      - `merged = getMergedContent()` 는 **발화 시점의 최신 본문**을 읽는다
      - `cursorOffset` · `blocksBeforeUpdate` 는 **예약 시점(최대 150ms 전)에 얼어붙은 값**이다
    한 함수가 **서로 다른 두 세대의 상태를 읽는다.** 이것이 결함의 뿌리다.
  trigger: >
    `countHeadings` 는 `/^#{1,3} /` 라 **공백을 칠 때** 헤딩 수가 0→1 로 바뀐다(`#` 만으로는 안 바뀐다).
      1. `# ` 의 공백 입력 → `debouncedResplit(id, C0, blocks₀)` 예약, 타이머 150ms
      2. 150ms 안에 제목 첫 글자 입력 → 헤딩 수 불변 → `syncContent()` 만 탄다.
         **`debouncedResplit` 는 재호출되지 않으므로 인자도 타이머도 그대로다**
      3. 150ms 에 발화 → `focusBlock(targetId, targetOffset)`, 이때 `targetOffset` 은 C0 기준
      4. **캐럿이 방금 친 글자 앞으로 되돌아간다**
    헤딩 수를 **다시** 바꾸는 입력이 오면 인자·타이머가 갱신돼 자기교정된다 — 그래서 이 결함은
    「헤딩 수 변경 **1회** 뒤 150ms 안에 헤딩 수를 안 바꾸는 편집이 **1회 이상**」에서만 난다.
  reachability: >
    **높다.** 「`# ` 치고 제목 첫 글자」가 정확히 이 모양이다(120ms/자 속도면 창 안에 들어온다).
    더 확실한 경로: **공백 입력 후 150ms 안에 방향키로 다른 블록 이동** → `focusBlock` 이
    **포커스를 헤딩 블록으로 도로 뺏어온다.** 키보드 이동은 150ms 안에 충분히 일어난다.
  why_the_guard_does_not_help: >
    `BlockEditor.tsx:298-300` 주석이 **BUG-20260831-01** 을 적어 뒀다 —
    *「focusOffset 을 매 렌더 캐럿 정답으로 취급하면 일반 타이핑 중에도 뷰의 캐럿을 낡은 값으로 되돌린다」.*
    그 수정의 방어는 **「새 명령(focusToken 변화)일 때만 적용」** 이다.
    그런데 `debouncedResplit` 은 `focusBlock` 을 불러 **focusToken 을 진짜로 올린다.**
    조정자 입장에서 이건 정당한 새 명령이라 그대로 적용한다(`:311` `decision.type === 'apply'` →
    `view.dispatch({selection:{anchor}})`).
    **BUG-20260831-01 이 막은 문이 아니라 옆문으로 같은 실패가 들어왔다.**
F2:
  title: "🟠 창 안에서 형제 블록이 바뀌면 오프셋이 깨진다 (F1 과 같은 뿌리)"
  mechanism: >
    `absoluteCursorPos` 는 `blocksBeforeUpdate` 의 **앞 형제 블록 길이 합**으로 계산된다.
    실행 세션 논거(「형제는 이 편집으로 안 바뀐다」)는 **그 한 번의 편집에 대해서는 참**이다.
    그러나 디바운스가 **150ms 의 창**을 열었고, 그 안에서 형제는 바뀔 수 있다:
      - `handleMerge`(`:689`) → `mergeBlockWithPrevious` + `syncContent()` — **`debouncedResplit` 를 재호출하지 않는다.**
        앞 블록이 병합돼 사라져도 얼어붙은 `currentFlatBlocks` 에는 남아 있어 **길이 합이 과대**해진다
      - 앞 블록에서의 일반 타이핑도 같다(길이 변화가 스냅샷에 안 잡힌다)
    즉 PM 초점 3 「병합·삭제 포함 **모든** 경로에서 참인가」의 답은 **아니오**다.
    실행 세션이 실기 확인한 것은 「문단 중간에 새 헤딩 타이핑」 **한 케이스**뿐이다.
  note: "F1 과 뿌리가 같으므로 **F1 을 고치면 같이 닫힌다.** 별도 수정이 필요한 건 아니다"
