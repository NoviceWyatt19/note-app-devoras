why_it_hid_so_long: >
  R3 은 DEBUG_PLAN §8 에서 **한 번도 실행된 적이 없는** 게이트였다("R3·R4·R6~R9 미실행").
  또한 스토어 상태만 보면 항상 정상이라, 스토어 단위의 T1 하네스로는 원리적으로
  잡을 수 없다 — 뷰와 스토어의 **불일치**가 결함이기 때문이다.
