# ━━━
symptom: >
  블록 경계에서 Backspace 로 블록을 위 블록에 병합하면, 캐럿이 병합 지점에 남지 않고
  합쳐진 블록의 **맨 끝**으로 이동하며 에디터가 DOM 포커스까지 잃는다.
  스토어(`useBlockStore.focusOffset`)는 올바른 값(병합 지점)을 갖고 있는데
  화면의 EditorView 만 어긋나므로, 로그만 봐서는 정상으로 보인다.

measured_before_fix:
  fixture: "['# 첫 블록','','첫 블록 본문','','## 둘째 블록','','둘째 블록 본문']"
  action: "둘째 블록 offset 0 에서 실제 Backspace 키 입력"
  result:
    storeFocusOffset: 16      # 병합 지점 — 올바름
    viewCaret: 31             # 문서 끝 — 틀림
    viewHasFocus: false
    docLength: 31

root_cause: >
  `BlockEditor.tsx` 의 내용 동기화 이펙트가 문서를 **통째로 치환**한다:
    `changes: { from: 0, to: currentDoc.length, insert: block.content }`
  CodeMirror 는 치환 구간 *안* 에 있던 커서를 삽입된 텍스트의 **끝**으로 매핑한다.
  selection 을 함께 지정하지 않았으므로 캐럿이 문서 끝으로 끌려간다.

  게다가 캐럿 복원 이펙트(`[isFocused, focusOffset]`)는 **layout effect** 라
  내용 동기화(**passive effect**)보다 **먼저** 돈다. 즉 캐럿을 '아직 교체되지 않은
  옛 문서' 위에 놓은 뒤 문서가 갈리고, focusOffset 값 자체는 변하지 않았으므로
  이펙트가 다시 돌지도 않는다. 두 이펙트가 서로를 무효화하는 구조다.

  dispatch 계측으로 확정: 캐럿을 옮긴 트랜잭션은 단 하나이며
  `BlockEditor.tsx:234` 에서 나온 `{from:0,to:16,insert:"…"}` 였다
  (beforeSel 16 → afterSel 31, 그 시점 store focusOffset 은 16).

fix: >
  내용 치환 트랜잭션에 selection 을 **명시적으로 함께 지정**한다.
  이 블록이 포커스 대상이면 스토어의 의도(focusOffset)를, 아니면 이 뷰가 갖고 있던
  위치를 새 문서 길이에 맞춰 clamp 해 복원한다. 병합으로 형제 컴포넌트가 언마운트되며
  사라진 DOM 포커스도 같은 자리에서 회수한다(IME 조합 중이면 건드리지 않는다).
  focusOffset/isFocused 는 ref 로 읽어 의존성 배열을 오염시키지 않는다.

measured_after_fix:
  storeFocusOffset: 16
  viewCaret: 16
  caretMatchesStore: true
  viewHasFocus: true
  caretAtEnd: false

