# ━━━
bug_report:
  symptom: "블록 분할/병합/재정렬 직후 Cmd+V 이미지 붙여넣기가 아무 반응 없이 실패한다. 에디터를 한 번 클릭하면 다시 동작한다."
  cause: "CodeMirrorBlock 의 cleanup 이 조건 없이 setActiveEditorView(null) 을 호출한다. 블록은 setBlocksFromContent 마다 재생성되므로, 포커스를 쥐고 있지 않은 무관한 블록이 파괴될 때도 전역 포인터가 비워진다. useTauriInputManager 의 enabled 가 false 로 바뀌어 INSERT_IMAGE 커맨드가 무시된다."
  location:
    - "project/src/widgets/BlockEditor/ui/BlockEditor.tsx:229-233 (cleanup)"
    - "project/src/shared/lib/activeEditorView.ts"
    - "project/src/widgets/BlockEditor/ui/BlockEditor.tsx (useTauriInputManager enabled 조건)"
# ━━━
architecture_guidelines:
  - "Own What You Clear: 전역 싱글톤 포인터는 '자신이 그 값일 때만' 비운다."
  - "Cleanup Order: 포인터 정리를 view.destroy() 보다 먼저 수행해 파괴 도중 참조 비교가 어긋나지 않게 한다."
# ━━━
tasks:
  - "[ ] cleanup 을 if (getActiveEditorView() === view) setActiveEditorView(null) 로 가드"
  - "[ ] 가드 이후 view.destroy() 순서로 정리"
  - "[ ] 블록 분할 직후 이미지 붙여넣기가 즉시 동작하는지 확인"
