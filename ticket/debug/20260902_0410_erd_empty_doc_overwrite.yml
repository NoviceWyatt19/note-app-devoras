# ━━━
problem:
  location: "project/src/widgets/ErdDesigner/ui/ErdDesignerMainView.tsx:16-49"
  root_cause: >
    `useEffect` 가 `rawContent` 를 파싱한다. `JSON.parse` 가 던지면 `parseErdDocument` 로 재시도하고,
    그것도 던지면 `createEmptyErdDocument()` 를 만든 뒤 `needsUpdate = true` 로 표시한다.
    그리고 **`setRawContent(normalized)` 와 `useDocumentStore.getState().updateContentForTab(tab.id, normalized)`
    를 호출해 탭의 내용을 빈 문서로 교체하고 dirty 로 만든다.**
    즉 **읽기 실패가 쓰기로 이어진다** — 파싱할 수 없는 문서를 사용자에게 보여주지 않고 조용히 지운다.
  code: |
    } catch (e) {
      console.error("Failed to parse ERD JSON", e);
      try {
        finalDoc = parseErdDocument(rawContent);
        needsUpdate = true;
      } catch (err) {
        finalDoc = createEmptyErdDocument();   // ← 원본을 버린다
        needsUpdate = true;
      }
    }
    setDocument(finalDoc);
    if (needsUpdate) {
      const normalized = JSON.stringify(finalDoc, null, 2);
      setRawContent(normalized);                                    // ← 탭 상태 덮어쓰기
      if (tab?.id) useDocumentStore.getState().updateContentForTab(tab.id, normalized);
    }
  severity_calibration: >
    **외부 리뷰는 "영구 유실"이라 적었으나 한 단계 낮다.** `autosaveDelay` 설정이
    **소비자 없이 존재**하므로(아래 related 참조) 자동 디스크 쓰기가 일어나지 않는다.
    디스크 유실은 사용자가 `Cmd+S` 를 눌러야 성립한다.
    **그럼에도 P1 인 이유**: "손으로 고친 `.erd` 를 열었더니 빈 캔버스가 보인다 → 뭔가 잘못됐구나
    → 습관적으로 저장" 경로가 현실적이고, 그 시점에 원본은 이미 메모리에서 사라져 있어
    **되돌릴 수단이 없다.** 탭이 dirty 로 표시되므로 사용자는 자기가 뭔가 고친 줄 안다.
  additional: >
    빈 내용(`rawContent.trim() === ''`)일 때 빈 문서를 만드는 경로(:20-22)는 **정당하다** —
    새 파일 초기화다. 문제는 **파싱 실패 경로(:32-40)** 뿐이다. 둘을 구분하지 않은 것이 결함이다.
# ━━━
fix:
  approach: >
    파싱 실패를 **표시 상태**로 다루고 **쓰기를 하지 않는다.**
    1. `catch` 경로에서 `needsUpdate` 를 세우지 않는다 — `setRawContent`/`updateContentForTab` 미호출.
    2. 에러 UI 를 렌더한다: 원본을 잃지 않았음을 알리고, 원문(raw JSON)을 텍스트로 보여주거나
       "텍스트로 열기" 경로를 제공해 사용자가 직접 고칠 수 있게 한다.
    3. 빈 문서 생성은 `rawContent` 가 실제로 비었을 때만 유지한다.
  guard: "`setRawContent` 호출을 '사용자 편집' 또는 '빈 파일 초기화' 두 경우로만 제한한다. 읽기 실패는 절대 쓰기를 유발하지 않는다"
  note: "`useState<any>` / `onChange: (newDoc: any)` 의 `any` 도 같은 파일에 있으나(외부 리뷰 §3.3.2) 이 티켓 범위가 아니다 — `ErdDocumentV1` 로 좁히는 것은 별도 품질 항목"
