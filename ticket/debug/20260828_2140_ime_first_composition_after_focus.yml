# ━━━
bug_report:
  symptom: >
    한글 IME 입력이 **앱을 막 실행한 직후**, 그리고 **앱 창을 전환(포커스 이탈 후 복귀)한 직후**
    간헐적으로 실패한다. 한 번 실패한 뒤로는 같은 세션에서 정상 동작한다.
  reporter_words: "실행 직후나 창 토글 직후에 간혹 실패하고, 그 뒤로는 정상으로 돌아온다"
  significance: >
    R1 은 지금까지 "미검증"으로만 남아 있었다. 이 보고로 **조건부 실패**가 확정됐다.
    다만 지속 실패가 아니라 첫 입력 한정이라 심각도는 P2 로 둔다.
# ━━━
why_automation_cannot_catch_this:
  - "이 저장소에 연결 가능한 어떤 자동화 도구도 실제 조합(composition) 이벤트를 만들어내지 못한다 — 합성 이벤트는 IMK 경로를 타지 않는다."
  - "ime_isolation_harness.ts 는 T1 순수 로직 하네스라 '조합 래치가 onUpdate 를 막는가'만 검사한다. 포커스 전환 타이밍은 구조적으로 사정권 밖이다."
  - "따라서 이 건은 사람이 직접 입력해 확인하는 것 외에 방법이 없다."
# ━━━
investigation_leads:
  - id: "L1 — 첫 포커스 획득 시점의 조합 래치 상태"
    detail: >
      orchestrator.ts 의 ImeLatchPlugin 은 compositionstart/end 를 contentDOM 에 직접 건다.
      창 포커스가 없던 동안 마운트된 EditorView 라면, WebKit 이 첫 조합을 시작할 때
      래치가 아직 붙지 않았거나 이전 세션의 잔여 상태를 물고 있을 수 있다.
  - id: "L2 — 포커스 복귀 시 데코레이션 재계산과 조합의 경합"
    detail: >
      데코레이션 StateField 는 tr.selection 마다 전체 재계산한다.
      포커스 복귀가 selection 트랜잭션을 만들면, 조합 시작과 같은 사이클에서
      Decoration.replace 가 재적용되며 IMK 가 쥔 DOM 노드를 갈아치울 수 있다.
      BUG-20260810-02(텍스트 증식)와 같은 계열의 위험이다.
  - id: "L3 — 창 표시 타이밍"
    detail: >
      App.tsx 는 getCurrentWindow().show() 를 명시적으로 호출한다.
      show() 이전에 마운트된 웹뷰에서 document.hasFocus() 가 false 인 구간이 있고,
      그 구간에 잡힌 포커스가 IMK 와 어긋날 수 있다. 인수인계 문서 §7 이
      "document.hasFocus() 가 false 면 키 입력이 신뢰 불가"라고 기록한 것과 같은 축이다.
# ━━━
reproduction_protocol:
  - "1) 앱을 완전히 종료 후 재실행한다"
  - "2) 문서를 열고 **가장 먼저** 한글을 입력한다 → 조합이 깨지는지 관찰"
  - "3) 다른 앱으로 전환했다가 Devoras 로 복귀한 직후 **첫 한글**을 입력한다 → 관찰"
  - "4) 실패 시 devtools 콘솔에서 document.hasFocus(), view.composing, imeStateField 값을 즉시 확인"
  - "실패/성공 횟수를 세어 빈도를 기록할 것 — '간헐적'의 실제 비율이 원인 좁히기에 중요하다"
