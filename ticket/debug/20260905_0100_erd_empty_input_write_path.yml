    - "두 조건(문법 오류·구조 오류)을 나눴고, 구조 오류 케이스가 **옛 코드가 통과시키던 문서**(`{version:1,tables:[]}`)를 정확히 겨눈다"
    - "`ResizeObserver` 스텁을 넣는 대신 **캔버스를 마운트하지 않는 이른 반환 경로만** 검증하도록 설계했다 — 환경 한계를 우회하지 않고 인정했다"
  gaps:
    - "**빈 입력 분기에 테스트가 없다.** 유일하게 쓰기가 남아 있는 경로가 미검증이다"
    - "`isDirty === false` 는 **간접 프록시**다 — `updateContentForTab` 은 잡지만 `setRawContent` 단독 호출은 못 잡는다. 지금은 둘이 같은 분기라 무해하지만, 나중에 분리되면 테스트가 조용히 무력해진다. 탭 스토어의 `rawContent` 를 직접 단언하는 편이 낫다"
