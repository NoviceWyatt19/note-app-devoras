scope_note:
  status: "**철회 — 계획 세션의 오판이었다 (2026-09-05 정정)**"
  what_i_said: "스테이징의 `Cargo.toml`·`Cargo.lock`·`tauri.conf.json` 이 R3(출시 엔지니어링) 혼입이라 분리하라고 적었다"
  what_it_actually_was: >
    `aff36f5` 의 diff 를 확인한 결과 **전부 `0.9.1` → `0.9.2` 버전 범프**다(`package.json`·`Cargo.toml`·
    `tauri.conf.json` 세 곳이 버전 문자열을 공유한다). `package.json` 의 나머지 변경도 새 하네스를
    `test:t15` 에 등재한 것이라 **R1 산출물 자체다.** R3 혼입이 아니고 이 저장소의 정상 버전 규약이다.
  lesson: >
    **파일 이름만 보고 스코프를 판정했다.** `src-tauri/` 가 보이자 R3 로 읽었는데 diff 를 안 봤다.
    교차검증 세션이 diff 를 안 보고 판정한 것은 이 세션의 규율 위반이다 — 이번 사이클에서
    「보고를 믿지 말고 코드를 직접 확인한다」를 계속 적용해 놓고 정작 여기서 건너뛰었다.
