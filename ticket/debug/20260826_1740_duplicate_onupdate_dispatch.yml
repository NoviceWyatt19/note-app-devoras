architecture_guidelines:
  - "Single Update Path: 문서 변경 통지는 updateListener 하나로 일원화한다."
  - "Keep the Stronger Guard: updateListener 는 external 트랜잭션 필터와 IME 조합 가드(isImeComposingRef, view.composing)를 이미 갖추고 있어 input 핸들러의 상위 호환이다."
