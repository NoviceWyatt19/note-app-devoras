the_finding_that_shapes_this_ticket:
  headline: "**`implementation_plan.md` §3.9 의 처방을 그대로 쓰면 66곳이 조용히 깨진다**"
  evidence: >
    저장소에 설치된 `tailwindcss@3.4.19` 로 직접 컴파일해 확인했다.
    커스텀 색을 `'var(--accent-primary)'` 로 두면 `.bg-X` 는 생성되지만
    **`.bg-X/20`(불투명도 수식어)은 규칙 자체가 출력되지 않는다.** 에러도 경고도 없다.
    이 저장소에는 그런 수식어가 **66곳** 있다(`border-darkBorder/40` 14 · `text-mutedText/40` 10 ·
    `bg-primary/20` 9 · `bg-primary/10` 6 · 나머지 27).
  prescription: >
    토큰을 **RGB 채널 트리플릿**으로 저장하고 이름에 `-rgb` 접미사를 붙인다.
    `rgb(var(--accent-0-rgb) / <alpha-value>)` 형태면 두 유틸리티가 모두 정상 생성된다.
    **66곳 무수정**이다. §3.9 의 WARNING 이 제시한 대안(66곳을 손대는 방향)보다 싸고 안전하다
  action_required: "`implementation_plan.md` §3.9 에 이 정정을 표기할 것 — 그 문서만 읽은 세션이 같은 함정에 빠지는 것을 막는다"
