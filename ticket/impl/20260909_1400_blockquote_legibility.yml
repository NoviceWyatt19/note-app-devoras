# ━━━
update: "2026-09-09 14:00"
project_ref: "PRJ-DEVORAS-MVP"
subject: "읽기 모드 텍스트 시인성 — 인용문·본문을 리스트 텍스트 색으로 통일 (`--text-strong`)"
status: "**사용자 지시로 처방 확정·범위 확대 (2026-09-09 실기 확인)**"
severity: "P2 — **사용자가 실기에서 직접 보고**. 「라이트 모드에서 시인성이 크게 낮다」"
found_by: "Impl_worker_v1 (R5-a T6 확인 항목 ① 수행 중)"
# ━━━
problem:
  where: "`project/src/app/styles/index.css:315` `.rv-content blockquote`"
  what: >
    인용문 글자색이 `--text-faint` 다. 그 토큰은 **비활성·취소선 전용**으로 정의돼 있는데
    (`IMPL_PLAN_R5A_THEME_TOKENS.md` §4.2), 인용문은 **사용자가 읽는 본문 콘텐츠**다.
  measured:
    note: "실제 배경(`rgb(var(--accent-rgb) / 0.05)`) 위에서 측정"
    items:
    - "현행 `text-faint` — 다크 **3.91** · 라이트 **4.43**. 양쪽 다 본문 기준 **4.5:1 미달**"
    - "`text-muted` 로 올리면 — 다크 **7.26** · 라이트 **7.05**"
    - "`text-body` 로 올리면 — 다크 12.54 · 라이트 9.63 (인용문 특유의 「약한 강조」가 사라진다)"
  preexisting: >
    **R5-a 가 만든 것이 아니다.** 원래 하드코딩 `#64748b` 였고 T1b(`b11e9c8`)가 그 값을 그대로
    토큰화했다. 즉 다크 모드에서도 이전부터 3.91 이었다 — 라이트 모드 도입으로 **드러난** 것이지
    새로 생긴 것이 아니다.
# ━━━
why_not_fixed_in_r5a:
  - "R5-a 는 **값을 옮기는 작업**이지 기존 색 선택을 감사하는 작업이 아니다. 스코프를 넘으면 「무엇이 이관이고 무엇이 개선인가」가 섞인다"
  - "중단 경계에서 시각 변경을 넣으면 **검증 기회 없이 착지**한다. 이 세션은 워크스페이스 화면 육안 확인이 불가능했다"
  - "한 줄 수정이라 언제든 싸게 처리할 수 있다"
# ━━━
fix:
  decided_by_user: >
    **2026-09-09 실기 확인.** 「인용블록이나 평문기반 내용의 텍스트 색을 옅게 내던데
    그냥 **리스트 텍스트 색상과 같은 게** 좋은 것 같다. 다크 모드에서도 조금 불편했는데
    라이트 모드에서는 **시인성이 크게 낮더라**.」
  what_list_text_is: "쓰기 모드 `.cm-list-item`(`index.css:480`)이 `--text-strong` 을 쓴다. 그것이 기준이다"
  changes:
    - "`index.css:312` `.rv-content` — `--text-body` → **`--text-strong`** (읽기 모드 본문 전체)"
    - "`index.css:315` `.rv-content blockquote` — `--text-faint` → **`--text-strong`**"
  contrast_after:
    - "본문(base 위) — 다크 12.99 → **15.65** · 라이트 10.35 → **14.63**"
    - "인용문(accent/0.05 틴트 위) — 다크 3.91 → **15.10** · 라이트 4.43 → **13.61**"
  superseded: >
    내가 처음 권한 `text-muted`(7.26/7.05)는 **철회한다.** 「인용문은 본문보다 한 단 약한 것이 의도」라는
    가정으로 정한 값이었는데, **사용자가 그 가정 자체를 기각**했다. 실기에서 불편을 느낀 쪽이 기준이다.
  note: >
    본문이 `--text-strong` 이 되면 H2(같은 토큰)와 색이 같아진다. **크기·굵기로 위계가 남으므로 수용한다** —
    사용자가 명시적으로 가독성을 택했다.
