direction_change_20260909:
  user_statement: >
    「해당 앱은 local 에서 실행되는 앱이니 굳이 Actions 나 EC2 같은 **외부에서 서비스할 필요가 없는
    종류**다. 서비스를 한다면 **빌드된 앱을 제공하는 것뿐**이고, 업데이트되면 `.dmg` 로 배포한다.」
    + 「GitHub 은 **저장용**이다」
  what_survives: "**PM 이 세운 목적은 그대로다** — 하네스가 사람 기억에 의존하는 상태를 끊는 것, 반복 가능한 릴리스와 sha256"
  what_changes:
    - "Actions CI → **로컬 git hook**(husky)"
    - "Actions release.yml → **로컬 릴리스 스크립트** + `gh release create`"
  why: >
    워크플로는 원격에서 돈다. 사용자가 Actions 를 쓰지 않으면 **영영 실행되지 않는다** —
    게이트를 기계가 지키는 게 아니라 **지키는 척하는 파일**만 남는다. 그리고 이 프로젝트의 실패 이력
    (「심각한 결함 3건이 전부 리팩터가 만들었고 전부 자동 테스트를 통과했다」)은 **원격에 들어가기 전
    로컬에서** 걸렸어야 할 것들이다.
  workflows_are_deleted:
    what: "`.github/workflows/ci.yml` · `release.yml` 삭제"
    why: >
      남겨 두면 「CI 가 있다」는 **잘못된 신호**가 된다. 실제로는 아무도 게이트를 지키지 않는데
      다음 세션이 「CI 가 본다」고 가정한다. **작동하지 않는 안전장치는 안전장치가 아니라 오해의 원인이다**
    what_survives: "`check-version-sync.mjs` 는 남는다 — hook 과 릴리스 스크립트가 재사용한다"
# ━━━
measurements_that_shaped_the_design:
  note: "hook 배치는 실측 시간이 정했다"
  items:
    - "`check-version-sync.mjs` **33ms** → `pre-commit`. 체감 0"
    - "`tsc --noEmit` 1,788ms · `test:t1` 7,733ms · `test:t15` 6,837ms — 합 **약 16.4초** → `pre-push`"
    - "**16초를 매 커밋에 걸면 `--no-verify` 로 우회하게 된다.** 우회되는 게이트는 없는 게이트다"
    - "push 는 드물다 — 원격이 2026-09-02 에서 멈춰 있었고 로컬이 104 커밋 앞섰다. 거기서는 16초가 싸다"
    - "`gh` CLI **v2.100.0 설치돼 있음** → 로컬에서 릴리스 생성까지 가능"
    - "**husky 는 의존성에만 있고 작동한 적이 없다** — `.husky/` 없음, `core.hooksPath` 미설정, `prepare` 가 v9 문법인데 v8 설치라 usage 만 찍고 exit 0"
# ━━━
scope_closed_20260914:
  user_statement: >
    「**당장 배포할 계획은 없어.** 그러니 **github actions, release 같은 배포 기능,
    app store 등록 등의 배포 활동은 고려하지 마.**」
  effect: "**R3 의 배포 부분 전체가 스코프 밖.** E1'(릴리스 스크립트 실행)·태그·Homebrew·서명·공증·업데이터 전부 수행하지 않는다"
  what_survives:
    - "**로컬 git hook** — `pre-commit`(버전 4파일 동기, 33ms) · `pre-push`(tsc+t1+t15, 약 26초). 실측 검증 완료"
    - "`check-version-sync.mjs` — 훅이 재사용"
    - "`.github/workflows/` 삭제 완료"
    - "`scripts/release.mjs` — 파일은 남으나 **아무도 실행하지 않는다.** 명시적 호출로만 도는 스크립트라 해롭지 않다"
  pm_goal_met: >
    PM 이 R3 를 지시한 목적은 「하네스가 사람 기억에 의존하는 상태를 끊는 것」이었다.
    **훅 하나로 달성됐다.** 배포 인프라는 이 프로젝트에 애초에 필요하지 않은 것이었다 —
    로컬 데스크톱 앱이고 원격은 저장용이다.
  do_not_revive_without_user: "배포 관련 작업은 **사용자가 명시적으로 요청할 때만** 재개한다"
