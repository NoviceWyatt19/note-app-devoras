  measured: "`pnpm lint` → 124 problems (111 errors, 13 warnings). `no-explicit-any` 50 · `exhaustive-deps` 9 · 나머지 9"
  the_others_pass: "`tsc --noEmit` exit 0 · `test:t1` 92/92 · `test:t15` 16/16 — 전부 직접 실행 확인"
  why_it_matters: >
    **빨간 CI 는 CI 가 없는 것보다 나쁘다.** 없으면 사람이 기억이라도 하지만, 상시 빨간불은
    「원래 빨간 거」가 되어 진짜 실패를 가린다. 이 배치의 목적이 「하네스가 사람 기억에 의존하는
    상태를 끊는 것」인데 빨간 CI 는 그걸 정확히 반대로 달성한다.
  prescription: "통과하는 4종은 차단 게이트, `lint` 는 기준선 124 대비 비차단 비교(래칫). 0 이 되는 날 승격"
