the_question:
  restated: >
    `Decoration.line()` 만으로 **L2 카드 안에 L3 카드가 들어앉고, L2 의 좌/우 테두리가 L3 구간을
    관통해 연속되는** 그림이 나오는가.
  why_it_is_hard: >
    현행 카드는 **재귀 중첩 DOM** 이다 — `BlockEditor.tsx:398-459` 의 `BlockNode` 가 자기 안에
    `<div className="block-children">` 를 두고 자식 `BlockNode` 를 렌더한다.
    `Decoration.line()` 이 만드는 것은 **평면 형제 `.cm-line`** 들이라 중첩 관계가 DOM 에 없다.
    좌우 마진 누적 + 다중 `box-shadow`/의사요소 조합으로 흉내낼 수는 있으나 **검증된 바 없다.**
  why_the_precedent_does_not_hold: >
    `single_cm_transition.md` 원본이 선례로 든 `CodeBlockDecorator` 는 **중첩이 없는 단일 레벨**
    배경/모서리다. 같은 패턴이 아니다.
