tasks:
  - id: "T1 — 최우선"
    what: "§5.12 INP 폭주 판별 실험"
    why: >
      평시 ~64ms → 붙여넣기 시 ~3,800ms(누적 38,608ms), CLS 3.80. **Step 2 차단 사유.**
      §5.0.4 게이트가 마운트와 키 입력 1회만 쟀고 **대량 편집을 안 쟀다** — 게이트 설계의 구멍이다.
    how: >
      **처방을 먼저 쓰지 말 것(§3-C).** 가장 싼 판별부터:
      (1) H1 격리 — `SingleDocEditor.tsx:111-113` 의 디바운스 `syncContent` 에서 `setContent()` 만
          일시 무력화(`setRawContent` 대체 또는 no-op)하고 같은 붙여넣기 재측정.
      (2) 회복 없으면 카드 테마만 뺀 조건(H3, CLS 3.80 이 단서).
      (3) 그래도 미해결이면 Performance 프로파일 녹화로 함수 단위 귀속.
    hypothesis_h1: >
      `tabStore.ts:88-90` 의 `setContent` 가 매번 `resolveBlocksFromContent`(2-패스, 문서 전체) +
      `parseMarkdown`(문서 전체) 를 돌린다. **단일 CM 경로는 지금 새 오케스트레이터와 구 블록
      파이프라인 비용을 둘 다 낸다.** Step 1 이 의도적으로 `tabStore.blocks` 를 안 건드린 결과다.
    critical: >
      **H1 이 참이어도 "Step 2 하면 해결된다"로 넘어가지 말 것.** Step 2 는 되돌릴 수 없고,
      **되돌릴 수 있는 지금 재는 것이 훨씬 싸다.** 판별이 끝난 뒤 계획 세션이 판정한다.
  - id: "T2"
    what: "§5.11 마운트 하네스에 측정 규율 추가 후 재측정"
    why: >
      성장 지수가 **−0.934** 로 나왔다 — 음수는 "문서가 클수록 빨라진다"는 뜻이라 성립하지 않는다.
      N=50 이 첫 조건으로 콜드 실행돼 39.8ms(N=200 의 10.9ms 보다 4배 느림)를 먹었고,
      `:251` 이 그 오염된 첫 점에서 지수를 계산한다.
    how: "조건별 워밍업 1회 폐기 · 3회 반복 중앙값 · 조건 인터리브 (§5 규율, 8-C 하네스는 이미 지킨 것)"
    note: "**예산 판정은 뒤집히지 않는다**(최악값 39.8ms 도 7.5배 여유). 기록에 −0.934 를 남기지 않는 것이 목적이다"
  - id: "T3"
    what: "`vertical_motion` 에 카드 픽스처 추가"
    why: >
      §5.0.1 이 이 하네스를 **살린 유일한 이유**가 "카드가 얹힌 문서에서 `drift === 0`" 이다.
      현행 4 픽스처는 Step 6 시절 것이라 `BlockCardDecorator` 를 아예 안 태운다.
      카드는 `.cm-line` 에 세로 간격을 주는 새 소비자이고, 스파이크 A 가 `margin` 대신 `padding`
      으로 피해 간 그 제약을 **기계가 지키는지** 확인해야 한다.
    how: "`BlockCardDecorator` + `blockCardTheme` 를 얹은 H1⊃H2⊃H3 문서 픽스처. 판정은 기존과 동일(`drift === 0`, `delta ±1`)"
  - id: "T4"
    what: "§5.0.4 게이트 보강"
    items:
      - "[ ] 대량 붙여넣기 — N=200 전체 붙여넣기 INP. 평시 대비 유의한 폭주 없을 것"
      - "[ ] 대량 문서 내 연속 타이핑 — 8-C 는 1회 재빌드만 쟀다. 지속 입력 누적 비용 미측정"
      - "[ ] CLS — 카드 적용 시 레이아웃 시프트 허용 범위"
      - "[ ] 「카드 시각 동등」 판정 기준 정정 — §5.13 참고. 두 경로는 헤딩 배지에서 **구조적으로 동일할 수 없다**"
