badge_finding:
  status: "**기존 결함 확정. 신규 회귀 아님** — 사용자 정정"
  detail: >
    "블록을 눌러 커서를 활성화하지 않으면 배지가 렌더링되지 않는다" 는 현상이 초기부터 있었고
    사용자가 **성능 최적화라고 생각해 보고하지 않았다.**
  root_cause: >
    `HeadingDecorator.ts:49-51` 은 `line.number === doc.lineAt(cursorHead).number` 면 원문을
    노출한다(의도된 마크업 노출 UX). 그런데 **블록당 CM 에서 포커스 안 된 뷰의 `cursorHead` 는
    기본값 0** 이고 **각 블록 1행이 곧 헤딩 라인**이라, `doc.lineAt(0)` 이 헤딩 라인을 가리켜
    "커서가 여기 있다"로 오판한다 → 배지 대신 원문 `##`.
    **성능 최적화가 아니라 블록당 CM 설계가 만든 부작용이다.**
  effect_of_transition: >
    단일 CM 은 `cursorHead` 가 문서 전체에 하나뿐이므로 **커서 라인 하나만 원문, 나머지는 전부 배지** —
    **원래 의도한 동작이다. 전환이 이 결함을 부수적으로 고친다.**
  action: "기존 경로 결함으로 티켓 기록(단독 수정 불필요 — 전환이 고친다) · §5.0.4 판정 기준 정정(T4)"
  lesson: >
    사용자가 **"의도된 동작이겠지"라고 생각해 신고하지 않은 결함**이 초기부터 있었다.
    `code_review.md` §0 의 "계획에서 빠진 소비자와 테스트가 없는 소비자가 같은 집합"의 **사용자 버전**이다.
