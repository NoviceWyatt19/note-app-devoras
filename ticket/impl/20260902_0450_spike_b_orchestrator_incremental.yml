notes:
  - >
    **`Open Q #5` 와 같은 지점이다.** `protectedRegions.ts` 의 N² 부채(각 데코레이터가 타 데코레이터의
    점유 범위를 독립 계산)는 단일 CM 에서 **문서 전체 규모로 확대**된다. 이 스파이크는 두 문제를
    함께 푸는 기회이며, `architecture_stages.md` Stage 5 의 "점유 범위를 오케스트레이터가 소유"
    설계와 정확히 같은 방향이다. **다만 범위를 넓히지 말 것** — 이 스파이크의 질문은 비용이지 결합도가 아니다.
  - "이 작업은 **단일 CM 을 채택하지 않아도 부분적으로 값어치가 있다** — 증분화 자체는 현행 구조에서도 셀렉션 재빌드 비용을 줄인다. 다만 현행에서는 doc 가 작아 효과가 작으므로, **그 이유로 이 스파이크를 정당화하지는 않는다**"
