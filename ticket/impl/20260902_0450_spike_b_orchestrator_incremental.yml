judgment:
  pass: >
    N=200 규모 문서에서 **키 입력 1회 · 화살표 1회의 데코레이션 재빌드 비용이 N 에 비례하지
    않을 것.** 즉 N=50 / 100 / 200 에서 재빌드 시간이 평평해야 한다.
  fail: "어느 설계로도 선형 이하로 못 내리면 → **안건 종결.** E7 가상화로 복귀한다"
  measurement_discipline: >
    **DEBUG_STEP_PLAN §5 규칙 준수 필수** — 조건별 워밍업 1회 폐기 · 3회 반복 중앙값 ·
    조건 인터리브. 그리고 측정 전 `document.visibilityState === 'visible'` 과 rAF 60fps 를
    **먼저 확인**한다. §3-A-1 이 이것을 안 해서 세션 하나를 통째로 날렸다.
