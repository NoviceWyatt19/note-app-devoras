problem:
  location: "project/src/shared/lib/editor/decorators/orchestrator.ts:27-46 (`buildAll`) · :331 (재빌드 조건)"
  current_code: |
    function buildAll(state, decorators) {
      // Since Devoras splits blocks into separate CodeMirror instances,
      // doc.length is small enough to parse the whole block synchronously.
      const from = 0;
      const to = state.doc.length;
      const sets = decorators.map((d) => d.createDecorations(state, from, to));
      return RangeSet.join(sets);
    }
    // :331
    if (tr.docChanged || tr.selection || tr.effects.some(e => e.is(setImeEffect))) {
      return buildAll(tr.state, decorators);
    }
  the_trap: >
    **소스 주석이 스스로 전제를 밝혀 뒀다** — "블록당 CM 이라 doc.length 가 작아서 괜찮다".
    단일 CM 이 그 전제를 직접 파괴한다. 전환 후에는 **키 입력 1회와 화살표 1회마다 12개
    데코레이터가 문서 전체를 훑는다.** 마운트의 O(N^1.76) 을 **입력당 O(N)×12** 로 바꾸는 거래다.
    `single_cm_transition.md` §4.1 의 예제(`scanBlockRanges(doc)`)가 정확히 이 함정에 빠져 있다.
# ━━━
the_structural_tension:
  note: "이것이 이 스파이크가 '설계 과제'인 이유다. 뷰포트로 감싸는 한 줄이 아니다"
  a: "**뷰포트 한정 빌드는 `ViewPlugin` 을 요구한다** — `view.visibleRanges` 는 ViewPlugin 에서만 접근 가능하다"
  b: >
    **다중 라인 `Decoration.replace` 는 `StateField` 를 요구한다** — CM6 는 뷰포트를 계산하기
    전에 높이에 영향을 주는 데코레이션을 알아야 하므로 ViewPlugin 이 제공할 수 없다.
    현행이 StateField 인 이유가 정확히 이것이다(`orchestrator.ts:317` 주석 "to support multi-line replacement").
  c: >
    **그 다중 라인 replace 는 실재한다** — `impl/LatexDecorator.ts:161-172`, KaTeX 블록 펜스가
    여는 펜스(`fenceFrom`) ~ 닫는 펜스(`fenceTo`)를 replace 한다. 나머지 replace 는 전부
    same-line 가드가 걸려 있다(BUG-20260810-05).
  d: >
    **셀렉션 재빌드를 그냥 끌 수 없다** — 데코레이터들이 커서 위치를 읽는다
    (`LatexDecorator.ts:164` `cursorInside`). 커서가 들어가면 위젯을 풀고 원문을 보여주는 것이
    이 에디터의 마크업 노출/은닉 UX 의 본질이다. 끄면 기능이 죽는다.
