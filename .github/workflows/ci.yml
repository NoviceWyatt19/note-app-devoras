name: CI

on:
  push:
    branches: [main]
  pull_request:

# lint 기준선 — 래칫(줄면 낮춘다). IMPL_PLAN_R3_RELEASE_ENGINEERING.md §3.3 참고.
# 0 이 되기 전까지는 차단 게이트로 승격하지 않는다.
env:
  LINT_BASELINE: 124

jobs:
  ci:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: project

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read .nvmrc
        id: nvmrc
        run: echo "node_version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
        working-directory: .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nvmrc.outputs.node_version }}
          cache: pnpm
          cache-dependency-path: project/pnpm-lock.yaml

      - name: Enable Corepack (pnpm version pinned via packageManager field)
        run: corepack enable

      # ── 차단 게이트 4종 ────────────────────────────────────────────────
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Version sync check
        run: node scripts/check-version-sync.mjs

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: test:t1
        run: pnpm test:t1

      - name: test:t15
        run: pnpm test:t15

      # ── lint — 비차단, 기준선 비교 ─────────────────────────────────────
      - name: Lint (non-blocking, baseline comparison)
        run: |
          set +e
          pnpm lint > /tmp/lint_output.txt 2>&1
          echo "----- lint output -----"
          cat /tmp/lint_output.txt
          echo "------------------------"

          # eslint 요약 줄: "✖ N problems (E errors, W warnings)"
          COUNT=$(grep -oE '✖ [0-9]+ problems' /tmp/lint_output.txt | grep -oE '[0-9]+' | head -1)

          if [ -z "$COUNT" ]; then
            echo "⚠️ lint 문제 수를 못 읽었다 — eslint 출력 형식이 바뀌었을 수 있다. 기준선 비교를 건너뛴다."
            exit 0
          fi

          echo "lint 문제 수: $COUNT (기준선: $LINT_BASELINE)"

          if [ "$COUNT" -gt "$LINT_BASELINE" ]; then
            echo "::warning::lint 문제가 기준선($LINT_BASELINE)보다 늘었다: $COUNT 건. 새 커밋이 lint 오류를 추가했는지 확인할 것."
          elif [ "$COUNT" -lt "$LINT_BASELINE" ]; then
            echo "::notice::lint 문제가 기준선($LINT_BASELINE)보다 줄었다: $COUNT 건. ci.yml 의 LINT_BASELINE 을 낮춰 래칫할 것. 0 이 되면 차단 게이트로 승격."
          else
            echo "lint 문제 수가 기준선과 동일하다."
          fi

          exit 0
