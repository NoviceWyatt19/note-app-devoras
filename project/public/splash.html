<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Devoras Loading</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d1117; /* Solid dark background to hide OS white window */
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      border-radius: 12px; /* Smooth corners if OS supports it */
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 4px;
      color: #8b5cf6; /* text-primary */
      margin-bottom: 24px;
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(139, 92, 246, 0.1);
      border-top-color: #8b5cf6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body data-tauri-drag-region>
  <div class="splash-container" data-tauri-drag-region>
    <div class="logo" data-tauri-drag-region>DEVORAS</div>
    <div class="spinner"></div>
  </div>
</body>
</html>
